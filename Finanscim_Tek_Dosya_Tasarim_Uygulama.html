<title>Finansçım</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7FAF9;--surface:#FFFFFF;--ink:#132326;--ink-soft:#5A7378;--border:#DCE8E6;
  --accent:#0E7C86;--accent-soft:#DEF0EF;
  --debt:#B3483C;--debt-soft:#F7E9E7;
  --paid:#2F8F6F;--paid-soft:#E1F2E9;
  --pending:#B8791F;--pending-soft:#F6ECDA;
  --soon:#A8901A;--soon-soft:#FBF3CE;
  --purple:#3B6B95;--purple-soft:#E4ECF5;
  --font-display:'Fraunces',serif;--font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B1D;--surface:#16292B;--ink:#EAF3F2;--ink-soft:#8FADB0;--border:#25393C;
    --accent:#4FC3C9;--accent-soft:#1B3335;
    --debt:#E08478;--debt-soft:#2E2220;
    --paid:#6FCBA6;--paid-soft:#1B332B;
    --pending:#E0AD5F;--pending-soft:#2E2718;
    --soon:#D9C15E;--soon-soft:#332C12;
    --purple:#8CB2DE;--purple-soft:#1E2A3A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B1D;--surface:#16292B;--ink:#EAF3F2;--ink-soft:#8FADB0;--border:#25393C;
  --accent:#4FC3C9;--accent-soft:#1B3335;--debt:#E08478;--debt-soft:#2E2220;
  --paid:#6FCBA6;--paid-soft:#1B332B;--pending:#E0AD5F;--pending-soft:#2E2718;
  --soon:#D9C15E;--soon-soft:#332C12;
  --purple:#8CB2DE;--purple-soft:#1E2A3A;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;touch-action:manipulation;}
button{font-family:var(--font-body);}
.app{display:flex;height:100vh;max-width:520px;margin:0 auto;position:relative;}

.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:5;position:relative;}
.topbar-left{display:flex;align-items:center;gap:10px;z-index:1;}
.topbar-right{display:flex;align-items:center;gap:4px;margin-left:auto;z-index:1;}
.topbar-ai-icon{font-size:19px;line-height:1;}
.topbar-title-centered{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-display);
  font-weight:500;font-size:19px;margin:0;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .header-action{background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:4px 6px;}
.notif-badge{position:absolute;top:2px;right:2px;background:var(--debt);color:#fff;font-size:10px;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}
.content{flex:1;overflow-y:auto;padding:16px 16px 70px;}
.storage-warning{background:var(--debt);color:#fff;padding:10px 14px;font-size:12px;text-align:center;line-height:1.4;}

.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:9;}
.drawer-backdrop.open{display:block;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--surface);border-right:1px solid var(--border);
  transform:translateX(-100%);transition:transform .22s ease;z-index:10;display:flex;flex-direction:column;padding:18px 10px;}
.drawer.open{transform:translateX(0);}
.drawer-header{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
.logo-icon{font-size:22px;}
.app-name{font-family:var(--font-display);font-weight:600;font-size:17px;}
.app-tagline{font-size:11px;color:var(--ink-soft);}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  padding:11px 12px;border-radius:10px;font-size:14.5px;color:var(--ink);cursor:pointer;}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav-divider{height:1px;background:var(--border);margin:8px 6px;}

/* HOME */
.hero-card{background:linear-gradient(135deg,var(--accent),#164f46);color:#fff;border-radius:16px;padding:20px 18px;}
:root[data-theme="dark"] .hero-card,@media (prefers-color-scheme:dark){}
.hero-label{font-size:12.5px;opacity:.85;margin:0 0 4px;}
.hero-number{font-family:var(--font-display);font-size:36px;font-weight:500;margin:0;cursor:pointer;}
.hero-inline-input{background:rgba(255,255,255,.94);color:#1C2127;border:none;border-radius:8px;padding:3px 12px;
  font-size:28px;font-family:var(--font-display);font-weight:500;text-align:center;width:75%;}
.top-date{text-align:center;font-size:12px;color:var(--ink-soft);margin:0 0 8px;}
.stat-row{display:flex;gap:10px;margin-top:14px;}
.stat-box{flex:1;background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;}

.fin-card{display:flex;flex-direction:column;gap:4px;margin-bottom:4px;}
.fin-row{display:grid;grid-template-columns:30px 156px 1fr;align-items:center;gap:8px;padding:7px 11px;
  border-radius:12px;color:#fff;}
.fin-row .fr-icon{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fin-row .fr-text{min-width:0;}
.fin-row .fr-label{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fin-row .fr-sub{font-size:9.5px;opacity:.7;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fin-row .fr-value-wrap{display:flex;align-items:center;justify-content:flex-end;gap:5px;min-width:0;margin-left:auto;width:100%;}
.fin-row .fr-value{font-family:var(--font-display);font-size:18px;font-weight:700;white-space:nowrap;text-align:right;}
.fin-row .fr-value.editable{cursor:pointer;}
.fin-row .fr-edit-icon{opacity:.85;font-size:11px;flex-shrink:0;cursor:pointer;}
.fin-inline-input{background:rgba(255,255,255,.94);color:#1C2127;border:none;border-radius:6px;padding:1px 7px;
  font-size:16px;font-family:var(--font-display);font-weight:700;width:100px;}
.fin-note{text-align:center;font-size:10.5px;color:var(--ink-soft);margin:6px 0 2px;}
.stat-box .l{font-size:11px;opacity:.85;}
.stat-box .v{font-size:15px;font-weight:600;margin-top:2px;font-family:var(--font-display);}

.section-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin:14px 2px 6px;}
.ai-module{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--border);
  border-radius:14px;padding:13px 14px;margin-top:6px;}
.ai-module-icon{width:38px;height:38px;border-radius:11px;background:var(--surface);display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;}
.ai-module-title{font-size:13.5px;font-weight:600;color:var(--ink);}
.ai-module-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.dist-row{display:flex;align-items:center;gap:12px;padding:7px 6px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface);}
.dist-row:first-child{border-radius:12px 12px 0 0;}
.dist-row:last-child{border-bottom:none;border-radius:0 0 12px 12px;}
.card-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.dist-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.dist-name{font-size:14px;font-weight:500;flex:1;}
.dist-amt{font-family:var(--font-display);font-size:14.5px;font-weight:500;}
.dist-arrow{color:var(--ink-soft);font-size:13px;}

.big-add-btn{width:100%;padding:11px;border-radius:12px;border:none;background:var(--accent);color:#fff;
  font-weight:600;font-size:14.5px;cursor:pointer;margin-top:18px;}

/* LIST ITEMS shared */
[data-lp-type],button,.choice-row,.bank-chip,.cat-chip,.day-cell,.item-card,.credit-card,.dist-row,.fin-row,.inst-row,
.notif-row,.wheel-item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
.record-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.record-top{display:flex;align-items:center;gap:10px;}
.record-avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.record-title{font-size:15px;font-weight:700;}
.record-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.record-status-pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:12.5px;
  font-weight:700;white-space:nowrap;}
.record-status-pill.odendi{background:var(--paid-soft);color:var(--paid);}
.record-status-pill.bekliyor{background:var(--pending-soft);color:var(--pending);}
.record-status-pill.gecikti{background:var(--debt-soft);color:var(--debt);}
.record-chevron{color:var(--ink-soft);font-size:15px;margin-left:2px;}
.market-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 18px;}
.market-mini{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 7px;text-align:center;}
.market-mini .mi{font-size:17px;line-height:1.1;}
.market-mini .ml{font-size:9.5px;color:var(--ink-soft);margin-top:3px;}
.market-mini .mv{font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--ink);margin-top:2px;white-space:nowrap;}
.market-mini .ms{font-size:8.5px;color:var(--ink-soft);margin-top:1px;}
.kmh-interest-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin:8px 0 12px;}
.kmh-interest-row .left{min-width:0;}
.kmh-interest-row .title{font-size:12.5px;font-weight:700;color:var(--ink);}
.kmh-interest-row .sub{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
@media(max-width:430px){.market-strip{gap:5px}.market-mini{padding:8px 4px}.market-mini .mv{font-size:11px}}
.record-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;}
.record-stat .l{font-size:10.5px;color:var(--ink-soft);min-height:26px;line-height:1.25;display:flex;align-items:flex-start;}
.record-stat .v{font-size:13.5px;font-weight:700;font-family:var(--font-display);margin-top:2px;color:var(--accent);}
.kmh-interest-note{font-size:11px;color:var(--ink-soft);margin-top:8px;}
.dashed-add-card{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:14px;
  padding:14px;cursor:pointer;margin-bottom:14px;background:none;width:100%;text-align:left;}
.dashed-add-icon{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dashed-add-title{font-size:14px;font-weight:700;color:var(--accent);}
.dashed-add-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.page-back-btn{display:flex;align-items:center;gap:6px;justify-content:center;margin-left:auto;width:fit-content;
  padding:11px 20px;border-radius:24px;background:var(--surface);border:1px solid var(--border);color:var(--ink);
  font-size:14px;font-weight:700;cursor:pointer;}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.item-title{font-size:14.5px;font-weight:600;margin:0;}
.item-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.item-amt{font-family:var(--font-display);font-size:17px;font-weight:500;white-space:nowrap;}
.item-progress{height:5px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden;}
.item-progress-fill{height:100%;background:var(--accent);}
.item-meta-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
.pill{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;display:inline-block;}
.pill.bekliyor{background:var(--pending-soft);color:var(--pending);}
.pill.odendi{background:var(--paid-soft);color:var(--paid);}
.pill.gecikti{background:var(--debt-soft);color:var(--debt);}

.notif-wrap{position:relative;overflow:hidden;border-radius:12px;margin-bottom:7px;}
.notif-delete-bg{position:absolute;inset:0;background:var(--debt);color:#fff;display:flex;align-items:center;
  justify-content:flex-end;padding-right:22px;font-size:17px;border-radius:12px;}
.notif-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;position:relative;
  touch-action:pan-y;user-select:none;}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.confirm-box{background:var(--surface);border-radius:16px;padding:20px;max-width:320px;width:100%;}
.confirm-box p{margin:0 0 16px;font-size:14.5px;color:var(--ink);line-height:1.4;}
.confirm-box .danger-btn{margin-top:0;margin-bottom:8px;}
.notif-row.sev-overdue{background:var(--debt-soft);}
.notif-row.sev-today{background:var(--pending-soft);}
.notif-row.sev-soon{background:var(--soon-soft);}
.notif-row .n-name{font-size:14px;font-weight:600;}
.notif-row.sev-overdue .n-name{color:var(--debt);}
.notif-row.sev-today .n-name{color:var(--pending);}
.notif-row.sev-soon .n-name{color:var(--soon);}
.notif-row .n-sub{font-size:11.5px;opacity:.85;margin-top:1px;}
.notif-row .n-amt{font-family:var(--font-display);font-size:14.5px;font-weight:600;margin-left:auto;}

.empty{text-align:center;padding:34px 10px;color:var(--ink-soft);font-size:13.5px;}

.fab{position:fixed;left:18px;bottom:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);
  color:#fff;border:none;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:6;
  display:flex;align-items:center;justify-content:center;}
.home-fab{position:fixed;right:22px;bottom:30px;width:50px;height:50px;border-radius:50%;background:var(--surface);
  border:1px solid var(--border);color:var(--ink);font-size:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.15);cursor:pointer;z-index:6;}
.ai-chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 120px);}
.ai-messages{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:8px;}
.ai-bubble{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;}
.ai-bubble.ai-user{align-self:flex-end;background:var(--accent);color:#fff;border-radius:14px 14px 3px 14px;}
.ai-bubble.ai-assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 14px 3px;}
.ai-bubble.ai-thinking{color:var(--ink-soft);font-style:italic;}
.ai-confirm-row{display:flex;gap:8px;margin-top:8px;}
.ai-input-row{display:flex;align-items:center;gap:8px;padding:10px 4px 4px;border-top:1px solid var(--border);}
.ai-header-row{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 6px;}
.ai-close-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  color:var(--ink);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-input-box{flex:1;border:1px solid var(--border);border-radius:20px;padding:10px 14px;font-size:14px;
  background:var(--surface);color:var(--ink);}
.ai-send-btn{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:10px 16px;font-size:13.5px;
  font-weight:600;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;}
.ai-send-btn:disabled{opacity:0.6;cursor:default;}
.ai-input-box:disabled{opacity:0.6;}
.ai-send-spinner{display:inline-block;width:12px;height:12px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;animation:ai-spin 0.7s linear infinite;}
@keyframes ai-spin{to{transform:rotate(360deg);}}
/* month switcher */
.month-switch{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0 18px;}
.month-switch button{background:var(--surface);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;
  font-size:16px;color:var(--ink);cursor:pointer;}
.month-switch .m-label{font-family:var(--font-display);font-size:16px;font-weight:500;min-width:130px;text-align:center;}

/* summary bar (aylık/kart/fatura) */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.summary-cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.summary-cell .l{font-size:11px;color:var(--ink-soft);}
.summary-cell .v{font-family:var(--font-display);font-size:16px;margin-top:2px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20;}
.modal-backdrop.open{display:flex;}
.modal-sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;}
.modal-sheet h3{font-family:var(--font-display);font-weight:500;font-size:19px;margin:0 0 16px;}
.field{margin-bottom:6px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
.field-row.aligned-row{align-items:flex-end;}
.field-row.aligned-row .field{flex:1;min-width:0;}
.field-row.aligned-row .field label{display:flex;align-items:flex-end;min-height:30px;line-height:1.2;margin-bottom:5px;}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:16px;font-family:var(--font-body);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.choice-row{display:flex;gap:7px;flex-wrap:wrap;}
.choice-row button{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);
  display:inline-flex;align-items:center;gap:4px;
  color:var(--ink-soft);font-size:12.5px;cursor:pointer;}
.choice-row button.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.save-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}
.cancel-btn{width:100%;padding:10px;border:none;background:none;color:var(--ink-soft);font-size:13.5px;cursor:pointer;}
.danger-btn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--debt);background:none;color:var(--debt);
  font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;}
.amount-fixed-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:13px;}
.amount-fixed-row .field{flex:1;margin-bottom:0;}
.fixed-toggle-mini{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:11px;flex-shrink:0;}
.fixed-toggle-mini span{font-size:9px;color:var(--ink-soft);white-space:nowrap;}
.switch{width:40px;height:22px;border-radius:12px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.switch.on .knob{left:20px;}

/* installment table */
.inst-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.inst-row:last-child{border-bottom:none;}
.row-toggle{border:none;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.row-toggle.bekliyor{background:var(--pending-soft);color:var(--pending);}
.row-toggle.odendi{background:var(--paid-soft);color:var(--paid);}
.row-toggle.gecikti{background:var(--debt-soft);color:var(--debt);}
.inst-date{font-size:13px;width:70px;flex-shrink:0;color:var(--ink-soft);}
.inst-amt{flex:1;font-size:14px;font-weight:500;font-family:var(--font-display);}

.back-link{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:0 0 12px;display:flex;align-items:center;gap:4px;}

.bank-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.bank-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px;
  border-radius:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;}
.bank-chip span:last-child{font-size:10px;line-height:1.15;color:var(--ink-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.bank-chip.active{border-color:var(--accent);background:var(--accent-soft);}
.bank-chip.active span:last-child{color:var(--accent);font-weight:600;}
.bank-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:9.5px;font-weight:700;flex-shrink:0;}
.bank-avatar.sm{width:34px;height:34px;font-size:12px;}
.item-title-row{display:flex;align-items:center;gap:8px;}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.cat-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;
  border-radius:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;}
.cat-chip .ic{font-size:18px;}
.cat-chip .lbl{font-size:10.5px;color:var(--ink-soft);line-height:1.2;}
.cat-chip.active{border-color:var(--accent);background:var(--accent-soft);}
.cat-chip.active .lbl{color:var(--accent);font-weight:600;}

.credit-card{display:flex;align-items:stretch;border-radius:16px;padding:0;color:#fff;position:relative;overflow:hidden;
  margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.16);min-height:140px;}
.credit-card::after{content:'';position:absolute;right:-25px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:rgba(255,255,255,.10);}
.cc-left{width:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:12px 6px;border-right:1px solid rgba(255,255,255,.32);text-align:center;position:relative;z-index:1;}
.cc-left .bank-mark{font-size:17px;font-weight:700;letter-spacing:.02em;}
.cc-left .bank-name{font-size:10.5px;opacity:.92;line-height:1.3;}
.cc-left .cc-due{font-size:9px;opacity:.78;margin-top:1px;}
.cc-right{width:70%;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:34px 16px 12px;position:relative;z-index:1;}
.cc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.cc-row .l{font-size:10.5px;opacity:.85;}
.cc-row .v{font-size:14px;font-weight:600;font-family:var(--font-display);}
.cc-row .v.editable{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.55);padding-bottom:1px;}
.cc-inline-input{width:90px;padding:2px 5px;border-radius:5px;border:none;font-size:16px;font-family:var(--font-display);
  font-weight:600;text-align:right;background:rgba(255,255,255,.92);color:#1C2127;}
.cc-status-btn{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.24);
  border:none;color:#fff;padding:5px 10px 5px 8px;border-radius:20px;cursor:pointer;z-index:2;display:flex;align-items:center;gap:3px;}
.cc-status-btn.is-paid{background:rgba(255,255,255,.92);color:#2F8F6F;}
.cc-settings-btn{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);
  border:none;color:#fff;font-size:11px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;}
.cc-interest-toggle{position:absolute;bottom:8px;right:10px;font-size:9.5px;font-weight:600;background:rgba(255,255,255,.2);
  color:#fff;border:1px solid rgba(255,255,255,.4);padding:4px 9px;border-radius:20px;cursor:pointer;z-index:2;}
.cc-interest-toggle.active{background:rgba(255,255,255,.92);color:var(--paid);border-color:transparent;}

.day-picker{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:9px 8px 7px;}
.day-picker-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 5px;}
.day-picker-head span{font-family:var(--font-display);font-size:13px;color:var(--ink);}
.day-picker-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.day-picker-weekdays span{font-size:9.5px;color:var(--ink-soft);text-align:center;font-weight:600;}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.day-cell{aspect-ratio:1;max-width:26px;width:100%;margin:0 auto;border-radius:50%;border:none;background:transparent;
  color:var(--ink);font-size:11.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font-body);}
.day-cell:hover{background:var(--accent-soft);}
.day-cell.active{background:var(--accent);color:#fff;font-weight:600;}

.wheel-picker{position:relative;display:flex;height:96px;background:var(--bg);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;}
.wheel-col{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none;}
.wheel-col::-webkit-scrollbar{display:none;}
.wheel-item{height:34px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body);}
.wheel-item.selected{color:var(--ink);font-weight:700;font-family:var(--font-display);font-size:15px;}
.wheel-spacer{height:31px;flex-shrink:0;}
.wheel-highlight{position:absolute;top:31px;left:0;right:0;height:34px;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);pointer-events:none;}
.cat-icon-row{display:flex;align-items:center;gap:10px;}
.cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}

@media (min-width:521px){ .app{border-left:1px solid var(--border);border-right:1px solid var(--border);} }

/* ===== FINANSCIM DESIGN SYSTEM V2 ===== */
:root{--page-bg:#f5fbff;--card:#fff;--line:#dbe8f3;--blue:#163bb2;--blue2:#287be8;--teal:#08b4ad;--teal2:#058f9a;--soft-blue:#eaf4ff;--soft-teal:#e8faf7;--soft-purple:#f2ecff;--soft-red:#fff0f2;--soft-yellow:#fff8df;}
body{background:linear-gradient(180deg,#f8fcff 0%,#eef8fc 100%);}
.topbar{display:none!important}.main{max-width:100%;padding:0 14px 28px}.content{padding:0;}
.page-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 2px 10px;position:sticky;top:0;background:rgba(245,251,255,.94);backdrop-filter:blur(10px);z-index:4}
.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand-mark{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#0b557f,#08b4ad);position:relative;box-shadow:0 5px 14px rgba(6,90,130,.18)}
.brand-mark:before{content:'✦';position:absolute;right:5px;top:-8px;color:#15c49e;font-size:23px}.brand-mark:after{content:'▰';position:absolute;right:7px;bottom:8px;color:#9ff4e3;font-size:11px}.brand-name{font-family:var(--font-display);font-size:22px;color:#102b9e;font-weight:700;white-space:nowrap}.brand-sub{font-size:9px;color:#5872a8;margin-top:-2px;white-space:nowrap}
.page-head-center{text-align:center}.page-head-title{font-family:var(--font-display);font-size:22px;color:#102b9e;font-weight:700;line-height:1.05}.page-date{font-size:11px;color:#6478b2;margin-top:4px}.head-bell{justify-self:end;border:0;background:none;font-size:25px;position:relative;cursor:pointer}.head-bell .mini-badge{position:absolute;right:-2px;top:-3px;background:#ff3d4f;color:#fff;border-radius:50%;font:700 10px var(--font-body);min-width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.hero-card{background:linear-gradient(135deg,#eaf6ff,#f4fffd);border:1px solid #d6e9f7;border-radius:20px;padding:14px 15px;margin:4px 0 14px;box-shadow:0 8px 22px rgba(45,96,140,.06)}

<script>
(function(){
'use strict';
const STORAGE_KEY = 'borcum-full-v1';
const GOLD_RATE = 6850; // 16 Eylül 2026 itibarıyla piyasadaki yaklaşık 24 ayar gram altın fiyatı (TL) - gerçek sürümde canlı API'den güncellenecek
const FX = { USD: 48.65, EUR: 56.23 }; // 16 Eylül 2026 itibarıyla yaklaşık serbest piyasa kuru - gerçek sürümde canlı API
let LIVE_MARKET = { USD: FX.USD, EUR: FX.EUR, GOLD: GOLD_RATE, BIST: null, updatedAt:null };
async function refreshMarketRates(){
  try{
    const r=await fetch('https://dolartoday.org/api/rates?symbols=USD,EUR,GA',{cache:'no-store'});
    if(!r.ok) throw new Error('market http '+r.status);
    const j=await r.json();
    const rates=j && j.rates ? j.rates : null;
    if(rates){
      const usd=rates.USD||rates.usd, eur=rates.EUR||rates.eur, gold=rates.GA||rates.ga;
      if(usd) LIVE_MARKET.USD=Number(usd.sell||usd.rate||usd);
      if(eur) LIVE_MARKET.EUR=Number(eur.sell||eur.rate||eur);
      if(gold) LIVE_MARKET.GOLD=Number(gold.sell||gold.rate||gold);
      LIVE_MARKET.updatedAt=j.updated_at||new Date().toISOString();
      window.dispatchEvent(new Event('market-rates-updated'));
    }
  }catch(e){ console.warn('[Finansçım] Canlı piyasa verisi alınamadı:',e); }
}
function marketRate(unit,side='sell'){ if(unit==='USD') return LIVE_MARKET.USD||FX.USD; if(unit==='EUR') return LIVE_MARKET.EUR||FX.EUR; return LIVE_MARKET.GOLD||GOLD_RATE; }
const GOLD_UNITS = { gram22:0.916, gram24:1, ceyrek:1.75, yarim:3.5, tam:7, cumhuriyet:7.2, ata:6.6 };
const GOLD_LABELS = { gram22:'22 Ayar Gram', gram24:'24 Ayar Gram', ceyrek:'Çeyrek', yarim:'Yarım', tam:'Tam', cumhuriyet:'Cumhuriyet', ata:'Ata' };
const DEBT_TYPE_ICONS = {
  TL: { icon:'₺', bg:'var(--accent-soft)', color:'var(--accent)' },
  Altin: { icon:`<svg viewBox="0 0 40 40" width="22" height="22" style="display:block;">
      <defs><radialGradient id="goldGrad" cx="35%" cy="32%"><stop offset="0%" stop-color="#FFF2C4"/><stop offset="55%" stop-color="#E8C34A"/><stop offset="100%" stop-color="#B8860B"/></radialGradient></defs>
      <circle cx="14" cy="22" r="13" fill="url(#goldGrad)" stroke="#8A6100" stroke-width="1.1"/>
      <circle cx="14" cy="22" r="9.5" fill="none" stroke="#8A6100" stroke-width="0.6" stroke-dasharray="1.3,1.3" opacity="0.6"/>
      <text x="14" y="26" text-anchor="middle" font-size="8.5" font-family="Georgia,serif" fill="#6B4A00" font-weight="700">★</text>
      <circle cx="26" cy="18" r="13" fill="url(#goldGrad)" stroke="#8A6100" stroke-width="1.1"/>
      <circle cx="26" cy="18" r="9.5" fill="none" stroke="#8A6100" stroke-width="0.6" stroke-dasharray="1.3,1.3" opacity="0.6"/>
      <text x="26" y="22" text-anchor="middle" font-size="8.5" font-family="Georgia,serif" fill="#6B4A00" font-weight="700">★</text>
    </svg>`, bg:'var(--pending-soft)', color:'var(--pending)' },
  Doviz: { icon:'$', bg:'var(--purple-soft)', color:'var(--purple)' },
};
const CAT_ICONS = { kredi:{icon:'🏦',bg:'var(--accent-soft)',color:'var(--accent)'}, kart:{icon:'💳',bg:'var(--pending-soft)',color:'var(--pending)'},
  kmh:{icon:'🏧',bg:'var(--soon-soft)',color:'var(--soon)'},
  fatura:{icon:'🧾',bg:'var(--debt-soft)',color:'var(--debt)'}, elden:{icon:'🤝',bg:'var(--paid-soft)',color:'var(--paid)'} };
const KMH_MONTHLY_INTEREST_RATE = 0.0435; // Varsayılan aylık akdi faiz oranı (%4,35) — bankana göre değişebilir, KMH ayarlarından düzenlenebilir hale getirilecek.
const KMH_TAX_RATES = { bsmv: 0.15, kkdf: 0.15 }; // BSMV ve KKDF, hesaplanan NET FAİZ tutarının %15'i olarak uygulanır (doğrulanmış güncel oran).

/**
 * Bir KMH hesabının işlem geçmişine (kullanım/ödeme hareketleri) göre, verilen tarihe
 * kadar biriken GÜNLÜK bazlı faizi ve üzerine eklenen BSMV/KKDF'yi hesaplar.
 * transactions: [{date:'YYYY-MM-DD', amount:number}] — amount pozitifse kullanım (borç artışı),
 * negatifse ödeme (borç azalışı). Kronolojik sırayla, her aralıkta o andaki anaparaya göre
 * gün bazlı faiz işletilir — "toplam borç × sabit oran" gibi hatalı bir kısayol KULLANILMAZ.
 */
function calculateKmhInterest(transactions, uptoDateStr, monthlyRate){
  monthlyRate = monthlyRate==null ? KMH_MONTHLY_INTEREST_RATE : monthlyRate;
  const dailyRate = monthlyRate / 30;
  const sorted = [...(transactions||[])].sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const uptoDate = new Date(uptoDateStr+'T00:00:00');
  let principal = 0;
  let totalInterest = 0;
  let lastDate = null;
  for(const tx of sorted){
    const txDate = new Date(tx.date+'T00:00:00');
    if(txDate > uptoDate) break;
    if(lastDate){
      const days = Math.round((txDate - lastDate) / 86400000);
      if(days>0 && principal>0) totalInterest += principal * dailyRate * days;
    }
    principal += tx.amount;
    lastDate = txDate;
  }
  if(lastDate){
    const days = Math.round((uptoDate - lastDate) / 86400000);
    if(days>0 && principal>0) totalInterest += principal * dailyRate * days;
  }
  const bsmv = totalInterest * KMH_TAX_RATES.bsmv;
  const kkdf = totalInterest * KMH_TAX_RATES.kkdf;
  return {
    principal: Math.round(principal),
    interest: Math.round(totalInterest),
    bsmv: Math.round(bsmv),
    kkdf: Math.round(kkdf),
    total: Math.round(totalInterest + bsmv + kkdf),
  };
}
/** Basit senaryo hesaplayıcı: "X TL'yi Y gün kullansam ne kadar öderim?" soruları için. */
function calculateKmhScenario(amount, days, monthlyRate){
  monthlyRate = monthlyRate==null ? KMH_MONTHLY_INTEREST_RATE : monthlyRate;
  return calculateKmhInterest([{date:'2000-01-01', amount}], addDaysStr('2000-01-01', days), monthlyRate);
}
function addDaysStr(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
const BILL_CATS = ['Elektrik','Su','Doğalgaz','Telefon','İnternet','Kira','Aidat','Abonelikler'];
const INVEST_TYPES = ['Hisse Senedi','Fon','Mevduat','Döviz Hesabı','Altın Hesabı','Kripto','Diğer'];
const INVEST_ICONS = { 'Hisse Senedi':'📈','Fon':'📊','Mevduat':'🏦','Döviz Hesabı':'💱','Altın Hesabı':'🪙','Kripto':'🌐','Diğer':'💼' };
const BILL_ICONS = {

const BANKS = [

  {code:'hsbc', name:'HSBC', short:'HSBC', color:'#DB0011', initials:'HSBC'},
  {code:'enpara', name:'Enpara', short:'Enpara', color:'#E6007E', initials:'EN'},

function bankByCode(code){ return BANKS.find(b=>b.code===code) || BANKS[BANKS.length-1]; }

    return `<select id="f_name">${SUBSCRIPTIONS.map(s=>`<option value="${s}" ${s===selectedName?'selected':''}>${s}</option>`).join('')}</select>`;
  }
  return `<input id="f_name" value="${selectedName?esc(selectedName):''}" placeholder="Örn: Ev Elektrik">`;
}
function shade(hex, percent){
  const n = parseInt(hex.replace('#',''),16);
  let r=(n>>16)+Math.round(255*(percent/100)), g=(n>>8&0xff)+Math.round(255*(percent/100)), b=(n&0xff)+Math.round(255*(percent/100));
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}

    </div>`).join('')}</div>`;

function initSwipeDelete(root){
  root.querySelectorAll('.notif-wrap').forEach(wrap=>{
    const row = wrap.querySelector('.notif-row');
    let startX=0, currentX=0, dragging=false;
    row.addEventListener('pointerdown', e=>{
      startX = e.clientX; dragging = true; currentX = 0;
      row.style.transition = 'none';
      row.setPointerCapture(e.pointerId);
    });
    row.addEventListener('pointermove', e=>{
      if(!dragging) return;
      currentX = e.clientX - startX;
      if(currentX < 0) row.style.transform = `translateX(${Math.max(currentX, -110)}px)`;
    });
    function finish(){
      if(!dragging) return;
      dragging = false;
      row.style.transition = 'transform .2s ease';
      if(currentX < -65){
        row.style.transform = 'translateX(-100%)';
        wrap.style.transition = 'max-height .2s ease .15s, margin .2s ease .15s, opacity .2s ease';
        wrap.style.opacity = '0';
        setTimeout(()=>{
          const key = wrap.dataset.notifKey;
          state.dismissedNotifs = state.dismissedNotifs || [];
          if(!state.dismissedNotifs.includes(key)) state.dismissedNotifs.push(key);
          save();
          updateNotifBadge();
          // Re-render the whole notifications list so an emptied section's
          // header doesn't linger behind and nothing gets left half-removed.
          if(modalCtx.kind === 'notifications'){
            $modalSheet.innerHTML = modalTemplates.notifications();
            initSwipeDelete($modalSheet);
          }
        }, 200);
      } else {
        row.style.transform = 'translateX(0)';
      }
      currentX = 0;
    }
    row.addEventListener('pointerup', finish);
    row.addEventListener('pointercancel', finish);
  });
}
function initWheelPickers(root){
  root.querySelectorAll('.wheel-col').forEach(col=>{
    const items = Array.from(col.querySelectorAll('.wheel-item'));
    const itemH = 34;
    function updateSelection(snap){
      let idx = Math.round(col.scrollTop / itemH);
      idx = Math.max(0, Math.min(items.length-1, idx));
      items.forEach((it,i)=>it.classList.toggle('selected', i===idx));
      col.dataset.value = items[idx] ? items[idx].dataset.val : '';
      if(snap) col.scrollTop = idx*itemH;
    }
    let timer;
    col.addEventListener('scroll', ()=>{
      clearTimeout(timer);
      timer = setTimeout(()=>updateSelection(true), 130);
    });
    items.forEach((it,i)=>{
      it.addEventListener('click', ()=>{ col.scrollTo({top:i*itemH, behavior:'smooth'}); });
    });
    const initIdx = parseInt(col.dataset.initial)||0;
    col.scrollTop = initIdx*itemH;
    updateSelection(false);
  });
}

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function addMonths(ym, n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y, m-1+n, 1); return monthKey(d); }
function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1,1);
  return d.toLocaleDateString('tr-TR',{month:'long',year:'numeric'}); }

// ---------- LOAN LOGIC ----------
// ---------- ORTAK 3-DURUM MANTIĞI (ÖDENDİ / BEKLİYOR / GECİKTİ) ----------
// Tüm borç türleri (kredi taksiti, kart ekstresi, fatura, KMH) için TEK bir merkezi kural:
// ödenmişse ÖDENDİ; ödenmemiş ve son ödeme günü henüz gelmemişse BEKLİYOR;
// ödenmemiş ve son ödeme günü geçmişse GECİKTİ. Yeni dönem her zaman ayın 1'inde başlar
// (ym, o kaydın ait olduğu ayı — takvim ayının kendisini — temsil eder; "son ödeme gününe
// N gün kala" tarzı bir erken geçiş YOKTUR).
function currentYm(){ return monthKey(new Date()); }
function periodStatus(paid, ym, dueDay){
  if(paid) return 'odendi';
  const dueDate = new Date(...ym.split('-').map((v,idx)=>idx===1?Number(v)-1:Number(v)), dueDay||1);
  return dueDate < new Date(new Date().setHours(0,0,0,0)) ? 'gecikti' : 'bekliyor';
}
function loanInstallments(loan){
  const list = [];
  for(let i=0;i<loan.count;i++){
    const ym = addMonths(loan.startMonth, i);
    const key = loan.id+'#'+i;
    const paid = state.loanStatus[key]==='odendi';
    const status = periodStatus(paid, ym, loan.dueDay);
    list.push({ index:i, ym, amount:loan.amount, status, key });
  }
  return list;
}
function loanRemaining(loan){
  return loanInstallments(loan).filter(i=>i.status!=='odendi').reduce((s,i)=>s+i.amount,0);
}
function loanInstallmentForMonth(loan, ym){
  return loanInstallments(loan).find(i=>i.ym===ym) || null;
}

// ---------- BILL LOGIC ----------
function prevMonthOverride(bill, ym){
  let cursor = ym;
  for(let i=0;i<12;i++){
    cursor = addMonths(cursor, -1);
    const ov = state.billOverrides[bill.id] && state.billOverrides[bill.id][cursor];
    if(ov) return ov;
  }
  return null;
}
function billRecord(bill, ym){
  const ov = state.billOverrides[bill.id] && state.billOverrides[bill.id][ym];
  if(ov) return { amount: ov.amount, status: periodStatus(ov.status==='odendi', ym, bill.dueDay), isEstimate:false, estimateType:null };
  const prev = prevMonthOverride(bill, ym);
  if(prev){
    return { amount: prev.amount, status: periodStatus(false, ym, bill.dueDay), isEstimate:true, estimateType: bill.isFixed?'sabit · geçen ayla aynı':'tahmini · geçen aya göre' };
  }
  return { amount: bill.estimatedAmount||0, status: periodStatus(false, ym, bill.dueDay), isEstimate:true, estimateType:'tahmini' };
}
function setBillRecord(billId, ym, amount, status){
  if(!state.billOverrides[billId]) state.billOverrides[billId]={};
  state.billOverrides[billId][ym] = { amount, status };
  save();
}

// ---------- CARD LOGIC ----------
function cardStatement(cardId, ym){
  return state.cardStatements.find(s=>s.cardId===cardId && s.ym===ym) || null;
}

// ---------- DEBT TL VALUE ----------
function debtTL(d){
  if(d.debtType==='TL') return d.amount;
  const side=d.direction==='borcum'?'sell':'buy';
  if(d.debtType==='Altin') return d.amount * (GOLD_UNITS[d.unit]||1) * marketRate('GOLD',side);
  if(d.debtType==='Doviz') return d.amount * (d.unit==='USD' ? marketRate('USD',side) : d.unit==='EUR' ? marketRate('EUR',side) : (FX[d.unit]||1));
  return 0;
}
function debtDisplay(d){
  if(d.debtType==='TL') return formatTL(d.amount);
  if(d.debtType==='Altin') return d.amount+' '+(GOLD_LABELS[d.unit]||d.unit);
  if(d.debtType==='Doviz') return d.amount.toLocaleString('tr-TR')+' '+d.unit;
  return '';
}

// ---------- AGGREGATES ----------
function totalDebt(){
  // Kalan Toplam Borç: krediler + kartlar + elden borçlar (döviz/altın dahil). Faturalar burada YOK —
  // faturaların "kalan toplam bakiyesi" kavramı yok, sadece aylık gider oldukları için Aylık Borç'a girerler.
  const loans = state.loans.reduce((s,l)=>s+loanRemaining(l),0);
  const cards = state.cards.reduce((s,c)=>s+(c.totalDebt||0),0);
  const kmh = state.kmhAccounts.reduce((s,k)=>s+kmhEffectiveDebt(k),0);
  const bills = state.bills.reduce((s,b)=>{
    if(b.autoPay) return s;
    const r = billRecord(b, state.selectedMonth);
    return s + (r.status!=='odendi' ? r.amount : 0);
  },0);
  const debts = state.debts.filter(d=>!d.paid && d.direction==='borcum').reduce((s,d)=>s+debtTL(d),0);
  return { loans, cards, kmh, bills, debts, total: loans+cards+kmh+debts };
}
function monthlyDue(ym){
  // Aylık Borç: seçilen ay içinde ödenmesi gereken toplam tutar (kredi taksiti, kart bu ayki tutarı,
  // faturalar, elden borçlar, manuel ödemeler) — henüz ödenmemiş olanların toplamı.
  return monthlyRows(ym).filter(r=>r.status!=='odendi').reduce((s,r)=>s+r.amount,0);
}
function monthlyRows(ym){
  const rows = [];
  state.loans.forEach(l=>{
    const inst = loanInstallmentForMonth(l, ym);
    if(inst) rows.push({ kind:'loan', refId:l.id, key:inst.key, day:l.dueDay||1, name:l.name, cat:'kredi',
      amount:inst.amount, status:inst.status });
  });
  state.bills.forEach(b=>{
    if(b.autoPay) return;
    const r = billRecord(b, ym);
    rows.push({ kind:'bill', refId:b.id, key:b.id+'#'+ym, day:b.dueDay||1, name:b.name, cat:'fatura',
      amount:r.amount, status:r.status, isEstimate:r.isEstimate });
  });
  state.cards.forEach(c=>{
    const st = cardStatement(c.id, ym);
    if(st) rows.push({ kind:'card', refId:c.id, key:st.id, day:c.dueDay||1, name:bankByCode(c.bankCode).name+' Kartı', cat:'kart',
      amount:st.amount, status:st.status });
  });
  state.manualPayments.filter(p=>p.ym===ym).forEach(p=>{
    rows.push({ kind:'manual', refId:p.id, key:p.id, day:new Date(p.date).getDate(), name:p.description, cat:p.category||'elden',
      amount:p.amount, status:p.status });
  });
  state.debts.filter(d=>d.direction==='borcum' && (!d.date || monthKey(new Date(d.date))===ym)).forEach(d=>{
    rows.push({ kind:'debt', refId:d.id, key:d.id, day:d.date?new Date(d.date).getDate():1, name:d.person, cat:'elden',
      amount:debtTL(d), status:d.paid?'odendi':periodStatus(false,ym,d.date?new Date(d.date).getDate():1) });
  });
  state.kmhAccounts.forEach(k=>{
    // Aylık Borç'a KMH'nin yalnızca bu dönem ödenmesi planlanan tutarı (Ödenecek Borç) dahil
    // edilir — toplam revolving bakiyenin tamamı değil. Ödenecek Borç ödenip sıfırlanınca satır
    // tamamen kalkar, böylece Toplam Borç ile Aylık Borç aynı tutarı iki kez saymaz.
    const paidMap=state.kmhPaidMonths?.[k.id]||{}; const savedPaid=paidMap[ym]; const amt=savedPaid?.amount || k.plannedPayment || 0;
    if(amt>0){ rows.push({ kind:'kmh', refId:k.id, key:k.id+'#'+ym, day:k.dueDay||1, name:bankByCode(k.bankCode).name+' KMH', cat:'kmh', amount:amt, status:savedPaid?'odendi':periodStatus(false,ym,k.dueDay) }); }
  });
  rows.sort((a,b)=>a.day-b.day);
  return rows;
}

// ---------- NOTIFICATIONS ----------
function getNotifications(){
  const today = new Date(); today.setHours(0,0,0,0);
  const overdue=[], dueToday=[], soon=[];
  const dismissed = state.dismissedNotifs||[];
  function bucket(key, name, amount, dueDate){
    if(dismissed.includes(key)) return;
    const days = Math.round((dueDate-today)/86400000);
    const item = { key, name, amount, days };
    if(days<0) overdue.push(item);
    else if(days===0) dueToday.push(item);
    else if(days<=5) soon.push(item);
  }
  state.loans.forEach(l=>{
    const insts = loanInstallments(l);
    const next = insts.find(i=>i.status!=='odendi');
    if(next){
      const [y,m] = next.ym.split('-').map(Number);
      bucket('loan-'+next.key, l.name, next.amount, new Date(y, m-1, l.dueDay||1));
    }
  });
  state.cards.forEach(c=>{
    const st = cardStatement(c.id, state.selectedMonth);
    if(st && st.status!=='odendi'){
      const [y,m] = state.selectedMonth.split('-').map(Number);
      bucket('card-'+st.id, bankByCode(c.bankCode).name+' Kartı', st.amount, new Date(y, m-1, c.dueDay||1));
    }
  });
  state.bills.forEach(b=>{
    if(b.autoPay) return;
    const r = billRecord(b, state.selectedMonth);
    if(r.status!=='odendi'){
      const [y,m] = state.selectedMonth.split('-').map(Number);
      bucket('bill-'+b.id+'-'+state.selectedMonth, b.name, r.amount, new Date(y, m-1, b.dueDay||1));
    }
  });
  return { overdue, dueToday, soon };
}
function updateNotifBadge(){
  const n = getNotifications();
  const count = n.overdue.length + n.dueToday.length + n.soon.length;
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  if(count>0){ badge.textContent = count>9?'9+':count; badge.style.display='flex'; }
  else badge.style.display='none';
}

    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointerleave', cancel);

// ---------- KMH (Kredili Mevduat Hesabı) ----------
function getKmhRate(k){ const r=Number(k?.interestRate); return r>0 ? r/100 : KMH_MONTHLY_INTEREST_RATE; }
function kmhEffectiveDebt(k){
  const principal=Math.max(0,k.debt||0);
  return k.includeInterest ? principal + kmhEstimatedInterest(k) : principal;
}
function kmhEstimatedInterest(k){
  const history=Array.isArray(k.debtHistory)?k.debtHistory:[];
  if(!history.length) return 0;
  const today=todayStr();
  const sorted=[...history].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let totalInterest=0;
  for(let i=0;i<sorted.length;i++){
    const start=sorted[i];
    const end=sorted[i+1] ? sorted[i+1].date : today;
    const days=Math.max(0,Math.round((new Date(end+'T00:00:00')-new Date(start.date+'T00:00:00'))/86400000));
    totalInterest += Math.max(0,Number(start.debt)||0) * (getKmhRate(k)/30) * days;
  }
  return Math.round(totalInterest*(1+KMH_TAX_RATES.bsmv+KMH_TAX_RATES.kkdf));
}
function recordKmhDebtSnapshot(k,newDebt){
  if(!Array.isArray(k.debtHistory)) k.debtHistory=[];
  const today=todayStr();
  const last=k.debtHistory[k.debtHistory.length-1];
  if(!last || last.debt!==newDebt || last.date!==today) k.debtHistory.push({id:uid(),date:today,debt:newDebt});
}

document.getElementById('homeFab').addEventListener('click', ()=> navigate('home'));

document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  try{
    if(typeof claude === 'undefined' || !claude.use){
      alert('İndirme özelliği bu görünümde kullanılamıyor.');
      return;
    }
    const downloads = await claude.use('downloads');
    if(!downloads){
      alert('İndirme özelliği bu görünümde kullanılamıyor.');
      return;
    }
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    await downloads.save({ filename: 'borc-takip.html', data: html });
  } catch(e){
    if(e && e.code === 'declined') return;
    console.error('download failed', e);
  }
});
$modalBackdrop.addEventListener('click', e=>{ if(e.target===$modalBackdrop) closeModal(); });

document.body.addEventListener('click', function(e){
  if(e.target.tagName==='INPUT' || e.target.tagName==='SELECT'){ e.stopPropagation(); return; }
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(t.dataset.kmhInline){
    e.stopPropagation(); const id=t.dataset.kmhInline; const k=state.kmhAccounts.find(x=>x.id===id); if(!k) return;
    const old=t.innerHTML; const current=kmhEffectiveDebt(k); t.innerHTML=`<div class="kmh-inline-edit"><input id="kmhInlineInput" type="text" inputmode="numeric" value="${current.toLocaleString('tr-TR')}"><button data-action="save-kmh-inline" data-id="${id}">✓</button></div>`; const inp=document.getElementById('kmhInlineInput'); if(inp){inp.focus();inp.select();} return;
  }
  if(action==='save-kmh-inline'){
    const id=t.dataset.id,k=state.kmhAccounts.find(x=>x.id===id); if(!k) return; const raw=(document.getElementById('kmhInlineInput')?.value||'').replace(/\./g,'').replace(',','.'); const entered=Math.max(0,Number(raw)||0); const interest=k.includeInterest?kmhEstimatedInterest(k):0; const newPrincipal=k.includeInterest?Math.max(0,entered-interest):entered; const old=k.debt||0; if(newPrincipal!==old){ recordKmhDebtSnapshot(k,newPrincipal); k.transactions=k.transactions||[]; k.transactions.push({id:uid(),date:todayStr(),amount:newPrincipal-old}); k.debt=newPrincipal; } save(); render(); return;
  }
  if(action==='inline-edit'){
    startInlineEdit(t.dataset.id, t.dataset.field, t);

function updateTypeExtra(type){

  if(type==='Altin'){
    el.innerHTML = `<div class="field"><label>Altın Türü</label><select id="f_goldUnit">
      ${Object.keys(GOLD_LABELS).map(k=>`<option value="${k}" ${state.debts.find(d=>d.id===modalCtx.id)?.unit===k?'selected':''}>${GOLD_LABELS[k]}</option>`).join('')}</select></div>`;
  } else if(type==='Doviz'){
    el.innerHTML = `<div class="field"><label>Döviz</label><select id="f_fxUnit"><option value="USD" ${state.debts.find(d=>d.id===modalCtx.id)?.unit==='USD'?'selected':''}>USD</option><option value="EUR" ${state.debts.find(d=>d.id===modalCtx.id)?.unit==='EUR'?'selected':''}>EUR</option></select></div>`;
  } else { el.innerHTML=''; }
}

function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function numVal(id){ const v=parseFloat(val(id)); return isNaN(v)?0:v; }
function tlVal(id){
  const el = document.getElementById(id);
  if(!el) return 0;
  const digits = el.value.replace(/\D/g,'');
  return digits ? parseInt(digits,10) : 0;
}
function formatTLInputLive(el){
  el.addEventListener('input', ()=>{
    const digits = el.value.replace(/\D/g,'');
    el.value = digits ? Number(digits).toLocaleString('tr-TR') : '';
  });
}

let activeInlineCommit = null;
function startIncomeEdit(spanEl){
  const current = state.monthlyIncome||0;
  spanEl.innerHTML = `<input type="text" inputmode="numeric" class="fin-inline-input">`;
  const inp = spanEl.querySelector('input');
  inp.value = current ? current.toLocaleString('tr-TR') : '';
  formatTLInputLive(inp);
  inp.focus(); inp.select();
  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    activeInlineCommit = null;
    const digits = inp.value.replace(/\D/g,'');
    state.monthlyIncome = digits ? parseInt(digits,10) : 0;
    save(); render();
  }
  activeInlineCommit = commit;
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
}
function startInlineEdit(entityId, field, spanEl){
  const isKmh = field==='kmhDebt' || field==='kmhPlanned';
  const card = isKmh ? state.kmhAccounts.find(k=>k.id===entityId) : state.cards.find(c=>c.id===entityId);
  if(!card) return;
  let current = 0;
  if(field==='totalDebt') current = card.totalDebt||0;
  else if(field==='kmhDebt') current = card.debt||0;
  else if(field==='kmhPlanned') current = card.plannedPayment||0;
  else if(field==='amount'){ const st = cardStatement(entityId, state.selectedMonth); current = st?st.amount:0; }
  spanEl.innerHTML = `<input type="text" inputmode="numeric" class="cc-inline-input">`;
  const inp = spanEl.querySelector('input');
  inp.value = current ? current.toLocaleString('tr-TR') : '';
  formatTLInputLive(inp);
  inp.focus(); inp.select();
  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    activeInlineCommit = null;
    const digits = inp.value.replace(/\D/g,'');
    const amount = digits ? parseInt(digits,10) : 0;
    if(field==='totalDebt'){ card.totalDebt = amount; }
    else if(field==='kmhDebt'){ card.debt = amount; }
    else if(field==='kmhPlanned'){ card.plannedPayment = amount; }
    else if(field==='amount'){
      const st = cardStatement(entityId, state.selectedMonth);
      if(st) st.amount = amount;
      else state.cardStatements.push({ id:uid(), cardId:entityId, ym:state.selectedMonth, amount, status:'bekliyor' });
    }
    save(); render();
  }
  activeInlineCommit = commit;
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
}

// Ensure nothing is lost when the person leaves: flush any open inline edit and force-save.
// ---------- YAPAY ZEKA (OpenRouter Free Router) — Salt Okuma Akıllı Finans Asistanı ----------
// AI yalnızca finansal verileri OKUR ve analiz eder. Kayıt ekleme/silme/değiştirme/ödeme işaretleme yetkisi yoktur.
const AI_MODEL = 'google/gemini-3.8-flash';
const OPENROUTER_API_URL = 'https://openrouter.ai/api/v1/chat/completions';
const AI_REQUEST_TIMEOUT_MS = 30000;
let aiMessages = [];

function getORKey(){
  return localStorage.getItem('openrouter_api_key') || localStorage.getItem('gemini_api_key') || '';
}

// ---- Finansal okuma araçları ----
function get_total_debt(){
  const t = totalDebt();
  return { toplam_borc: t.total, krediler: t.loans, kredi_kartlari: t.cards, kmh: t.kmh, elden_borclar: t.debts };
}
function get_monthly_income(){ return { aylik_gelir: state.monthlyIncome||0 }; }
function get_monthly_debt(month){ return { aylik_borc: monthlyDue(month||state.selectedMonth) }; }
function get_monthly_remaining(month){
  const ym = month||state.selectedMonth;
  return { aylik_kalan: (state.monthlyIncome||0) - monthlyDue(ym) };
}
function get_credit_data(){
  return state.loans.map(l=>({ ad:l.name, banka:bankByCode(l.bankCode).name, aylik_taksit:l.amount,
    toplam_taksit:l.count, kalan_taksit: loanInstallments(l).filter(i=>i.status!=='odendi').length,
    kalan_borc: loanRemaining(l) }));
}
function get_credit_card_data(){
  return state.cards.map(c=>({ banka:bankByCode(c.bankCode).name, limit:c.limit||0, toplam_borc:c.totalDebt||0,
    odenecek_miktar:(cardStatement(c.id,state.selectedMonth)||{}).amount||0, kalan_limit:(c.limit||0)-(c.totalDebt||0) }));
}
function get_bill_data(){
  return state.bills.map(b=>{ const r=billRecord(b,state.selectedMonth); return { ad:b.name, kategori:b.category,
    tutar:r.amount, durum:r.status, otomatik_odeme: !!b.autoPay }; });
}
function get_cash_debt_data(){
  return state.debts.map(d=>({ kisi:d.person, yon: d.direction==='borcum'?'benim_borcum':'bana_borcu',
    tutar_tl: debtTL(d), odendi: !!d.paid }));
}
function get_kmh_data(){
  return state.kmhAccounts.map(k=>{ const debt=k.debt||0; const planned=k.plannedPayment||0; const faiz=kmhEstimatedInterest(k);
    return { banka:bankByCode(k.bankCode).name, limit:k.limit||0, toplam_borc:kmhEffectiveDebt(k), ana_borc:debt, tahmini_faiz:faiz, odenecek_borc:planned,
      kalan_limit:(k.limit||0)-debt, faiz_hesaba_dahil:!!k.includeInterest }; });
}
function get_monthly_payments(month){ return monthlyRows(month||state.selectedMonth); }
function get_upcoming_payments(){
  return monthlyRows(state.selectedMonth).filter(r=>r.status!=='odendi').sort((a,b)=>a.day-b.day).slice(0,5)
    .map(r=>({ ad:r.name, tutar:r.amount, gun:r.day }));
}
function calculate_kmh_interest(amount, days, monthlyRate){ return calculateKmhScenario(amount, days, monthlyRate); }
function calculate_monthly_summary(month){
  const ym = month||state.selectedMonth;
  const income = state.monthlyIncome||0, due = monthlyDue(ym);
  return { ay: ym, aylik_gelir: income, aylik_borc: due, aylik_kalan: income-due };
}
function search_debt_records(query){
  const q = (query||'').toLocaleLowerCase('tr');
  return state.debts.filter(d=>d.person.toLocaleLowerCase('tr').includes(q))
    .map(d=>({ kisi:d.person, tutar_tl:debtTL(d), odendi:!!d.paid }));
}

const AI_READ_TOOLS = [
  { name:'get_total_debt', description:'Kullanıcının kalan toplam borcunu ve kredi, kredi kartı, KMH, elden borç kırılımını döner.', parameters:{ type:'object', properties:{} } },
  { name:'get_monthly_income', description:'Kullanıcının aylık gelirini döner.', parameters:{ type:'object', properties:{} } },
  { name:'get_monthly_debt', description:'Belirtilen ayda ödenmesi gereken toplam aylık borcu döner.', parameters:{ type:'object', properties:{ month:{ type:'string', description:'YYYY-MM formatında ay, opsiyonel' } } } },
  { name:'get_monthly_remaining', description:'Belirtilen ay için aylık gelirden aylık borç düşüldükten sonra kalan tutarı döner.', parameters:{ type:'object', properties:{ month:{ type:'string', description:'YYYY-MM formatında ay, opsiyonel' } } } },
  { name:'get_credit_data', description:'Tüm kredileri banka, aylık taksit, kalan taksit ve kalan borç ile döner.', parameters:{ type:'object', properties:{} } },
  { name:'get_credit_card_data', description:'Tüm kredi kartlarını limit, toplam borç, bu ay ödenecek miktar ve kalan limit ile döner.', parameters:{ type:'object', properties:{} } },
  { name:'get_kmh_data', description:'Tüm KMH hesaplarını limit, borç, ödenecek borç, kalan limit ve yaklaşık günlük faiz ile döner.', parameters:{ type:'object', properties:{} } },
  { name:'get_bill_data', description:'Tüm fatura ve aboneliklerin seçili aydaki tutar, durum ve otomatik ödeme bilgisini döner.', parameters:{ type:'object', properties:{} } },
  { name:'get_cash_debt_data', description:'Tüm elden borç/alacak kayıtlarını döner.', parameters:{ type:'object', properties:{} } },
  { name:'get_monthly_payments', description:'Seçilen ayın aylık ödeme planını döner.', parameters:{ type:'object', properties:{ month:{type:'string',description:'YYYY-MM formatında ay, opsiyonel'} } } },
  { name:'get_upcoming_payments', description:'Seçilen ayda henüz ödenmemiş en yakın 5 ödemeyi döner.', parameters:{ type:'object', properties:{} } },
  { name:'calculate_kmh_interest', description:'Varsayımsal KMH senaryosunda yaklaşık faiz+BSMV+KKDF maliyetini hesaplar. Bu hesabı kendin yapma, aracı kullan.', parameters:{ type:'object', properties:{ amount:{type:'number'}, days:{type:'number'}, monthlyRate:{type:'number',description:'Opsiyonel aylık oran; verilmezse uygulamadaki oran kullanılır.'} }, required:['amount','days'] } },
  { name:'calculate_monthly_summary', description:'Seçilen ay için gelir, aylık borç ve aylık kalan özetini döner.', parameters:{ type:'object', properties:{ month:{type:'string',description:'YYYY-MM formatında ay, opsiyonel'} } } },
  { name:'search_debt_records', description:'Kişi adına göre elden borç kayıtlarında arama yapar.', parameters:{ type:'object', properties:{ query:{type:'string'} }, required:['query'] } },
];

function dispatchAiReadTool(name,args){
  args=args||{};
  switch(name){
    case 'get_total_debt': return get_total_debt();
    case 'get_monthly_income': return get_monthly_income();
    case 'get_monthly_debt': return get_monthly_debt(args.month);
    case 'get_monthly_remaining': return get_monthly_remaining(args.month);
    case 'get_credit_data': return get_credit_data();
    case 'get_credit_card_data': return get_credit_card_data();
    case 'get_kmh_data': return get_kmh_data();
    case 'get_bill_data': return get_bill_data();
    case 'get_cash_debt_data': return get_cash_debt_data();
    case 'get_monthly_payments': return get_monthly_payments(args.month);
    case 'get_upcoming_payments': return get_upcoming_payments();
    case 'calculate_kmh_interest': return calculate_kmh_interest(args.amount,args.days,args.monthlyRate);
    case 'calculate_monthly_summary': return calculate_monthly_summary(args.month);
    case 'search_debt_records': return search_debt_records(args.query);
    default: return { hata:'Bilinmeyen veya izin verilmeyen okuma aracı: '+name };
  }
}

function openRouterTools(){
  return AI_READ_TOOLS.map(t=>({ type:'function', function:{ name:t.name, description:t.description, parameters:t.parameters } }));
}

function buildAiSystemPrompt(){
  return `Sen "Finansçım" uygulamasının Akıllı Finans Asistanısın. Yalnızca yazılı sohbet üzerinden konuşursun.
Bugünün tarihi: ${todayStr()}. Uygulamada şu an seçili ay: ${state.selectedMonth}.

KURALLAR:
1) Kullanıcının finansal verilerine yalnızca sana tanımlı get_/search_/calculate_ araçlarıyla eriş. Kendi kafandan rakam, bakiye, tarih veya kayıt UYDURMA.
2) Kullanıcı "toplam borcum", "aylık borcum", "kredi kartı borcum", "KMH", "faturalarım", "nerede fazla ödüyorum" gibi bir soru sorduğunda gerekli okuma araçlarını çağır ve mevcut uygulama verilerine dayanarak cevap ver.
3) Sen SADECE OKUMA ve ANALİZ yaparsın. Hiçbir kaydı EKLEME, SİLME, DEĞİŞTİRME ve hiçbir ödemeyi ÖDENDİ olarak işaretleme. Kullanıcı böyle bir işlem isterse, işlemi uygulamanın normal arayüzünden kendisinin yapması gerektiğini söyle.
4) Finansal öneri verirken rakamları mevcut veriden çıkar. Örneğin kredi kartı ödemelerinin aylık gelire oranını hesaplayabilirsin; oranı ve dayandığı rakamları açıkça belirt. Veri yoksa "veri yok" de.
5) KMH faiz/maliyet sorularında calculate_kmh_interest aracını kullan; faiz hesabını kafandan yapma.
6) Kısa, doğal ve samimi Türkçe kullan. Kullanıcı istemedikçe uzun rapor yazma.
7) Kullanıcının verilerini veya API anahtarını başka yere aktarmayı teklif etme.`;
}

function normalizeHistory(){
  const arr=[{role:'system',content:buildAiSystemPrompt()}];
  for(const m of aiHistory){ arr.push(m); }
  return arr;
}
let aiHistory=[];
let aiBusy=false;
let aiCooldownUntil=0;

async function openRouterRequest(messages){
  const key=getORKey();
  if(!key) throw new Error('OpenRouter API anahtarı ayarlanmamış. 🤖 simgesinden anahtarını gir.');
  const controller=new AbortController();
  const timeoutId=setTimeout(()=>controller.abort(),AI_REQUEST_TIMEOUT_MS);
  let resp;
  try{
    resp=await fetch(OPENROUTER_API_URL,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+key,
        'HTTP-Referer':location.origin || 'https://github.com',
        'X-OpenRouter-Title':'Finanscim'
      },
      body:JSON.stringify({
        model:AI_MODEL,
        messages,
        tools:openRouterTools(),
        tool_choice:'auto',
        temperature:0.2
      }),
      signal:controller.signal
    });
  }catch(e){
    console.error('[Finansçım/OpenRouter] fetch error:', e);
    if(e && e.name==='AbortError') throw Object.assign(new Error('Yapay zekadan yanıt gelmedi (30 saniye zaman aşımı).'),{kind:'timeout'});
    const detail = e && e.message ? e.message : String(e);
    throw Object.assign(new Error('OpenRouter isteği tarayıcı tarafından başlatılamadı: ' + detail),{kind:'network', original:e});
  }finally{ clearTimeout(timeoutId); }
  const detail=await resp.text();
  if(!resp.ok){
    console.log('[OpenRouter API] HTTP',resp.status,detail);
    let msg='OpenRouter isteği başarısız oldu.';
    if(resp.status===401||resp.status===403) msg='OpenRouter API anahtarı geçersiz veya yetkisiz.';
    else if(resp.status===429) { const e=new Error('OpenRouter kullanım limitine ulaşıldı. Biraz bekleyip tekrar dene.'); e.kind='rate_limit'; throw e; }
    else if(resp.status===402) msg='OpenRouter hesabında yeterli kredi bulunmuyor.';
    else if(resp.status===400) msg='OpenRouter isteği geçersiz. Model veya araç tanımını kontrol etmek gerekiyor.';
    const e=new Error(msg); e.status=resp.status; e.detail=detail; throw e;
  }
  let data;
  try{ data=JSON.parse(detail); }catch(_e){ throw new Error('OpenRouter beklenmeyen bir cevap döndürdü.'); }
  const message=data && data.choices && data.choices[0] && data.choices[0].message;
  if(!message) throw new Error('Yapay zekadan boş cevap geldi.');
  return message;
}

async function testOpenRouterConnection(){
  const key=getORKey();
  if(!key){ openModal('aiSettings'); return; }
  try{
    const controller=new AbortController();
    const timeoutId=setTimeout(()=>controller.abort(),15000);
    let resp;
    try{
      resp=await fetch(OPENROUTER_API_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body:JSON.stringify({model:AI_MODEL,messages:[{role:'user',content:'Merhaba. Sadece Merhaba de.'}] }),
        signal:controller.signal
      });
    }finally{ clearTimeout(timeoutId); }
    const text=await resp.text();
    console.log('[Finansçım/OpenRouter test]',resp.status,text);
    if(!resp.ok) throw new Error('HTTP '+resp.status+' — '+text.slice(0,500));
    return JSON.parse(text);
  }catch(e){
    console.error('[Finansçım/OpenRouter test] HATA',e);
    throw e;
  }
}

async function sendAiMessage(text){
  if(!text || aiBusy || Date.now()<aiCooldownUntil) return;
  if(!getORKey()){ openModal('aiSettings'); return; }
  aiBusy=true;
  const sendBtn=document.querySelector('[data-action="ai-send"]'); if(sendBtn) sendBtn.disabled=true;
  aiMessages.push({role:'user',text});
  aiMessages.push({role:'assistant',text:'…',thinking:true});
  render();
  aiHistory.push({role:'user',content:text});
  try{
    let finalText=null;
    for(let round=0; round<6 && !finalText; round++){
      const msg=await openRouterRequest(normalizeHistory());
      if(msg.tool_calls && msg.tool_calls.length){
        aiHistory.push({role:'assistant',content:msg.content||'',tool_calls:msg.tool_calls});
        for(const tc of msg.tool_calls){
          let args={};
          try{ args=tc.function && tc.function.arguments ? JSON.parse(tc.function.arguments) : {}; }catch(_e){ args={}; }
          const result=dispatchAiReadTool(tc.function.name,args);
          aiHistory.push({role:'tool',tool_call_id:tc.id,content:JSON.stringify(result)});
        }
      }else{
        finalText=msg.content || 'Cevabı anlayamadım, tekrar sorar mısın?';
        aiHistory.push({role:'assistant',content:finalText});
      }
    }
    aiMessages.pop();
    aiMessages.push({role:'assistant',text:finalText || 'Yanıt oluşturulamadı. Lütfen soruyu biraz daha açık yazar mısın?'});
  }catch(err){
    aiMessages.pop();
    aiMessages.push({role:'assistant',text:'⚠️ '+(err.message||'Beklenmeyen bir hata oluştu.') + (err.status ? ' [HTTP '+err.status+']' : '')});
    if(aiHistory.length && aiHistory[aiHistory.length-1].role==='user') aiHistory.pop();
    if(err.kind==='rate_limit'){ aiCooldownUntil=Date.now()+10000; setTimeout(()=>render(),10000); }
  }finally{
    aiBusy=false;
    const sendBtn2=document.querySelector('[data-action="ai-send"]'); if(sendBtn2) sendBtn2.disabled=false;
    render();
  }
}

function renderAI(){
  $fab.style.display='none';
  const aiCoolingDown=Date.now()<aiCooldownUntil;
  const bubbles=aiMessages.map(m=>{
    if(m.role==='user') return `<div class="ai-bubble ai-user">${esc(m.text)}</div>`;
    return `<div class="ai-bubble ai-assistant ${m.thinking?'ai-thinking':''}">${esc(m.text).replace(/\n/g,'<br>')}</div>`;
  }).join('');
  return `
    <div class="ai-chat-wrap">
      <div class="ai-header-row">
        <button data-action="open-modal" data-modal="aiSettings" style="background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;">⚙ OpenRouter Ayarı</button>
        <button class="ai-close-btn" data-action="ai-close" title="Kapat">✕</button>
      </div>
      <div class="ai-messages" id="aiMessages">
        ${bubbles || '<div class="empty">Merhaba! Kredilerini, kredi kartlarını, KMH’yi, faturalarını ve elden borçlarını inceleyebilirim. İstersen mevcut finansal durumunu analiz edip nerede yükünün fazla olduğunu da söyleyebilirim.</div>'}
      </div>
      <div class="ai-input-row">
        <input id="aiInputBox" class="ai-input-box" placeholder="Mesajını yaz..." autocomplete="off" ${(aiBusy||aiCoolingDown)?'disabled':''}>
        <button class="ai-send-btn" data-action="ai-send" ${(aiBusy||aiCoolingDown)?'disabled':''}>${aiBusy?'<span class="ai-send-spinner"></span> Gönderiliyor…':(aiCoolingDown?'Bekleyin…':'Gönder')}</button>
      </div>
    </div>`;
}

function flushAndSave(){
  if(activeInlineCommit) activeInlineCommit();
  save();
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushAndSave(); });
window.addEventListener('pagehide', flushAndSave);
window.addEventListener('beforeunload', flushAndSave);
})();
