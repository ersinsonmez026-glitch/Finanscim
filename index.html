<title>Finansçım</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7FAF9;--surface:#FFFFFF;--ink:#132326;--ink-soft:#5A7378;--border:#DCE8E6;
  --accent:#0E7C86;--accent-soft:#DEF0EF;
  --debt:#B3483C;--debt-soft:#F7E9E7;
  --paid:#2F8F6F;--paid-soft:#E1F2E9;
  --pending:#B8791F;--pending-soft:#F6ECDA;
  --soon:#A8901A;--soon-soft:#FBF3CE;
  --purple:#3B6B95;--purple-soft:#E4ECF5;
  --font-display:'Fraunces',serif;--font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B1D;--surface:#16292B;--ink:#EAF3F2;--ink-soft:#8FADB0;--border:#25393C;
    --accent:#4FC3C9;--accent-soft:#1B3335;
    --debt:#E08478;--debt-soft:#2E2220;
    --paid:#6FCBA6;--paid-soft:#1B332B;
    --pending:#E0AD5F;--pending-soft:#2E2718;
    --soon:#D9C15E;--soon-soft:#332C12;
    --purple:#8CB2DE;--purple-soft:#1E2A3A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B1D;--surface:#16292B;--ink:#EAF3F2;--ink-soft:#8FADB0;--border:#25393C;
  --accent:#4FC3C9;--accent-soft:#1B3335;--debt:#E08478;--debt-soft:#2E2220;
  --paid:#6FCBA6;--paid-soft:#1B332B;--pending:#E0AD5F;--pending-soft:#2E2718;
  --soon:#D9C15E;--soon-soft:#332C12;
  --purple:#8CB2DE;--purple-soft:#1E2A3A;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;touch-action:manipulation;}
button{font-family:var(--font-body);}
.app{display:flex;height:100vh;max-width:520px;margin:0 auto;position:relative;}

.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:5;position:relative;}
.topbar-left{display:flex;align-items:center;gap:10px;z-index:1;}
.topbar-right{display:flex;align-items:center;gap:4px;margin-left:auto;z-index:1;}
.topbar-ai-icon{font-size:19px;line-height:1;}
.topbar-title-centered{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-display);
  font-weight:500;font-size:19px;margin:0;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .header-action{background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:4px 6px;}
.notif-badge{position:absolute;top:2px;right:2px;background:var(--debt);color:#fff;font-size:10px;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}
.content{flex:1;overflow-y:auto;padding:16px 16px 70px;}
.storage-warning{background:var(--debt);color:#fff;padding:10px 14px;font-size:12px;text-align:center;line-height:1.4;}

.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:9;}
.drawer-backdrop.open{display:block;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--surface);border-right:1px solid var(--border);
  transform:translateX(-100%);transition:transform .22s ease;z-index:10;display:flex;flex-direction:column;padding:18px 10px;}
.drawer.open{transform:translateX(0);}
.drawer-header{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
.logo-icon{font-size:22px;}
.app-name{font-family:var(--font-display);font-weight:600;font-size:17px;}
.app-tagline{font-size:11px;color:var(--ink-soft);}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  padding:11px 12px;border-radius:10px;font-size:14.5px;color:var(--ink);cursor:pointer;}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav-divider{height:1px;background:var(--border);margin:8px 6px;}

/* HOME */
.hero-card{background:linear-gradient(135deg,var(--accent),#164f46);color:#fff;border-radius:16px;padding:20px 18px;}
:root[data-theme="dark"] .hero-card,@media (prefers-color-scheme:dark){}
.hero-label{font-size:12.5px;opacity:.85;margin:0 0 4px;}
.hero-number{font-family:var(--font-display);font-size:36px;font-weight:500;margin:0;cursor:pointer;}
.hero-inline-input{background:rgba(255,255,255,.94);color:#1C2127;border:none;border-radius:8px;padding:3px 12px;
  font-size:28px;font-family:var(--font-display);font-weight:500;text-align:center;width:75%;}
.top-date{text-align:center;font-size:12px;color:var(--ink-soft);margin:0 0 8px;}
.stat-row{display:flex;gap:10px;margin-top:14px;}
.stat-box{flex:1;background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;}

.fin-card{display:flex;flex-direction:column;gap:4px;margin-bottom:4px;}
.fin-row{display:grid;grid-template-columns:30px 156px 1fr;align-items:center;gap:8px;padding:7px 11px;
  border-radius:12px;color:#fff;}
.fin-row .fr-icon{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fin-row .fr-text{min-width:0;}
.fin-row .fr-label{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fin-row .fr-sub{font-size:9.5px;opacity:.7;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fin-row .fr-value-wrap{display:flex;align-items:center;justify-content:flex-end;gap:5px;min-width:0;margin-left:auto;width:100%;}
.fin-row .fr-value{font-family:var(--font-display);font-size:18px;font-weight:700;white-space:nowrap;text-align:right;}
.fin-row .fr-value.editable{cursor:pointer;}
.fin-row .fr-edit-icon{opacity:.85;font-size:11px;flex-shrink:0;cursor:pointer;}
.fin-inline-input{background:rgba(255,255,255,.94);color:#1C2127;border:none;border-radius:6px;padding:1px 7px;
  font-size:16px;font-family:var(--font-display);font-weight:700;width:100px;}
.fin-note{text-align:center;font-size:10.5px;color:var(--ink-soft);margin:6px 0 2px;}
.stat-box .l{font-size:11px;opacity:.85;}
.stat-box .v{font-size:15px;font-weight:600;margin-top:2px;font-family:var(--font-display);}

.section-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin:14px 2px 6px;}
.ai-module{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--border);
  border-radius:14px;padding:13px 14px;margin-top:6px;}
.ai-module-icon{width:38px;height:38px;border-radius:11px;background:var(--surface);display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;}
.ai-module-title{font-size:13.5px;font-weight:600;color:var(--ink);}
.ai-module-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.dist-row{display:flex;align-items:center;gap:12px;padding:7px 6px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface);}
.dist-row:first-child{border-radius:12px 12px 0 0;}
.dist-row:last-child{border-bottom:none;border-radius:0 0 12px 12px;}
.card-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.dist-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.dist-name{font-size:14px;font-weight:500;flex:1;}
.dist-amt{font-family:var(--font-display);font-size:14.5px;font-weight:500;}
.dist-arrow{color:var(--ink-soft);font-size:13px;}

.big-add-btn{width:100%;padding:11px;border-radius:12px;border:none;background:var(--accent);color:#fff;
  font-weight:600;font-size:14.5px;cursor:pointer;margin-top:18px;}

/* LIST ITEMS shared */
[data-lp-type],button,.choice-row,.bank-chip,.cat-chip,.day-cell,.item-card,.credit-card,.dist-row,.fin-row,.inst-row,
.notif-row,.wheel-item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
.record-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.record-top{display:flex;align-items:center;gap:10px;}
.record-avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.record-title{font-size:15px;font-weight:700;}
.record-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.record-status-pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:12.5px;
  font-weight:700;white-space:nowrap;}
.record-status-pill.ok{background:var(--paid-soft);color:var(--paid);}
.record-status-pill.wait{background:var(--debt-soft);color:var(--debt);}
.record-chevron{color:var(--ink-soft);font-size:15px;margin-left:2px;}
.record-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;}
.record-stat .l{font-size:10.5px;color:var(--ink-soft);min-height:26px;line-height:1.25;display:flex;align-items:flex-start;}
.record-stat .v{font-size:13.5px;font-weight:700;font-family:var(--font-display);margin-top:2px;color:var(--accent);}
.record-banner{display:flex;align-items:center;gap:8px;border-radius:10px;padding:9px 12px;margin-top:12px;font-size:12.5px;font-weight:600;}
.record-banner.ok{background:var(--paid-soft);color:var(--paid);}
.record-banner.wait{background:var(--debt-soft);color:var(--debt);}
.dashed-add-card{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:14px;
  padding:14px;cursor:pointer;margin-bottom:14px;background:none;width:100%;text-align:left;}
.dashed-add-icon{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dashed-add-title{font-size:14px;font-weight:700;color:var(--accent);}
.dashed-add-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.page-back-btn{display:flex;align-items:center;gap:6px;justify-content:center;margin-left:auto;width:fit-content;
  padding:11px 20px;border-radius:24px;background:var(--surface);border:1px solid var(--border);color:var(--ink);
  font-size:14px;font-weight:700;cursor:pointer;}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.item-title{font-size:14.5px;font-weight:600;margin:0;}
.item-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.item-amt{font-family:var(--font-display);font-size:17px;font-weight:500;white-space:nowrap;}
.item-progress{height:5px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden;}
.item-progress-fill{height:100%;background:var(--accent);}
.item-meta-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
.pill{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;display:inline-block;}
.pill.bekliyor{background:var(--pending-soft);color:var(--pending);}
.pill.odendi{background:var(--paid-soft);color:var(--paid);}
.pill.gecikti{background:var(--debt-soft);color:var(--debt);}

.notif-wrap{position:relative;overflow:hidden;border-radius:12px;margin-bottom:7px;}
.notif-delete-bg{position:absolute;inset:0;background:var(--debt);color:#fff;display:flex;align-items:center;
  justify-content:flex-end;padding-right:22px;font-size:17px;border-radius:12px;}
.notif-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;position:relative;
  touch-action:pan-y;user-select:none;}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.confirm-box{background:var(--surface);border-radius:16px;padding:20px;max-width:320px;width:100%;}
.confirm-box p{margin:0 0 16px;font-size:14.5px;color:var(--ink);line-height:1.4;}
.confirm-box .danger-btn{margin-top:0;margin-bottom:8px;}
.notif-row.sev-overdue{background:var(--debt-soft);}
.notif-row.sev-today{background:var(--pending-soft);}
.notif-row.sev-soon{background:var(--soon-soft);}
.notif-row .n-name{font-size:14px;font-weight:600;}
.notif-row.sev-overdue .n-name{color:var(--debt);}
.notif-row.sev-today .n-name{color:var(--pending);}
.notif-row.sev-soon .n-name{color:var(--soon);}
.notif-row .n-sub{font-size:11.5px;opacity:.85;margin-top:1px;}
.notif-row .n-amt{font-family:var(--font-display);font-size:14.5px;font-weight:600;margin-left:auto;}

.empty{text-align:center;padding:34px 10px;color:var(--ink-soft);font-size:13.5px;}

.fab{position:fixed;left:18px;bottom:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);
  color:#fff;border:none;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:6;
  display:flex;align-items:center;justify-content:center;}
.home-fab{position:fixed;right:22px;bottom:30px;width:50px;height:50px;border-radius:50%;background:var(--surface);
  border:1px solid var(--border);color:var(--ink);font-size:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.15);cursor:pointer;z-index:6;}
.mic-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:24px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:7;transition:transform .12s, background .12s;}
.mic-fab.listening{background:var(--debt);transform:translateX(-50%) scale(1.12);}
.mic-fab.thinking{background:var(--pending);}
.ai-status-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;max-width:88%;background:var(--ink);
  color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;z-index:7;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);}

/* month switcher */
.month-switch{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0 18px;}
.month-switch button{background:var(--surface);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;
  font-size:16px;color:var(--ink);cursor:pointer;}
.month-switch .m-label{font-family:var(--font-display);font-size:16px;font-weight:500;min-width:130px;text-align:center;}

/* summary bar (aylık/kart/fatura) */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.summary-cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.summary-cell .l{font-size:11px;color:var(--ink-soft);}
.summary-cell .v{font-family:var(--font-display);font-size:16px;margin-top:2px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20;}
.modal-backdrop.open{display:flex;}
.modal-sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;}
.modal-sheet h3{font-family:var(--font-display);font-weight:500;font-size:19px;margin:0 0 16px;}
.field{margin-bottom:6px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
.field-row.aligned-row{align-items:flex-end;}
.field-row.aligned-row .field{flex:1;min-width:0;}
.field-row.aligned-row .field label{display:flex;align-items:flex-end;min-height:30px;line-height:1.2;margin-bottom:5px;}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:16px;font-family:var(--font-body);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.choice-row{display:flex;gap:7px;flex-wrap:wrap;}
.choice-row button{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);
  display:inline-flex;align-items:center;gap:4px;
  color:var(--ink-soft);font-size:12.5px;cursor:pointer;}
.choice-row button.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.save-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}
.cancel-btn{width:100%;padding:10px;border:none;background:none;color:var(--ink-soft);font-size:13.5px;cursor:pointer;}
.danger-btn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--debt);background:none;color:var(--debt);
  font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;}
.amount-fixed-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:13px;}
.amount-fixed-row .field{flex:1;margin-bottom:0;}
.fixed-toggle-mini{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:11px;flex-shrink:0;}
.fixed-toggle-mini span{font-size:9px;color:var(--ink-soft);white-space:nowrap;}
.switch{width:40px;height:22px;border-radius:12px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.switch.on .knob{left:20px;}

/* installment table */
.inst-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.inst-row:last-child{border-bottom:none;}
.row-toggle{border:none;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.row-toggle.bekliyor{background:var(--pending-soft);color:var(--pending);}
.row-toggle.odendi{background:var(--paid-soft);color:var(--paid);}
.row-toggle.gecikti{background:var(--debt-soft);color:var(--debt);}
.inst-date{font-size:13px;width:70px;flex-shrink:0;color:var(--ink-soft);}
.inst-amt{flex:1;font-size:14px;font-weight:500;font-family:var(--font-display);}

.back-link{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:0 0 12px;display:flex;align-items:center;gap:4px;}

.bank-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.bank-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px;
  border-radius:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;}
.bank-chip span:last-child{font-size:10px;line-height:1.15;color:var(--ink-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.bank-chip.active{border-color:var(--accent);background:var(--accent-soft);}
.bank-chip.active span:last-child{color:var(--accent);font-weight:600;}
.bank-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:9.5px;font-weight:700;flex-shrink:0;}
.bank-avatar.sm{width:34px;height:34px;font-size:12px;}
.item-title-row{display:flex;align-items:center;gap:8px;}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.cat-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;
  border-radius:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;}
.cat-chip .ic{font-size:18px;}
.cat-chip .lbl{font-size:10.5px;color:var(--ink-soft);line-height:1.2;}
.cat-chip.active{border-color:var(--accent);background:var(--accent-soft);}
.cat-chip.active .lbl{color:var(--accent);font-weight:600;}

.credit-card{display:flex;align-items:stretch;border-radius:16px;padding:0;color:#fff;position:relative;overflow:hidden;
  margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.16);min-height:140px;}
.credit-card::after{content:'';position:absolute;right:-25px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:rgba(255,255,255,.10);}
.cc-left{width:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:12px 6px;border-right:1px solid rgba(255,255,255,.32);text-align:center;position:relative;z-index:1;}
.cc-left .bank-mark{font-size:17px;font-weight:700;letter-spacing:.02em;}
.cc-left .bank-name{font-size:10.5px;opacity:.92;line-height:1.3;}
.cc-left .cc-due{font-size:9px;opacity:.78;margin-top:1px;}
.cc-right{width:70%;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:34px 16px 12px;position:relative;z-index:1;}
.cc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.cc-row .l{font-size:10.5px;opacity:.85;}
.cc-row .v{font-size:14px;font-weight:600;font-family:var(--font-display);}
.cc-row .v.editable{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.55);padding-bottom:1px;}
.cc-inline-input{width:90px;padding:2px 5px;border-radius:5px;border:none;font-size:16px;font-family:var(--font-display);
  font-weight:600;text-align:right;background:rgba(255,255,255,.92);color:#1C2127;}
.cc-status-btn{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.24);
  border:none;color:#fff;padding:5px 10px 5px 8px;border-radius:20px;cursor:pointer;z-index:2;display:flex;align-items:center;gap:3px;}
.cc-status-btn.is-paid{background:rgba(255,255,255,.92);color:#2F8F6F;}
.cc-settings-btn{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);
  border:none;color:#fff;font-size:11px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;}
.cc-interest-toggle{position:absolute;bottom:8px;right:10px;font-size:9.5px;font-weight:600;background:rgba(255,255,255,.2);
  color:#fff;border:1px solid rgba(255,255,255,.4);padding:4px 9px;border-radius:20px;cursor:pointer;z-index:2;}
.cc-interest-toggle.active{background:rgba(255,255,255,.92);color:var(--paid);border-color:transparent;}

.day-picker{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:9px 8px 7px;}
.day-picker-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 5px;}
.day-picker-head span{font-family:var(--font-display);font-size:13px;color:var(--ink);}
.day-picker-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.day-picker-weekdays span{font-size:9.5px;color:var(--ink-soft);text-align:center;font-weight:600;}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.day-cell{aspect-ratio:1;max-width:26px;width:100%;margin:0 auto;border-radius:50%;border:none;background:transparent;
  color:var(--ink);font-size:11.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font-body);}
.day-cell:hover{background:var(--accent-soft);}
.day-cell.active{background:var(--accent);color:#fff;font-weight:600;}

.wheel-picker{position:relative;display:flex;height:96px;background:var(--bg);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;}
.wheel-col{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none;}
.wheel-col::-webkit-scrollbar{display:none;}
.wheel-item{height:34px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body);}
.wheel-item.selected{color:var(--ink);font-weight:700;font-family:var(--font-display);font-size:15px;}
.wheel-spacer{height:31px;flex-shrink:0;}
.wheel-highlight{position:absolute;top:31px;left:0;right:0;height:34px;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);pointer-events:none;}
.cat-icon-row{display:flex;align-items:center;gap:10px;}
.cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}

@media (min-width:521px){ .app{border-left:1px solid var(--border);border-right:1px solid var(--border);} }
</style>
</head>
<body>

<div class="app">
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="header-action" id="downloadBtn" title="Dosyayı İndir">⬇️</button>
        <span class="topbar-ai-icon" data-action="open-modal" data-modal="aiSettings" style="cursor:pointer;">🤖</span>
      </div>
      <h1 id="pageTitle" class="topbar-title-centered">Ana Sayfa</h1>
      <div class="topbar-right">
        <button class="header-action" id="notifBell" title="Bildirimler" style="position:relative;">🔔<span id="notifBadge" class="notif-badge" style="display:none;"></span></button>
        <button class="header-action" id="headerAction" style="display:none">+</button>
      </div>
    </header>
    <div id="storageWarning" class="storage-warning" style="display:none;">
      ⚠️ Bu tarayıcıda veriler kaydedilemiyor (gizli/özel sekme olabilir). Girdiklerin kalıcı olmayabilir — normal Safari/Chrome sekmesinde aç.
    </div>
    <div id="content" class="content"></div>
  </div>
</div>

<button class="fab" id="fab" style="display:none">+</button>
<button class="home-fab" id="homeFab">🏠</button>
<button class="mic-fab" id="micFab" title="Basılı tut, konuş">🎤</button>
<div id="aiStatusBar" class="ai-status-bar" style="display:none;"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script>
(function(){
'use strict';
const STORAGE_KEY = 'borcum-full-v1';
const GOLD_RATE = 6850; // 16 Eylül 2026 itibarıyla piyasadaki yaklaşık 24 ayar gram altın fiyatı (TL) - gerçek sürümde canlı API'den güncellenecek
const FX = { USD: 48.65, EUR: 56.23 }; // 16 Eylül 2026 itibarıyla yaklaşık serbest piyasa kuru - gerçek sürümde canlı API
const GOLD_UNITS = { gram22:0.916, gram24:1, ceyrek:1.75, yarim:3.5, tam:7, cumhuriyet:7.2, ata:6.6 };
const GOLD_LABELS = { gram22:'22 Ayar Gram', gram24:'24 Ayar Gram', ceyrek:'Çeyrek', yarim:'Yarım', tam:'Tam', cumhuriyet:'Cumhuriyet', ata:'Ata' };
const DEBT_TYPE_ICONS = {
  TL: { icon:'₺', bg:'var(--accent-soft)', color:'var(--accent)' },
  Altin: { icon:`<svg viewBox="0 0 40 40" width="22" height="22" style="display:block;">
      <defs><radialGradient id="goldGrad" cx="35%" cy="32%"><stop offset="0%" stop-color="#FFF2C4"/><stop offset="55%" stop-color="#E8C34A"/><stop offset="100%" stop-color="#B8860B"/></radialGradient></defs>
      <circle cx="14" cy="22" r="13" fill="url(#goldGrad)" stroke="#8A6100" stroke-width="1.1"/>
      <circle cx="14" cy="22" r="9.5" fill="none" stroke="#8A6100" stroke-width="0.6" stroke-dasharray="1.3,1.3" opacity="0.6"/>
      <text x="14" y="26" text-anchor="middle" font-size="8.5" font-family="Georgia,serif" fill="#6B4A00" font-weight="700">★</text>
      <circle cx="26" cy="18" r="13" fill="url(#goldGrad)" stroke="#8A6100" stroke-width="1.1"/>
      <circle cx="26" cy="18" r="9.5" fill="none" stroke="#8A6100" stroke-width="0.6" stroke-dasharray="1.3,1.3" opacity="0.6"/>

  let r=(n>>16)+Math.round(255*(percent/100)), g=(n>>8&0xff)+Math.round(255*(percent/100)), b=(n&0xff)+Math.round(255*(percent/100));
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}

function initSwipeDelete(root){
  root.querySelectorAll('.notif-wrap').forEach(wrap=>{
    const row = wrap.querySelector('.notif-row');
    let startX=0, currentX=0, dragging=false;
    row.addEventListener('pointerdown', e=>{
      startX = e.clientX; dragging = true; currentX = 0;
      row.style.transition = 'none';
      row.setPointerCapture(e.pointerId);
    });
    row.addEventListener('pointermove', e=>{
      if(!dragging) return;
      currentX = e.clientX - startX;
      if(currentX < 0) row.style.transform = `translateX(${Math.max(currentX, -110)}px)`;
    });
    function finish(){
      if(!dragging) return;
      dragging = false;
      row.style.transition = 'transform .2s ease';
      if(currentX < -65){
        row.style.transform = 'translateX(-100%)';
        wrap.style.transition = 'max-height .2s ease .15s, margin .2s ease .15s, opacity .2s ease';
        wrap.style.opacity = '0';
        setTimeout(()=>{
          const key = wrap.dataset.notifKey;
          state.dismissedNotifs = state.dismissedNotifs || [];
          if(!state.dismissedNotifs.includes(key)) state.dismissedNotifs.push(key);
          save();
          updateNotifBadge();
          // Re-render the whole notifications list so an emptied section's
          // header doesn't linger behind and nothing gets left half-removed.
          if(modalCtx.kind === 'notifications'){
            $modalSheet.innerHTML = modalTemplates.notifications();
            initSwipeDelete($modalSheet);
          }
        }, 200);
      } else {
        row.style.transform = 'translateX(0)';
      }
      currentX = 0;
    }
    row.addEventListener('pointerup', finish);
    row.addEventListener('pointercancel', finish);
  });
}
function initWheelPickers(root){
  root.querySelectorAll('.wheel-col').forEach(col=>{
    const items = Array.from(col.querySelectorAll('.wheel-item'));
    const itemH = 34;
    function updateSelection(snap){
      let idx = Math.round(col.scrollTop / itemH);
      idx = Math.max(0, Math.min(items.length-1, idx));
      items.forEach((it,i)=>it.classList.toggle('selected', i===idx));
      col.dataset.value = items[idx] ? items[idx].dataset.val : '';
      if(snap) col.scrollTop = idx*itemH;
    }
    let timer;
    col.addEventListener('scroll', ()=>{
      clearTimeout(timer);
      timer = setTimeout(()=>updateSelection(true), 130);
    });
    items.forEach((it,i)=>{
      it.addEventListener('click', ()=>{ col.scrollTo({top:i*itemH, behavior:'smooth'}); });
    });
    const initIdx = parseInt(col.dataset.initial)||0;
    col.scrollTop = initIdx*itemH;
    updateSelection(false);
  });
}

// ---------- LOAN LOGIC ----------
function loanInstallments(loan){
  const list = [];
  for(let i=0;i<loan.count;i++){
    const ym = addMonths(loan.startMonth, i);
    const key = loan.id+'#'+i;
    let status = (state.loanStatus[key]) || 'bekliyor';
    if(status==='bekliyor'){
      const dueDate = new Date(...ym.split('-').map((v,idx)=>idx===1?Number(v)-1:Number(v)), loan.dueDay||1);
      if(dueDate < new Date(new Date().setHours(0,0,0,0))) status='gecikti';
    }
    list.push({ index:i, ym, amount:loan.amount, status, key });
  }
  return list;
}
function loanRemaining(loan){
  return loanInstallments(loan).filter(i=>i.status!=='odendi').reduce((s,i)=>s+i.amount,0);
}
function loanInstallmentForMonth(loan, ym){
  return loanInstallments(loan).find(i=>i.ym===ym) || null;
}

// ---------- BILL LOGIC ----------
function prevMonthOverride(bill, ym){
  let cursor = ym;
  for(let i=0;i<12;i++){
    cursor = addMonths(cursor, -1);
    const ov = state.billOverrides[bill.id] && state.billOverrides[bill.id][cursor];
    if(ov) return ov;
  }
  return null;
}
function billRecord(bill, ym){
  const ov = state.billOverrides[bill.id] && state.billOverrides[bill.id][ym];
  if(ov) return { amount: ov.amount, status: ov.status, isEstimate:false, estimateType:null };
  const prev = prevMonthOverride(bill, ym);
  if(prev){
    return { amount: prev.amount, status:'bekliyor', isEstimate:true, estimateType: bill.isFixed?'sabit · geçen ayla aynı':'tahmini · geçen aya göre' };
  }
  return { amount: bill.estimatedAmount||0, status:'bekliyor', isEstimate:true, estimateType:'tahmini' };
}
function setBillRecord(billId, ym, amount, status){
  if(!state.billOverrides[billId]) state.billOverrides[billId]={};
  state.billOverrides[billId][ym] = { amount, status };
  save();
}

// ---------- CARD LOGIC ----------
function cardStatement(cardId, ym){
  return state.cardStatements.find(s=>s.cardId===cardId && s.ym===ym) || null;
}

// ---------- DEBT TL VALUE ----------
function debtTL(d){
  if(d.debtType==='TL') return d.amount;
  if(d.debtType==='Altin') return d.amount * (GOLD_UNITS[d.unit]||1) * GOLD_RATE;
  if(d.debtType==='Doviz') return d.amount * (FX[d.unit]||1);
  return 0;
}
function debtDisplay(d){
  if(d.debtType==='TL') return formatTL(d.amount);
  if(d.debtType==='Altin') return d.amount+' '+(GOLD_LABELS[d.unit]||d.unit);
  if(d.debtType==='Doviz') return d.amount.toLocaleString('tr-TR')+' '+d.unit;
  return '';
}

// ---------- AGGREGATES ----------
function totalDebt(){
  // Kalan Toplam Borç: krediler + kartlar + elden borçlar (döviz/altın dahil). Faturalar burada YOK —
  // faturaların "kalan toplam bakiyesi" kavramı yok, sadece aylık gider oldukları için Aylık Borç'a girerler.
  const loans = state.loans.reduce((s,l)=>s+loanRemaining(l),0);
  const cards = state.cards.reduce((s,c)=>s+(c.totalDebt||0),0);
  const kmh = state.kmhAccounts.reduce((s,k)=>s+(k.debt||0),0);
  const bills = state.bills.reduce((s,b)=>{
    if(b.autoPay) return s;
    const r = billRecord(b, state.selectedMonth);
    return s + (r.status!=='odendi' ? r.amount : 0);
  },0);
  const debts = state.debts.filter(d=>!d.paid && d.direction==='borcum').reduce((s,d)=>s+debtTL(d),0);
  return { loans, cards, kmh, bills, debts, total: loans+cards+kmh+debts };
}
function monthlyDue(ym){
  // Aylık Borç: seçilen ay içinde ödenmesi gereken toplam tutar (kredi taksiti, kart bu ayki tutarı,
  // faturalar, elden borçlar, manuel ödemeler) — henüz ödenmemiş olanların toplamı.
  return monthlyRows(ym).filter(r=>r.status!=='odendi').reduce((s,r)=>s+r.amount,0);
}
function monthlyRows(ym){
  const rows = [];
  state.loans.forEach(l=>{
    const inst = loanInstallmentForMonth(l, ym);
    if(inst) rows.push({ kind:'loan', refId:l.id, key:inst.key, day:l.dueDay||1, name:l.name, cat:'kredi',
      amount:inst.amount, status:inst.status });
  });
  state.bills.forEach(b=>{
    if(b.autoPay) return;
    const r = billRecord(b, ym);
    rows.push({ kind:'bill', refId:b.id, key:b.id+'#'+ym, day:b.dueDay||1, name:b.name, cat:'fatura',
      amount:r.amount, status:r.status, isEstimate:r.isEstimate });
  });
  state.cards.forEach(c=>{
    const st = cardStatement(c.id, ym);
    if(st) rows.push({ kind:'card', refId:c.id, key:st.id, day:c.dueDay||1, name:bankByCode(c.bankCode).name+' Kartı', cat:'kart',
      amount:st.amount, status:st.status });
  });
  state.manualPayments.filter(p=>p.ym===ym).forEach(p=>{
    rows.push({ kind:'manual', refId:p.id, key:p.id, day:new Date(p.date).getDate(), name:p.description, cat:p.category||'elden',
      amount:p.amount, status:p.status });
  });
  state.debts.filter(d=>!d.paid && d.direction==='borcum').forEach(d=>{
    rows.push({ kind:'debt', refId:d.id, key:d.id, day:d.date?new Date(d.date).getDate():1, name:d.person, cat:'elden',
      amount:debtTL(d), status:'bekliyor' });
  });
  state.kmhAccounts.forEach(k=>{
    const amt = k.plannedPayment||0;
    if(amt>0) rows.push({ kind:'kmh', refId:k.id, key:k.id, day:k.dueDay||1, name:bankByCode(k.bankCode).name+' KMH', cat:'kmh',
      amount:amt, status:k.paymentStatus||'bekliyor' });
  });
  rows.sort((a,b)=>a.day-b.day);
  return rows;
}

// ---------- NOTIFICATIONS ----------
function getNotifications(){
  const today = new Date(); today.setHours(0,0,0,0);
  const overdue=[], dueToday=[], soon=[];
  const dismissed = state.dismissedNotifs||[];
  function bucket(key, name, amount, dueDate){
    if(dismissed.includes(key)) return;
    const days = Math.round((dueDate-today)/86400000);
    const item = { key, name, amount, days };
    if(days<0) overdue.push(item);
    else if(days===0) dueToday.push(item);
    else if(days<=5) soon.push(item);
  }
  state.loans.forEach(l=>{
    const insts = loanInstallments(l);
    const next = insts.find(i=>i.status!=='odendi');
    if(next){
      const [y,m] = next.ym.split('-').map(Number);
      bucket('loan-'+next.key, l.name, next.amount, new Date(y, m-1, l.dueDay||1));
    }
  });
  state.cards.forEach(c=>{
    const st = cardStatement(c.id, state.selectedMonth);
    if(st && st.status!=='odendi'){
      const [y,m] = state.selectedMonth.split('-').map(Number);
      bucket('card-'+st.id, bankByCode(c.bankCode).name+' Kartı', st.amount, new Date(y, m-1, c.dueDay||1));
    }
  });
  state.bills.forEach(b=>{
    if(b.autoPay) return;
    const r = billRecord(b, state.selectedMonth);
    if(r.status!=='odendi'){
      const [y,m] = state.selectedMonth.split('-').map(Number);
      bucket('bill-'+b.id+'-'+state.selectedMonth, b.name, r.amount, new Date(y, m-1, b.dueDay||1));
    }
  });
  return { overdue, dueToday, soon };
}
function updateNotifBadge(){
  const n = getNotifications();
  const count = n.overdue.length + n.dueToday.length + n.soon.length;
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  if(count>0){ badge.textContent = count>9?'9+':count; badge.style.display='flex'; }
  else badge.style.display='none';
}

    function cancel(){ clearTimeout(timer); }
    el.addEventListener('pointerdown', e=>start(e.clientX,e.clientY));
    el.addEventListener('pointermove', e=>move(e.clientX,e.clientY));
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointerleave', cancel);
    el.addEventListener('contextmenu', e=>e.preventDefault());
  });
}

}

function formatDMY(ym, day){
  const [y,m] = ym.split('-');
  return String(day).padStart(2,'0')+'.'+m+'.'+y;
}
function renderLoans(){
  $fab.style.display='none';

      const insts = loanInstallments(l);

  e.preventDefault();
  if(!getORKey()){ openModal('aiSettings'); return; }

});

document.getElementById('micFab').addEventListener('pointerleave', ()=> stopListening());

document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  try{
    if(typeof claude === 'undefined' || !claude.use){
      alert('İndirme özelliği bu görünümde kullanılamıyor.');
      return;
    }
    const downloads = await claude.use('downloads');
    if(!downloads){
      alert('İndirme özelliği bu görünümde kullanılamıyor.');
      return;
    }
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    await downloads.save({ filename: 'borc-takip.html', data: html });
  } catch(e){
    if(e && e.code === 'declined') return;
    console.error('download failed', e);
  }
});
$modalBackdrop.addEventListener('click', e=>{ if(e.target===$modalBackdrop) closeModal(); });

document.body.addEventListener('click', function(e){
  if(e.target.tagName==='INPUT' || e.target.tagName==='SELECT'){ e.stopPropagation(); return; }
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='inline-edit'){
    startInlineEdit(t.dataset.id, t.dataset.field, t);
    return;
  }
  if(action==='edit-income'){
    const row = t.closest('.fin-row');
    const valueEl = row ? row.querySelector('.fr-value') : t;
    startIncomeEdit(valueEl);
    return;
  }
  if(action==='lp-edit'){
    const type=t.dataset.type, id=t.dataset.id;
    closeModal();
    if(type==='loan') openModal('editLoan', id);
    if(type==='card') openModal('cardStatement', id);
    if(type==='kmh') openModal('kmhSettings', id);
    if(type==='bill') openModal('billRecord', id);
    if(type==='debt') openModal('viewDebt', id);
    return;
  }
  if(action==='lp-delete'){
    const type=t.dataset.type, id=t.dataset.id;
    closeModal();
    askConfirm('Bu kaydı silmek istediğine emin misin?', ()=>{
      if(type==='loan'){ state.loans = state.loans.filter(l=>l.id!==id); }
      if(type==='card'){ state.cards = state.cards.filter(c=>c.id!==id); state.cardStatements = state.cardStatements.filter(s=>s.cardId!==id); }
      if(type==='kmh'){ state.kmhAccounts = state.kmhAccounts.filter(k=>k.id!==id); }
      if(type==='bill'){ state.bills = state.bills.filter(b=>b.id!==id); delete state.billOverrides[id]; }
      if(type==='debt'){ state.debts = state.debts.filter(d=>d.id!==id); }
      save(); render();
    });
    return;
  }
  if(action==='pick-month'){
    state.selectedMonth = t.dataset.ym;
    save(); closeModal(); navigate('monthly');
    return;
  }
  if(action==='toggle-card-status'){
    const id = t.dataset.id;
    const card = state.cards.find(c=>c.id===id);
    let st = cardStatement(id, state.selectedMonth);
    if(!st){
      st = { id:uid(), cardId:id, ym:state.selectedMonth, amount:0, status:'odendi' };
      state.cardStatements.push(st);
      card.totalDebt = Math.max(0, (card.totalDebt||0) - st.amount);
    } else if(st.status==='odendi'){
      st.status = 'bekliyor';
      card.totalDebt = (card.totalDebt||0) + st.amount;
    } else {
      st.status = 'odendi';
      card.totalDebt = Math.max(0, (card.totalDebt||0) - st.amount);
    }
    save(); render(); return;
  }

  if(action==='nav'){ navigate(t.dataset.page, t.dataset.id?{loanDetailId:t.dataset.id}:null); return; }
  if(action==='close-modal'){ closeModal(); return; }
  if(action==='open-modal'){ openModal(t.dataset.modal, t.dataset.id); return; }
  if(action==='toggle-switch'){ t.classList.toggle('on'); return; }

  if(action==='month-prev'){ state.selectedMonth = addMonths(state.selectedMonth,-1); save(); render(); return; }
  if(action==='month-next'){ state.selectedMonth = addMonths(state.selectedMonth,1); save(); render(); return; }

  // choice rows (bill category, direction, debt type, loan type)
  if(t.parentElement && t.parentElement.classList.contains('choice-row') && t.tagName==='BUTTON'){
    const row = t.parentElement;
    row.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    row.dataset.value = t.dataset.val;
    if(row.id==='typeChoice') updateTypeExtra(t.dataset.val);
    return;
  }
  // bank chip grids
  if(t.classList.contains('bank-chip')){
    const row = t.parentElement;
    row.querySelectorAll('.bank-chip').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    row.dataset.value = t.dataset.val;
    return;
  }
  // day picker grid
  if(t.classList.contains('day-cell')){
    const row = t.parentElement;
    row.querySelectorAll('.day-cell').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    row.dataset.value = t.dataset.val;
    return;
  }
  // bill category grid
  if(t.classList.contains('cat-chip')){
    const row = t.parentElement;
    row.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    row.dataset.value = t.dataset.val;
    const wrap = document.getElementById('nameFieldWrap');
    if(wrap) wrap.innerHTML = billNameField(t.dataset.val);
    return;
  }

  if(action==='save-loan'){
    const bankRow=document.getElementById('loanBankChoice'), typeRow=document.getElementById('loanTypeChoice');
    const bankCode = bankRow.dataset.value || bankRow.querySelector('.active').dataset.val;
    const loanType = typeRow.dataset.value || typeRow.querySelector('.active').dataset.val;
    const nameInput=val('f_name'), amount=tlVal('f_amount'), count=parseInt(val('f_count'))||0,
      start=wheelValue('loanDateWheel_m')||state.selectedMonth, day=parseInt(wheelValue('loanDateWheel_d'))||15;
    if(!amount||!count){ alert('Aylık taksit ve taksit sayısı zorunlu.'); return; }
    const name = nameInput || loanType;
    state.loans.push({ id:uid(), bankCode, loanType, name, total:amount*count, amount, count, startMonth:start, dueDay:day });

  }
  if(action==='save-loan-edit'){
    const id=t.dataset.id;
    const loan = state.loans.find(l=>l.id===id);
    if(!loan) return;
    const bankRow=document.getElementById('loanBankChoice'), typeRow=document.getElementById('loanTypeChoice');

      start=wheelValue('loanDateWheel_m')||loan.startMonth, day=parseInt(wheelValue('loanDateWheel_d'))||loan.dueDay;

    if(remainingInput){
      let remaining = parseInt(remainingInput.value);
      if(!isNaN(remaining)){
        remaining = Math.max(0, Math.min(count, remaining));
        const paidCount = count - remaining;
        for(let i=0;i<count;i++){
          const key = id+'#'+i;
          if(i < paidCount) state.loanStatus[key] = 'odendi';
          else delete state.loanStatus[key];

      state.loans = state.loans.filter(l=>l.id!==id);

  if(action==='save-card'){
    const bankRow=document.getElementById('cardBankChoice');

    save(); closeModal(); navigate('cards'); return;
  }
  if(action==='save-card-settings'){
    const id=t.dataset.id, limit=tlVal('f_limit'), totalDebt=tlVal('f_totalDebt'), amount=tlVal('f_amount');
    if(!limit){ alert('Kart limiti girmeden kaydedilemez.'); return; }
    const day = parseInt(wheelValue('cardDayChoice'))||15;
    const paidOn = document.getElementById('f_paid').classList.contains('on');
    const card = state.cards.find(c=>c.id===id);
    const existing = cardStatement(id, state.selectedMonth);
    const wasPaid = existing && existing.status==='odendi';
    let newTotalDebt = totalDebt;
    if(!wasPaid && paidOn){ newTotalDebt = Math.max(0, newTotalDebt - amount); }
    else if(wasPaid && !paidOn){ newTotalDebt = newTotalDebt + (existing.amount||0); }
    if(card){ card.limit = limit; card.dueDay = day; card.totalDebt = newTotalDebt; }
    if(existing){ existing.amount = amount; existing.status = paidOn?'odendi':'bekliyor'; }
    else if(amount>0 || paidOn) state.cardStatements.push({ id:uid(), cardId:id, ym:state.selectedMonth, amount, status:paidOn?'odendi':'bekliyor' });
    save(); closeModal(); render(); return;
  }
  if(action==='delete-card'){
    const id=t.dataset.id;
    closeModal();
    askConfirm('Bu kartı ve ekstrelerini silmek istediğine emin misin?', ()=>{
      state.cards = state.cards.filter(c=>c.id!==id);
      state.cardStatements = state.cardStatements.filter(s=>s.cardId!==id);
      save(); navigate('cards');
    });
    return;
  }
  if(action==='toggle-kmh-payment'){
    const k = state.kmhAccounts.find(x=>x.id===t.dataset.id);
    if(k){
      const planned = k.plannedPayment||0;
      if(k.paymentStatus==='odendi'){
        k.paymentStatus='bekliyor';
        k.debt = (k.debt||0) + planned;
      } else {
        k.paymentStatus='odendi';
        k.debt = Math.max(0, (k.debt||0) - planned);
      }
      save(); render();
    }
    return;
  }
  if(action==='save-kmh'){
    const bankRow=document.getElementById('kmhBankChoice');
    const bankCode = bankRow.dataset.value || bankRow.querySelector('.active').dataset.val;
    const limit=tlVal('f_limit');
    if(!limit){ alert('KMH limiti girmeden kaydedilemez.'); return; }
    const day = parseInt(wheelValue('kmhDayChoice'))||15;
    state.kmhAccounts.push({ id:uid(), bankCode, limit, dueDay:day, debt:0, plannedPayment:0, paymentStatus:'bekliyor' });
    save(); closeModal(); navigate('kmh'); return;
  }
  if(action==='save-kmh-settings'){
    const id=t.dataset.id, limit=tlVal('f_limit'), totalDebt=tlVal('f_totalDebt'), planned=tlVal('f_amount');
    if(!limit){ alert('KMH limiti girmeden kaydedilemez.'); return; }
    const day = parseInt(wheelValue('kmhDayChoice'))||15;
    const paidOn = document.getElementById('f_paid').classList.contains('on');
    const k = state.kmhAccounts.find(x=>x.id===id);
    if(k){
      const wasPaid = k.paymentStatus==='odendi';
      let newDebt = totalDebt;
      if(!wasPaid && paidOn){ newDebt = Math.max(0, newDebt - planned); }
      else if(wasPaid && !paidOn){ newDebt = newDebt + (k.plannedPayment||0); }

      state.kmhAccounts = state.kmhAccounts.filter(k=>k.id!==id);

  if(action==='save-bill-record'){

  if(action==='delete-bill'){
    const id=t.dataset.id;
    closeModal();
    askConfirm('Bu aboneliği silmek istediğine emin misin?', ()=>{
      state.bills = state.bills.filter(b=>b.id!==id);
      delete state.billOverrides[id];
      save(); navigate('bills');

  if(action==='save-debt'){

    if(debtType==='Doviz') unit = document.getElementById('f_fxUnit') ? document.getElementById('f_fxUnit').value : 'USD';
    state.debts.push({ id:uid(), person, direction, debtType, unit, amount, date, paid:false });

  if(action==='save-debt-status'){
    const d = state.debts.find(x=>x.id===t.dataset.id);

  }
  if(action==='delete-debt'){
    const id=t.dataset.id;
    closeModal();
    askConfirm('Bu kaydı silmek istediğine emin misin?', ()=>{
      state.debts = state.debts.filter(d=>d.id!==id);
      save(); navigate('debts');
    });
    return;
  }

  if(action==='save-manual-payment'){
    const description=val('f_desc'), amount=tlVal('f_amount');
    const date = buildDateFromWheel('paymentDateWheel') || (state.selectedMonth+'-01');
    if(!description||!amount){ alert('Açıklama ve tutar gerekli.'); return; }
    state.manualPayments.push({ id:uid(), ym:state.selectedMonth, description, amount, date, category:'elden', status:'bekliyor' });
    save(); closeModal(); render(); return;
  }
  if(action==='toggle-row'){
    const kind=t.dataset.kind;
    if(kind==='loan'){
      const [loanId, idx] = t.dataset.key.split('#');
      state.loanStatus[t.dataset.key] = (state.loanStatus[t.dataset.key]==='odendi')?'bekliyor':'odendi';
      save(); render(); return;
    }
    if(kind==='bill'){
      const b = state.bills.find(x=>x.id===t.dataset.ref);
      const r = billRecord(b, state.selectedMonth);
      setBillRecord(b.id, state.selectedMonth, r.amount, r.status==='odendi'?'bekliyor':'odendi');
      render(); return;
    }
    if(kind==='card'){
      const st = state.cardStatements.find(s=>s.id===t.dataset.key);
      const card = state.cards.find(c=>c.id===t.dataset.ref);
      if(st && card){
        if(st.status==='odendi'){ st.status='bekliyor'; card.totalDebt=(card.totalDebt||0)+st.amount; }
        else { st.status='odendi'; card.totalDebt=Math.max(0,(card.totalDebt||0)-st.amount); }
        save(); render();
      }
      return;
    }
    if(kind==='manual'){
      const p = state.manualPayments.find(x=>x.id===t.dataset.ref);
      if(p){ p.status = p.status==='odendi'?'bekliyor':'odendi'; save(); render(); }
      return;
    }
    if(kind==='debt'){
      const d = state.debts.find(x=>x.id===t.dataset.ref);
      if(d){ d.paid = true; save(); render(); }
      return;
    }
  }
});

function startInlineEdit(entityId, field, spanEl){
  const isKmh = field==='kmhDebt' || field==='kmhPlanned';
  const card = isKmh ? state.kmhAccounts.find(k=>k.id===entityId) : state.cards.find(c=>c.id===entityId);
  if(!card) return;
  let current = 0;
  if(field==='totalDebt') current = card.totalDebt||0;
  else if(field==='kmhDebt') current = card.debt||0;
  else if(field==='kmhPlanned') current = card.plannedPayment||0;
  else if(field==='amount'){ const st = cardStatement(entityId, state.selectedMonth); current = st?st.amount:0; }
  spanEl.innerHTML = `<input type="text" inputmode="numeric" class="cc-inline-input">`;
  const inp = spanEl.querySelector('input');
  inp.value = current ? current.toLocaleString('tr-TR') : '';
  formatTLInputLive(inp);
  inp.focus(); inp.select();
  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    activeInlineCommit = null;
    const digits = inp.value.replace(/\D/g,'');
    const amount = digits ? parseInt(digits,10) : 0;
    if(field==='totalDebt'){ card.totalDebt = amount; }
    else if(field==='kmhDebt'){ card.debt = amount; }
    else if(field==='kmhPlanned'){ card.plannedPayment = amount; }
    else if(field==='amount'){
      const st = cardStatement(entityId, state.selectedMonth);
      if(st) st.amount = amount;
      else state.cardStatements.push({ id:uid(), cardId:entityId, ym:state.selectedMonth, amount, status:'bekliyor' });
    }
    save(); render();
  }
  activeInlineCommit = commit;
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
}

async function callOpenRouter(userText){
  const key = getORKey();
  if(!key) throw new Error('API anahtarı ayarlanmamış.');
  const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + key,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      model: AI_MODEL,
      messages: [
        { role: 'system', content: buildAiSystemPrompt() },
        { role: 'user', content: userText },
      ],
      temperature: 0.2,
    }),
  });
  if(!resp.ok){
    const errText = await resp.text().catch(()=>'');
    throw new Error('API hatası (' + resp.status + '): ' + errText.slice(0,200));
  }
  const data = await resp.json();
  return data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
}

function parseAiJson(content){
  if(!content) return null;
  let text = content.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
  try{ return JSON.parse(text); }
  catch(e){
    const m = text.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); }catch(e2){ return null; } }
    return null;
  }
}

function findBank(nameFragment){
  const q = (nameFragment||'').toLocaleLowerCase('tr');
  if(!q) return bankByCode('diger');
  return BANKS.find(b=>b.name.toLocaleLowerCase('tr').includes(q) || b.short.toLocaleLowerCase('tr').includes(q) || q.includes(b.short.toLocaleLowerCase('tr'))) || bankByCode('diger');
}
function findLoanByName(name){
  const q = (name||'').toLocaleLowerCase('tr');
  return state.loans.find(l=>l.name.toLocaleLowerCase('tr').includes(q) || bankByCode(l.bankCode).name.toLocaleLowerCase('tr').includes(q));
}
function findCardByBank(name){
  const bank = findBank(name);
  const match = state.cards.find(c=>c.bankCode===bank.code);
  if(match) return match;
  // isim belirtilmemiş/anlaşılamamışsa VE tek bir kart varsa onu kullan; yanlış bankaya
  // yanlışlıkla işlem yapmamak için başka hiçbir durumda tahmin yapma.
  if((!name || bank.code==='diger') && state.cards.length===1) return state.cards[0];
  return null;
}
function findKmhByBank(name){
  const bank = findBank(name);
  const match = state.kmhAccounts.find(k=>k.bankCode===bank.code);
  if(match) return match;
  if((!name || bank.code==='diger') && state.kmhAccounts.length===1) return state.kmhAccounts[0];
  return null;
}
function findBillByName(name){
  const q = (name||'').toLocaleLowerCase('tr');
  return state.bills.find(b=>b.name.toLocaleLowerCase('tr').includes(q) || b.category.toLocaleLowerCase('tr').includes(q));
}
function findDebtByPerson(name){
  const q = (name||'').toLocaleLowerCase('tr');
  return state.debts.find(d=>d.person.toLocaleLowerCase('tr').includes(q));
}

function executeAiAction(cmd){
  if(!cmd || !cmd.action) return 'Anlayamadım, tekrar dener misin?';
  switch(cmd.action){
    case 'addLoan': {
      const bank = findBank(cmd.bankName);
      const amount = Number(cmd.amount)||0, count = Number(cmd.count)||0;
      if(!amount||!count) return 'Tutar ve taksit sayısını anlayamadım.';
      state.loans.push({ id:uid(), bankCode:bank.code, loanType:cmd.loanType||'İhtiyaç Kredisi', name:cmd.loanType||'Kredi', amount, count, total:amount*count, startMonth:monthKey(new Date()), dueDay:15 });
      save(); render();
      return `${bank.name} için aylık ${formatTL(amount)}, ${count} taksitli kredi eklendi.`;
    }
    case 'markLoanPaid': {
      const loan = findLoanByName(cmd.loanName);
      if(!loan) return 'Bu isimde bir kredi bulamadım.';
      const next = loanInstallments(loan).find(i=>i.status!=='odendi');
      if(!next) return 'Bu kredinin tüm taksitleri zaten ödenmiş.';
      state.loanStatus[next.key] = 'odendi';
      save(); render();
      return `${loan.name} kredisinin bir sonraki taksiti ödendi olarak işaretlendi.`;
    }
    case 'addCard': {
      const bank = findBank(cmd.bankName);
      const limit = Number(cmd.limit)||0;
      if(!limit) return 'Kart limitini anlayamadım.';
      state.cards.push({ id:uid(), bankCode:bank.code, limit, dueDay:15, totalDebt:0 });
      save(); render();
      return `${bank.name} kredi kartı ${formatTL(limit)} limitle eklendi.`;
    }
    case 'setCardDebt': {
      const card = findCardByBank(cmd.bankName);
      if(!card) return 'Bu bankaya ait bir kredi kartı bulamadım.';
      card.totalDebt = Number(cmd.amount)||0;
      save(); render();
      return `${bankByCode(card.bankCode).name} kartının toplam borcu ${formatTL(card.totalDebt)} olarak güncellendi.`;
    }
    case 'setCardPlanned': {
      const card = findCardByBank(cmd.bankName);
      if(!card) return 'Bu bankaya ait bir kredi kartı bulamadım.';
      const amount = Number(cmd.amount)||0;
      const existing = cardStatement(card.id, state.selectedMonth);
      if(existing) existing.amount = amount;
      else state.cardStatements.push({ id:uid(), cardId:card.id, ym:state.selectedMonth, amount, status:'bekliyor' });
      save(); render();
      return `${bankByCode(card.bankCode).name} kartı için ödenecek miktar ${formatTL(amount)} olarak ayarlandı.`;
    }
    case 'markCardPaid': {
      const card = findCardByBank(cmd.bankName);
      if(!card) return 'Bu bankaya ait bir kredi kartı bulamadım.';
      const existing = cardStatement(card.id, state.selectedMonth);
      const amt = existing ? existing.amount : 0;
      card.totalDebt = Math.max(0, (card.totalDebt||0) - amt);
      if(existing) existing.status = 'odendi';
      save(); render();
      return `${bankByCode(card.bankCode).name} kartının bu ayki ödemesi (${formatTL(amt)}) yapıldı, borçtan düşüldü.`;
    }
    case 'addKmh': {
      const bank = findBank(cmd.bankName);
      const limit = Number(cmd.limit)||0;
      if(!limit) return 'KMH limitini anlayamadım.';
      state.kmhAccounts.push({ id:uid(), bankCode:bank.code, limit, dueDay:15, debt:0, plannedPayment:0, paymentStatus:'bekliyor' });
      save(); render();
      return `${bank.name} KMH hesabı ${formatTL(limit)} limitle eklendi.`;
    }
    case 'setKmhDebt': {
      const k = findKmhByBank(cmd.bankName);
      if(!k) return 'Bu bankaya ait bir KMH hesabı bulamadım.';
      k.debt = Number(cmd.amount)||0;
      save(); render();
      return `${bankByCode(k.bankCode).name} KMH toplam borcu ${formatTL(k.debt)} olarak güncellendi.`;
    }
    case 'setKmhPlanned': {
      const k = findKmhByBank(cmd.bankName);
      if(!k) return 'Bu bankaya ait bir KMH hesabı bulamadım.';
      k.plannedPayment = Number(cmd.amount)||0;
      save(); render();
      return `${bankByCode(k.bankCode).name} KMH için ödenecek miktar ${formatTL(k.plannedPayment)} olarak ayarlandı.`;
    }
    case 'markKmhPaid': {
      const k = findKmhByBank(cmd.bankName);
      if(!k) return 'Bu bankaya ait bir KMH hesabı bulamadım.';
      const planned = k.plannedPayment||0;
      k.debt = Math.max(0, (k.debt||0) - planned);
      k.paymentStatus = 'odendi';
      save(); render();
      return `${bankByCode(k.bankCode).name} KMH ödemesi (${formatTL(planned)}) yapıldı, borçtan düşüldü.`;
    }
    case 'addBill': {
      const amount = Number(cmd.amount)||0;
      state.bills.push({ id:uid(), name:cmd.name||cmd.category||'Fatura', category:cmd.category||'Diğer', estimatedAmount:amount, dueDay:15, isFixed:false, autoPay:false });
      save(); render();
      return `${cmd.name||cmd.category} ${formatTL(amount)} olarak eklendi.`;
    }
    case 'markBillPaid': {
      const bill = findBillByName(cmd.name);
      if(!bill) return 'Bu isimde bir fatura/abonelik bulamadım.';
      const r = billRecord(bill, state.selectedMonth);
      setBillRecord(bill.id, state.selectedMonth, r.amount, 'odendi');
      save(); render();
      return `${bill.name} ödendi olarak işaretlendi.`;
    }
    case 'setBillAmount': {
      const bill = findBillByName(cmd.name);
      if(!bill) return 'Bu isimde bir fatura/abonelik bulamadım.';
      const amount = Number(cmd.amount)||0;
      const r = billRecord(bill, state.selectedMonth);
      setBillRecord(bill.id, state.selectedMonth, amount, r.status);
      save(); render();
      return `${bill.name} tutarı ${formatTL(amount)} olarak güncellendi.`;
    }
    case 'toggleBillAutoPay': {
      const bill = findBillByName(cmd.name);
      if(!bill) return 'Bu isimde bir fatura/abonelik bulamadım.';
      bill.autoPay = !!cmd.on;
      save(); render();
      return `${bill.name} için otomatik ödeme talimatı ${bill.autoPay?'açıldı':'kapatıldı'}.`;
    }
    case 'addDebt': {
      const amount = Number(cmd.amount)||0;
      state.debts.push({ id:uid(), person:cmd.person||'İsimsiz', direction:cmd.direction==='alacak'?'alacak':'borcum', debtType:'TL', unit:'TL', amount, date:new Date().toISOString().slice(0,10), paid:false });
      save(); render();
      return `${cmd.person} için ${formatTL(amount)} kaydı eklendi.`;
    }
    case 'markDebtPaid': {
      const debt = findDebtByPerson(cmd.person);
      if(!debt) return 'Bu isimde bir elden borç kaydı bulamadım.';
      debt.paid = true;
      save(); render();
      return `${debt.person} ile olan borç ödendi olarak işaretlendi.`;
    }
    case 'setIncome': {
      state.monthlyIncome = Number(cmd.amount)||0;
      save(); render();
      return `Aylık gelir ${formatTL(state.monthlyIncome)} olarak güncellendi.`;
    }
    case 'clarify': return cmd.message || 'Tam olarak ne yapmamı istediğini anlayamadım, tekrar söyler misin?';
    case 'answer': return cmd.message || '';
    default: return 'Bu işlemi henüz yapamıyorum.';
  }
}

async function handleAiRequest(text){
  if(!text) return;
  if(!getORKey()){ openModal('aiSettings'); return; }
  const mic = document.getElementById('micFab');
  aiStatus('🤔 Düşünüyor...');
  if(mic) mic.classList.add('thinking');
  try{
    const content = await callOpenRouter(text);
    const cmd = parseAiJson(content);
    const message = executeAiAction(cmd);
    aiStatus('✅ ' + message);
  } catch(err){
    console.error('AI error', err);
    aiStatus('⚠️ ' + (err.message || 'Bilinmeyen hata'));
  } finally {
    if(mic) mic.classList.remove('thinking');
    setTimeout(()=>aiStatus(null), 5000);
  }
}

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function hasSpeechRecognition(){
  // iOS Safari, tarayıcının kendi konuşma tanıma nesnesini tanımlıyor gibi görünse de
  // gerçekte çalışmıyor (buton "dinliyor" durumunda asılı kalıyor) — bu yüzden iOS'ta
  // hiç denemeden doğrudan yazı/klavye-mikrofonu yedeğine geçiyoruz.
  if(isIOS()) return false;
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
let aiRecognition = null, aiRecognizing = false, aiRecognitionTimeout = null;
function startListening(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  try{ aiRecognition = new Ctor(); } catch(e){ openModal('aiTextInput'); return; }
  aiRecognition.lang = 'tr-TR';
  aiRecognition.interimResults = false;
  aiRecognition.maxAlternatives = 1;
  aiRecognizing = true;
  const mic = document.getElementById('micFab');
  if(mic) mic.classList.add('listening');
  aiStatus('🎙️ Dinliyor...');
  aiRecognition.onresult = (e)=>{
    clearTimeout(aiRecognitionTimeout);
    const text = e.results[0][0].transcript;
    handleAiRequest(text);
  };
  aiRecognition.onerror = ()=>{
    clearTimeout(aiRecognitionTimeout);
    aiStatus(null);
    if(mic) mic.classList.remove('listening');
    openModal('aiTextInput');
  };
  aiRecognition.onend = ()=>{
    clearTimeout(aiRecognitionTimeout);
    aiRecognizing = false;
    if(mic) mic.classList.remove('listening');
  };
  try{ aiRecognition.start(); } catch(e){ openModal('aiTextInput'); return; }
  // Güvenlik ağı: bir şekilde hiçbir olay tetiklenmez ve buton kırmızıda asılı kalırsa,
  // 8 saniye sonra zorla durdurup yazı kutusuna geçiyoruz.
  aiRecognitionTimeout = setTimeout(()=>{
    if(aiRecognizing){
      try{ aiRecognition.stop(); }catch(e){}
      aiRecognizing = false;
      if(mic) mic.classList.remove('listening');
      aiStatus(null);
      openModal('aiTextInput');
    }
  }, 8000);
}
function stopListening(){
  if(aiRecognition && aiRecognizing){ try{ aiRecognition.stop(); }catch(e){} }
}

function flushAndSave(){
  if(activeInlineCommit) activeInlineCommit();
  save();
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushAndSave(); });
window.addEventListener('pagehide', flushAndSave);
window.addEventListener('beforeunload', flushAndSave);
})();
</script>
