<title>Finansçım</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7FAF9;--surface:#FFFFFF;--ink:#132326;--ink-soft:#5A7378;--border:#DCE8E6;
  --accent:#0E7C86;--accent-soft:#DEF0EF;
  --debt:#B3483C;--debt-soft:#F7E9E7;
  --paid:#2F8F6F;--paid-soft:#E1F2E9;
  --pending:#B8791F;--pending-soft:#F6ECDA;
  --soon:#A8901A;--soon-soft:#FBF3CE;
  --purple:#3B6B95;--purple-soft:#E4ECF5;
  --font-display:'Fraunces',serif;--font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B1D;--surface:#16292B;--ink:#EAF3F2;--ink-soft:#8FADB0;--border:#25393C;
    --accent:#4FC3C9;--accent-soft:#1B3335;
    --debt:#E08478;--debt-soft:#2E2220;
    --paid:#6FCBA6;--paid-soft:#1B332B;
    --pending:#E0AD5F;--pending-soft:#2E2718;
    --soon:#D9C15E;--soon-soft:#332C12;
    --purple:#8CB2DE;--purple-soft:#1E2A3A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B1D;--surface:#16292B;--ink:#EAF3F2;--ink-soft:#8FADB0;--border:#25393C;
  --accent:#4FC3C9;--accent-soft:#1B3335;--debt:#E08478;--debt-soft:#2E2220;
  --paid:#6FCBA6;--paid-soft:#1B332B;--pending:#E0AD5F;--pending-soft:#2E2718;
  --soon:#D9C15E;--soon-soft:#332C12;
  --purple:#8CB2DE;--purple-soft:#1E2A3A;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;touch-action:manipulation;}
button{font-family:var(--font-body);}
.app{display:flex;height:100vh;height:100dvh;max-width:520px;margin:0 auto;position:relative;}

/* ---- Finansçım mockup kodundan birebir alınan bileşenler (header, özet grid, panel/liste, piyasa, alt bar) ---- */
.header{height:70px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:5px;padding:3px 10px;position:sticky;top:0;z-index:5;background:var(--bg);}
.brand{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;}
.brand>div:last-child{min-width:0;overflow:hidden;}
.wallet{width:32px;height:26px;border-radius:8px;background:#07526a;position:relative;flex-shrink:0;}
.wallet:after{content:"";position:absolute;right:-2px;top:8px;width:14px;height:10px;border-radius:3px;background:#09b79f;}
.wallet .leaf{position:absolute;width:13px;height:8px;left:7px;top:-6px;border-radius:10px 2px 10px 2px;background:#19bda6;transform:rotate(-25deg);}
.wallet.mini{width:19px;height:15px;border-radius:5px;}
.wallet.mini:after{right:-1px;top:4px;width:8px;height:6px;border-radius:2px;}
.wallet.mini .leaf{width:8px;height:5px;left:4px;top:-4px;}
.brand-name{font:700 16px "Brush Script MT","Segoe Script",cursive;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-sub{font-size:6.5px;color:#60759b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.title{text-align:center;min-width:0;overflow:hidden;}
.title h1{font-size:16px;margin:0 0 3px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.title p{font-size:9.5px;color:#61759b;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bell{font-size:20px;text-align:right;position:relative;background:none;border:none;cursor:pointer;padding:2px;justify-self:end;}
.badge{position:absolute;right:-4px;top:-6px;background:#ef2846;color:#fff;border-radius:50%;font-size:10px;width:18px;height:18px;display:grid;place-items:center;}
.bell.bell-active{animation:bellShake 2.6s ease-in-out infinite;}
@keyframes bellShake{
  0%,92%,100%{transform:rotate(0);}
  93%{transform:rotate(-14deg);} 94%{transform:rotate(12deg);} 95%{transform:rotate(-10deg);}
  96%{transform:rotate(8deg);} 97%{transform:rotate(-4deg);} 98%{transform:rotate(0);}
}

/* ---- Krediler sayfası (Finanscim_Krediler_Claude_Paket'ten birebir) ---- */
.kr-summary{border:1px solid #cce8f2;border-radius:14px;background:#ecfbff;display:grid;grid-template-columns:1fr 1fr;
  align-items:center;padding:6px 12px;gap:8px;margin-bottom:5px;flex-shrink:0;}
.kr-summary>div+div{border-left:1px solid #aac9d8;padding-left:18px;}
.kr-summary b{display:block;font-size:10px;font-weight:500;color:#071b6b;}
.kr-summary strong{display:block;font-size:14.5px;margin-top:0;color:#071b6b;font-family:var(--font-display);}
.kr-summary small{font-size:10px;color:#526b96;}
.kr-list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-shrink:0;}
.kr-list-head h2{font-size:16.5px;margin:0;color:var(--ink);}
.kr-list-head button{border:0;background:none;color:#49618f;font-size:11.5px;cursor:pointer;padding:4px 0;}
.kr-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.kr-card{background:var(--surface);border:1px solid #e2edf5;border-radius:14px;padding:8px;margin-bottom:6px;
  box-shadow:0 4px 14px #173b5810;cursor:pointer;}
.kr-main{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;}
.kr-bank-logo{height:38px;border-radius:10px;background:#f0f6fd;display:grid;place-items:center;font-weight:900;
  font-size:14px;color:#fff;}
.kr-main h2{margin:0;font-size:13.5px;color:var(--ink);}
.kr-main p{margin:1px 0;color:var(--ink-soft);font-size:10.5px;}
.kr-main small{color:var(--ink-soft);font-size:9px;}
.kr-status{padding:5px 8px;border-radius:10px;font-weight:800;font-size:9px;white-space:nowrap;}
.kr-status.waiting{background:#fff0dc;color:#ed851d;}
.kr-status.late{background:#ffe2e6;color:#ed2438;}
.kr-status.paid{background:var(--paid-soft);color:var(--paid);}
.kr-meta{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #e5edf4;margin-top:6px;padding-top:5px;}
.kr-meta div{padding:0 6px;border-right:1px solid #e5edf4;font-size:9px;color:var(--ink-soft);}
.kr-meta div:last-child{border:0;}
.kr-meta strong{display:block;color:var(--ink);font-size:11.5px;margin-top:1px;font-weight:600;}
.kr-meta .kr-late strong{color:var(--debt);}
.kr-add{width:100%;min-height:48px;border:1.5px dashed #68a7ef;border-radius:14px;background:#edf7ff;color:#12398e;
  display:flex;align-items:center;gap:11px;text-align:left;padding:9px 13px;margin-bottom:2px;cursor:pointer;}
.kr-add span{font-size:22px;color:#1576e8;flex-shrink:0;}
.kr-add strong{display:block;font-size:12px;}
.kr-add small{display:block;font-size:9.5px;margin-top:2px;color:#526b96;}
.kr-info{display:flex;gap:7px;background:#e9f5ff;border:1px solid #cfe4f8;border-radius:13px;padding:8px 11px;
  font-size:9.5px;line-height:1.4;color:#45628e;margin-top:8px;flex-shrink:0;}
/* ---- Fatura/Abonelik arama kutusu (liste sayfası) ---- */
.cat-search-wrap{position:relative;margin-bottom:10px;}
.cat-search-wrap .cat-search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.55;}
.cat-search-wrap input{width:100%;border:1px solid var(--border);border-radius:999px;padding:10px 12px 10px 34px;
  font-size:13px;font-family:var(--font-body);background:var(--surface);color:var(--ink);}
/* ---- Fatura/Abonelik filtre sekmeleri ---- */
.filter-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none;-ms-overflow-style:none;}
.filter-tabs::-webkit-scrollbar{display:none;}
.filter-tabs button{flex-shrink:0;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
  border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.filter-tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.kr-summary.cols3{grid-template-columns:1fr 1fr 1fr;padding:6px 8px;gap:4px;}
.kr-summary.cols3>div+div{padding-left:8px;}
.kr-summary.cols3 b{font-size:8.7px;}
.kr-summary.cols3 strong{font-size:12px;}
.kr-summary.cols4{grid-template-columns:1fr 1fr 1fr 1fr;padding:6px 6px;gap:3px;}

.choice-row button.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
#loanTypeChoice{flex-wrap:nowrap;}
#loanTypeChoice button{flex:1;justify-content:center;padding:8px 4px;text-align:center;white-space:nowrap;}
.save-btn{width:100%;padding:10px;border-radius:10px;border:none;background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}
.cancel-btn{width:100%;padding:6px;border:none;background:none;color:var(--ink-soft);font-size:13.5px;cursor:pointer;}
.back-link{display:inline-block;border:none;background:none;color:var(--accent);font-size:13.5px;font-weight:600;
  padding:0;margin-bottom:6px;cursor:pointer;}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:10px 0 6px;
  font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--ink);border-top:1px solid var(--line);padding-top:8px;}
.section-title:first-of-type{border-top:none;padding-top:0;margin-top:2px;}
.section-title small{font-size:10px;font-weight:400;color:var(--ink-soft);text-align:right;}
.icon-field{position:relative;}
.icon-field .fi{position:absolute;left:6px;top:23px;width:19px;height:19px;border-radius:6px;background:#eaf1fb;color:#3d6bb0;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;pointer-events:none;}
.icon-field input,.icon-field select{padding-left:31px !important;}
.info-box{display:flex;gap:7px;background:#eaf2ff;border-radius:12px;padding:8px 10px;margin:2px 0 8px;align-items:flex-start;}
.info-box .ib-ic{width:16px;height:16px;border-radius:50%;background:#1675ed;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px;}
.info-box b{font-size:11px;display:block;color:var(--ink);}
.info-box p{font-size:9.5px;color:var(--ink-soft);margin:1px 0 0;line-height:1.3;}
.btn-row{display:flex;gap:8px;align-items:center;}
.btn-row .cancel-btn{flex:1;border:1px solid var(--border);border-radius:10px;margin:0;padding:9px;}
.btn-row .save-btn{flex:1;margin:0;}
.danger-btn{width:100%;padding:10px;border-radius:10px;border:1px solid var(--debt);background:none;color:var(--debt);
  font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;}
.amount-fixed-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:13px;}
.amount-fixed-row .field{flex:1;margin-bottom:0;}
.fixed-toggle-mini{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:11px;flex-shrink:0;}
.fixed-toggle-mini span{font-size:9px;color:var(--ink-soft);white-space:nowrap;}
.switch{width:40px;height:22px;border-radius:12px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.switch.on .knob{left:20px;}

/* installment table */
.inst-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.inst-row:last-child{border-bottom:none;}
.row-toggle{border:none;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.row-toggle.bekliyor{background:var(--pending-soft);color:var(--pending);}
.row-toggle.odendi{background:var(--paid-soft);color:var(--paid);}
.row-toggle.gecikti{background:var(--debt-soft);color:var(--debt);}
.inst-date{font-size:13px;width:70px;flex-shrink:0;color:var(--ink-soft);}
.inst-amt{flex:1;font-size:14px;font-weight:500;font-family:var(--font-display);}

.back-link{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:0 0 12px;display:flex;align-items:center;gap:4px;}

.bank-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;}
.bank-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px;
  border-radius:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;}
.bank-chip span:last-child{font-size:11px;line-height:1.15;color:var(--ink-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.bank-chip.active{border-color:var(--accent);background:var(--accent-soft);}
.bank-chip.active span:last-child{color:var(--accent);font-weight:600;}
.bank-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:10px;font-weight:700;flex-shrink:0;}
.bank-avatar.sm{width:34px;height:34px;font-size:12px;}
.bank-avatar.sq, .cat-icon.sq{border-radius:8px;}
.item-title-row{display:flex;align-items:center;gap:8px;}

.kind-toggle{display:flex;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:14px;}
.kind-toggle button{flex:1;border:none;background:none;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--ink-soft);cursor:pointer;}
.kind-toggle button.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08);}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.cat-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;
  border-radius:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;}
.cat-chip .ic{font-size:18px;}
.cat-chip .lbl{font-size:10.5px;color:var(--ink-soft);line-height:1.2;}
.cat-chip.active{border-color:var(--accent);background:var(--accent-soft);}
.cat-chip.active .lbl{color:var(--accent);font-weight:600;}

.credit-card{display:flex;align-items:stretch;border-radius:16px;padding:0;color:#fff;position:relative;overflow:hidden;
  margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.16);min-height:140px;}
.credit-card::after{content:'';position:absolute;right:-25px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:rgba(255,255,255,.10);}
.cc-left{width:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:12px 6px;border-right:1px solid rgba(255,255,255,.32);text-align:center;position:relative;z-index:1;}
.cc-left .bank-mark{font-size:17px;font-weight:700;letter-spacing:.02em;}
.cc-left .bank-name{font-size:10.5px;opacity:.92;line-height:1.3;}
.cc-left .cc-due{font-size:9px;opacity:.78;margin-top:1px;}
.cc-right{width:70%;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:34px 16px 12px;position:relative;z-index:1;}
.cc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.cc-row .l{font-size:10.5px;opacity:.85;}
.cc-row .v{font-size:14px;font-weight:600;font-family:var(--font-display);}
.cc-row .v.editable{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.55);padding-bottom:1px;}
.cc-inline-input{width:90px;padding:2px 5px;border-radius:5px;border:none;font-size:16px;font-family:var(--font-display);
  font-weight:600;text-align:right;background:rgba(255,255,255,.92);color:#1C2127;}
.cc-status-btn{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.24);
  border:none;color:#fff;padding:5px 10px 5px 8px;border-radius:20px;cursor:pointer;z-index:2;display:flex;align-items:center;gap:3px;}
.cc-status-btn.is-paid{background:rgba(255,255,255,.92);color:#2F8F6F;}
.cc-settings-btn{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);
  border:none;color:#fff;font-size:11px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;}
.cc-interest-toggle{position:absolute;bottom:8px;right:10px;font-size:9.5px;font-weight:600;background:rgba(255,255,255,.2);
  color:#fff;border:1px solid rgba(255,255,255,.4);padding:4px 9px;border-radius:20px;cursor:pointer;z-index:2;}
.cc-interest-toggle.active{background:rgba(255,255,255,.92);color:var(--paid);border-color:transparent;}

.day-picker{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:9px 8px 7px;}
.day-picker-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 5px;}
.day-picker-head span{font-family:var(--font-display);font-size:13px;color:var(--ink);}
.day-picker-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.day-picker-weekdays span{font-size:9.5px;color:var(--ink-soft);text-align:center;font-weight:600;}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.day-cell{aspect-ratio:1;max-width:26px;width:100%;margin:0 auto;border-radius:50%;border:none;background:transparent;
  color:var(--ink);font-size:11.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font-body);}
.day-cell:hover{background:var(--accent-soft);}
.day-cell.active{background:var(--accent);color:#fff;font-weight:600;}

.wheel-picker{position:relative;display:flex;height:80px;background:var(--accent-soft);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;width:fit-content;margin:0 auto;max-width:100%;}
.wheel-col{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none;}
.wheel-col::-webkit-scrollbar{display:none;}
.wheel-item{height:28px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:12px;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body);}
.wheel-item.selected{color:var(--ink);font-weight:700;font-family:var(--font-display);font-size:14px;}
.wheel-spacer{height:26px;flex-shrink:0;}
.wheel-highlight{position:absolute;top:26px;left:0;right:0;height:28px;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);pointer-events:none;}
.cat-icon-row{display:flex;align-items:center;gap:10px;}
.cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}

@media (min-width:521px){ .app{border-left:1px solid var(--border);border-right:1px solid var(--border);} }
</style>
</head>

<script>
(function(){
'use strict';
const STORAGE_KEY = 'borcum-full-v1';
let GOLD_RATE = 6850; // Yedek (offline) değer — canlı veri çekilemezse kullanılır. fetchLiveRates() başarılı olursa güncellenir.
let FX = { USD: 48.65, EUR: 56.23 }; // Yedek (offline) değerler — canlı veri çekilemezse kullanılır.
let liveRatesUpdatedAt = null; // Canlı kurların en son ne zaman çekildiği (Date) — Piyasa/döviz gösterimlerinde kullanılabilir.

// Ücretsiz, key gerektirmeyen, CORS'a açık kur/altın verisi (jsDelivr CDN üzerinden @fawazahmed0/currency-api).
// Tek istekte hem USD/TRY hem USD/EUR (buradan EUR/TRY türetilir) alınır; ayrı istekte ons altın TRY karşılığı alınıp grama çevrilir.
async function fetchLiveRates(){
  try{
    const [usdRes, xauRes] = await Promise.all([
      fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json'),
      fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/xau.json'),
    ]);
    if(!usdRes.ok || !xauRes.ok) throw new Error('HTTP ' + usdRes.status + ' / ' + xauRes.status);
    const usdData = await usdRes.json();
    const xauData = await xauRes.json();
    const usdTry = usdData.usd && usdData.usd.try;
    const usdEur = usdData.usd && usdData.usd.eur;
    const xauTry = xauData.xau && xauData.xau.try; // 1 ons altının TL karşılığı
    if(usdTry && usdEur){
      FX = { USD: usdTry, EUR: usdTry / usdEur };
    }
    if(xauTry){
      GOLD_RATE = xauTry / 31.1034768; // ons -> gram
    }
    // Bir önceki başarılı çekimle karşılaştırıp yaklaşık bir değişim yüzdesi hesaplanır
    // (gerçek "günlük açılış/kapanış" verisi değil, son kontrolden bu yana değişimdir).
    const prev = state.marketPrev || null;
    state.marketChange = prev ? {
      usd: prev.usd ? ((FX.USD-prev.usd)/prev.usd*100) : null,
      eur: prev.eur ? ((FX.EUR-prev.eur)/prev.eur*100) : null,
      gold: prev.gold ? ((GOLD_RATE-prev.gold)/prev.gold*100) : null,
    } : null;
    state.marketPrev = { usd:FX.USD, eur:FX.EUR, gold:GOLD_RATE, at:Date.now() };
    save();
    liveRatesUpdatedAt = new Date();
    render();
  }catch(err){
    console.log('[Kur/Altın API] Canlı veri çekilemedi, yedek (offline) değerler kullanılıyor:', err && err.message);
  }
}

const KMH_LATE_MONTHLY_INTEREST_RATE = 0.0455; // Yaklaşık — BDDK aylık tavan oranı (gecikmeli kullanım).
// Banka bazlı yaklaşık faiz tablosu — BANKS listesi aşağıda tanımlandığı için ilk kullanımda (lazy) kurulur.
let _kmhBankRatesCache = null;
function kmhRateForBank(bankCode){
  if(!_kmhBankRatesCache) _kmhBankRatesCache = Object.fromEntries(BANKS.map(b=>[b.code, KMH_MONTHLY_INTEREST_RATE]));
  return _kmhBankRatesCache[bankCode] || KMH_MONTHLY_INTEREST_RATE;
}
const KMH_TAX_RATES = { bsmv: 0.15, kkdf: 0.15 }; // BSMV ve KKDF, hesaplanan NET FAİZ tutarının %15'i olarak uygulanır (doğrulanmış güncel oran).

/**
 * Bir KMH hesabının işlem geçmişine (kullanım/ödeme hareketleri) göre, verilen tarihe
 * kadar biriken GÜNLÜK bazlı faizi ve üzerine eklenen BSMV/KKDF'yi hesaplar.
 * transactions: [{date:'YYYY-MM-DD', amount:number}] — amount pozitifse kullanım (borç artışı),
 * negatifse ödeme (borç azalışı). Kronolojik sırayla, her aralıkta o andaki anaparaya göre
 * gün bazlı faiz işletilir — "toplam borç × sabit oran" gibi hatalı bir kısayol KULLANILMAZ.
 */
function calculateKmhInterest(transactions, uptoDateStr, monthlyRate){
  monthlyRate = monthlyRate==null ? KMH_MONTHLY_INTEREST_RATE : monthlyRate;
  const dailyRate = monthlyRate / 30;
  const sorted = [...(transactions||[])].sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const uptoDate = new Date(uptoDateStr+'T00:00:00');
  let principal = 0;
  let totalInterest = 0;
  let lastDate = null;
  for(const tx of sorted){
    const txDate = new Date(tx.date+'T00:00:00');
    if(txDate > uptoDate) break;
    if(lastDate){
      const days = Math.round((txDate - lastDate) / 86400000);
      if(days>0 && principal>0) totalInterest += principal * dailyRate * days;
    }
    principal += tx.amount;
    lastDate = txDate;
  }
  if(lastDate){
    const days = Math.round((uptoDate - lastDate) / 86400000);
    if(days>0 && principal>0) totalInterest += principal * dailyRate * days;
  }
  const bsmv = totalInterest * KMH_TAX_RATES.bsmv;
  const kkdf = totalInterest * KMH_TAX_RATES.kkdf;
  return {
    principal: Math.round(principal),
    interest: Math.round(totalInterest),
    bsmv: Math.round(bsmv),
    kkdf: Math.round(kkdf),
    total: Math.round(totalInterest + bsmv + kkdf),
  };
}
/** Basit senaryo hesaplayıcı: "X TL'yi Y gün kullansam ne kadar öderim?" soruları için. */
function calculateKmhScenario(amount, days, monthlyRate){
  monthlyRate = monthlyRate==null ? KMH_MONTHLY_INTEREST_RATE : monthlyRate;
  return calculateKmhInterest([{date:'2000-01-01', amount}], addDaysStr('2000-01-01', days), monthlyRate);
}
function addDaysStr(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

function bankByCode(code){ return BANKS.find(b=>b.code===code) || BANKS[BANKS.length-1]; }
// Banka logosu: mümkünse gerçek logo (Clearbit'in halka açık marka-logo servisinden, bankanın
// kurumsal alan adına göre), yüklenemezse (offline, servis erişilemez vb.) otomatik olarak
// bankanın rengi + kısaltması ile kutuya geri döner. Hiçbir zaman bozuk görsel göstermez.
function bankLogoFallback(imgEl, code){
  const b = bankByCode(code);
  const box = imgEl.parentElement;
  if(!box) return;
  box.style.background = b.color;
  box.innerHTML = '<span style="color:#fff;font-weight:900;">'+b.initials+'</span>';
}
window.bankLogoFallback = bankLogoFallback; // inline onerror="" global scope'ta çalıştığı için gerekli
function bankLogoHtml(bank, boxClass){
  if(bank.logo){
    return `<div class="${boxClass}" style="background:#fff;overflow:hidden;padding:0;">
      <img src="${bank.logo}" alt="${esc(bank.name)}" style="width:100%;height:100%;object-fit:cover;display:block;">
    </div>`;
  }
  if(!bank.domain) return `<div class="${boxClass}" style="background:${bank.color};color:#fff;">${bank.initials}</div>`;
  return `<div class="${boxClass}" style="background:#fff;">
    <img src="https://logo.clearbit.com/${bank.domain}?size=160" alt="${esc(bank.name)}"
      style="width:76%;height:76%;object-fit:contain;"
      onerror="bankLogoFallback(this,'${bank.code}')">
  </div>`;
}
// Küçük yuvarlak/kare banka rozetleri (liste satırları, banka seçim çipleri) için: gerçek logo
// varsa onu, yoksa bankanın rengi + kısaltmasıyla eski davranışa döner.
function bankAvatarHtml(bank, boxClass){
  if(bank.logo){
    return `<span class="${boxClass}" style="background:#fff;overflow:hidden;padding:0;"><img src="${bank.logo}" alt="${esc(bank.name)}" style="width:100%;height:100%;object-fit:cover;display:block;"></span>`;
  }
  return `<span class="${boxClass}" style="background:${bank.color}">${bank.initials}</span>`;
}
function billNameField(category, selectedName){
  return `<input id="f_name" value="${selectedName?esc(selectedName):''}" placeholder="Örn: ${esc(category||'Ev Elektrik')}">`;
}
function shade(hex, percent){
  const n = parseInt(hex.replace('#',''),16);
  let r=(n>>16)+Math.round(255*(percent/100)), g=(n>>8&0xff)+Math.round(255*(percent/100)), b=(n&0xff)+Math.round(255*(percent/100));
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}
function bankChipRow(id, selected){
  return `<div class="bank-grid" id="${id}" data-value="${selected||BANKS[0].code}">${BANKS.map((b,i)=>`
    <div class="bank-chip${(selected?selected===b.code:i===0)?' active':''}" data-val="${b.code}" data-action="pick-bank">
      ${bankAvatarHtml(b,'bank-avatar')}<span>${b.short}</span>
    </div>`).join('')}</div>`;
}
// Fatura/Abonelik "Kurum" seçimi — banka seçimiyle birebir aynı görsel/etkileşim düzeni.
function kurumBadgeHtml(it, boxClass){
  boxClass = (boxClass || 'bank-avatar') + ' sq';
  if(it.wordmark){
    // Küçük rozet (26px chip) için tanımlı font-size; daha büyük 36px kart ikonunda (cat-icon) ~1.3x büyütülür.
    const base = parseFloat(it.fontSize||'11px');
    const fs = boxClass.indexOf('cat-icon')>=0 ? (base*1.3).toFixed(1)+'px' : (it.fontSize||'11px');
    return `<span class="${boxClass}" style="background:${it.bg};color:${it.color};font-size:${fs};font-weight:800;font-family:var(--font-display);letter-spacing:-.02em;">${esc(it.wordmark)}</span>`;
  }
  return `<span class="${boxClass}" style="background:${it.bg};color:${it.color}">${it.icon}</span>`;
}
function kurumChipRow(id, pool, selected){
  return `<div class="bank-grid" id="${id}" data-value="${selected||pool[0].name}">${pool.map((it,i)=>`
    <div class="bank-chip${(selected?selected===it.name:i===0)?' active':''}" data-val="${esc(it.name)}" data-action="pick-bank">
      ${kurumBadgeHtml(it)}<span>${esc(it.name)}</span>
    </div>`).join('')}</div>`;
}
function wheelCol(id, items, selectedValue, width){
  let idx = items.findIndex(it=>String(it.value)===String(selectedValue));
  if(idx<0) idx = 0;
  const styleAttr = width ? ` style="width:${width}px;flex:none;"` : '';
  return `<div class="wheel-col" id="${id}" data-initial="${idx}"${styleAttr}>
    <div class="wheel-spacer"></div>
    ${items.map(it=>`<div class="wheel-item" data-val="${esc(String(it.value))}">${esc(it.label)}</div>`).join('')}
    <div class="wheel-spacer"></div>
  </div>`;
}
function dayWheel(id, selectedDay){
  const items = []; for(let d=1;d<=31;d++) items.push({value:d, label:String(d)});
  return `<div class="wheel-picker">${wheelCol(id, items, selectedDay||15, 100)}<div class="wheel-highlight"></div></div>`;
}
function loanDateWheel(idPrefix, selMonth, selDay){
  const monthItems = [];
  for(let i=-3;i<=24;i++){ const ym=addMonths(monthKey(new Date()), i); monthItems.push({value:ym, label:monthLabel(ym)}); }
  const dayItems = []; for(let d=1;d<=31;d++) dayItems.push({value:d, label:String(d)});
  return `<div class="wheel-picker">
    ${wheelCol(idPrefix+'_d', dayItems, selDay||15, 70)}
    ${wheelCol(idPrefix+'_m', monthItems, selMonth||monthKey(new Date()), 150)}
    <div class="wheel-highlight"></div>
  </div>`;
}
const MONTH_NAMES = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function fullDateWheel(idPrefix, selectedISO){
  const now = selectedISO ? new Date(selectedISO+'T00:00:00') : new Date();
  const dayItems=[]; for(let d=1;d<=31;d++) dayItems.push({value:d,label:String(d)});
  const monthItems = MONTH_NAMES.map((m,i)=>({value:i+1,label:m}));
  const curYear = new Date().getFullYear();
  const yearItems=[]; for(let y=curYear-2;y<=curYear+2;y++) yearItems.push({value:y,label:String(y)});
  return `<div class="wheel-picker">
    ${wheelCol(idPrefix+'_d', dayItems, now.getDate(), 64)}
    ${wheelCol(idPrefix+'_m', monthItems, now.getMonth()+1, 100)}
    ${wheelCol(idPrefix+'_y', yearItems, now.getFullYear(), 76)}
    <div class="wheel-highlight"></div>
  </div>`;
}
function wheelValue(id){ const el=document.getElementById(id); return el?el.dataset.value:''; }
function buildDateFromWheel(idPrefix){
  const d = parseInt(wheelValue(idPrefix+'_d'))||1;
  const m = parseInt(wheelValue(idPrefix+'_m'))||1;
  const y = parseInt(wheelValue(idPrefix+'_y'))||new Date().getFullYear();
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function initSwipeDelete(root){
  root.querySelectorAll('.notif-wrap').forEach(wrap=>{
    const row = wrap.querySelector('.notif-row');
    let startX=0, currentX=0, dragging=false;
    row.addEventListener('pointerdown', e=>{
      startX = e.clientX; dragging = true; currentX = 0;
      row.style.transition = 'none';
      row.setPointerCapture(e.pointerId);
    });
    row.addEventListener('pointermove', e=>{
      if(!dragging) return;
      currentX = e.clientX - startX;
      if(currentX < 0) row.style.transform = `translateX(${Math.max(currentX, -110)}px)`;
    });
    function finish(){
      if(!dragging) return;
      dragging = false;
      row.style.transition = 'transform .2s ease';
      if(currentX < -65){
        row.style.transform = 'translateX(-100%)';
        wrap.style.transition = 'max-height .2s ease .15s, margin .2s ease .15s, opacity .2s ease';
        wrap.style.opacity = '0';
        setTimeout(()=>{
          const key = wrap.dataset.notifKey;
          state.dismissedNotifs = state.dismissedNotifs || [];
          if(!state.dismissedNotifs.includes(key)) state.dismissedNotifs.push(key);
          save();
          updateNotifBadge();
          // Re-render the whole notifications list so an emptied section's
          // header doesn't linger behind and nothing gets left half-removed.
          if(modalCtx.kind === 'notifications'){
            $modalSheet.innerHTML = modalTemplates.notifications();
            initSwipeDelete($modalSheet);
          }
        }, 200);
      } else {
        row.style.transform = 'translateX(0)';
      }
      currentX = 0;
    }
    row.addEventListener('pointerup', finish);
    row.addEventListener('pointercancel', finish);
  });
}
function initWheelPickers(root){
  root.querySelectorAll('.wheel-col').forEach(col=>{
    const items = Array.from(col.querySelectorAll('.wheel-item'));
    const itemH = 28;
    function updateSelection(snap){
      let idx = Math.round(col.scrollTop / itemH);
      idx = Math.max(0, Math.min(items.length-1, idx));
      items.forEach((it,i)=>it.classList.toggle('selected', i===idx));
      col.dataset.value = items[idx] ? items[idx].dataset.val : '';
      if(snap) col.scrollTop = idx*itemH;
    }
    let timer;
    col.addEventListener('scroll', ()=>{
      clearTimeout(timer);
      timer = setTimeout(()=>updateSelection(true), 130);
    });
    items.forEach((it,i)=>{
      it.addEventListener('click', ()=>{ col.scrollTo({top:i*itemH, behavior:'smooth'}); });
    });
    const initIdx = parseInt(col.dataset.initial)||0;
    col.scrollTop = initIdx*itemH;
    updateSelection(false);
  });
}

  // sadece tek bir "Toplam Borç" sayısı vardı. Gerçek geçmişi bilmediğimiz için,

  // sonraki her yeni kullanım/ödeme ayrı bir işlem olarak eklenip doğru gün bazlı
  // faiz hesaplanabilecek.
  (s.kmhAccounts||[]).forEach(k=>{
    if(!Array.isArray(k.transactions)){
      k.transactions = (k.debt>0) ? [{ id:uid(), date:todayStr(), amount:k.debt }] : [];
    }
  });
  return s;
}

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function addMonths(ym, n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y, m-1+n, 1); return monthKey(d); }
function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1,1);

// ---------- LOAN LOGIC ----------
// ---------- ORTAK 3-DURUM MANTIĞI (ÖDENDİ / BEKLİYOR / GECİKTİ) ----------
// Tüm borç türleri (kredi taksiti, kart ekstresi, fatura, KMH) için TEK bir merkezi kural:
// ödenmişse ÖDENDİ; ödenmemiş ve son ödeme günü henüz gelmemişse BEKLİYOR;
// ödenmemiş ve son ödeme günü geçmişse GECİKTİ. Yeni dönem her zaman ayın 1'inde başlar
// (ym, o kaydın ait olduğu ayı — takvim ayının kendisini — temsil eder; "son ödeme gününe
// N gün kala" tarzı bir erken geçiş YOKTUR).
function currentYm(){ return monthKey(new Date()); }
function periodStatus(paid, ym, dueDay){
  if(paid) return 'odendi';
  const dueDate = new Date(...ym.split('-').map((v,idx)=>idx===1?Number(v)-1:Number(v)), dueDay||1);
  return dueDate < new Date(new Date().setHours(0,0,0,0)) ? 'gecikti' : 'bekliyor';
}
function loanInstallments(loan){
  const list = [];
  for(let i=0;i<loan.count;i++){
    const ym = addMonths(loan.startMonth, i);
    const key = loan.id+'#'+i;
    const paid = state.loanStatus[key]==='odendi';
    const status = periodStatus(paid, ym, loan.dueDay);
    list.push({ index:i, ym, amount:loan.amount, status, key });
  }
  return list;
}
function loanRemaining(loan){
  return loanInstallments(loan).filter(i=>i.status!=='odendi').reduce((s,i)=>s+i.amount,0);
}
function loanInstallmentForMonth(loan, ym){
  return loanInstallments(loan).find(i=>i.ym===ym) || null;
}

// ---------- BILL LOGIC ----------
function prevMonthOverride(bill, ym){
  let cursor = ym;
  for(let i=0;i<12;i++){
    cursor = addMonths(cursor, -1);
    const ov = state.billOverrides[bill.id] && state.billOverrides[bill.id][cursor];
    if(ov) return ov;
  }
  return null;
}
function billRecord(bill, ym){
  const ov = state.billOverrides[bill.id] && state.billOverrides[bill.id][ym];
  if(ov) return { amount: ov.amount, status: periodStatus(ov.status==='odendi', ym, bill.dueDay), isEstimate:false, estimateType:null };
  const prev = prevMonthOverride(bill, ym);
  if(prev){
    return { amount: prev.amount, status: periodStatus(false, ym, bill.dueDay), isEstimate:true, estimateType: bill.isFixed?'sabit · geçen ayla aynı':'tahmini · geçen aya göre' };
  }
  return { amount: bill.estimatedAmount||0, status: periodStatus(false, ym, bill.dueDay), isEstimate:true, estimateType:'tahmini' };
}
function setBillRecord(billId, ym, amount, status){
  if(!state.billOverrides[billId]) state.billOverrides[billId]={};
  state.billOverrides[billId][ym] = { amount, status };
  save();
}

// ---------- CARD LOGIC ----------
function cardStatement(cardId, ym){
  return state.cardStatements.find(s=>s.cardId===cardId && s.ym===ym) || null;
}

// ---------- DEBT TL VALUE ----------
function debtTL(d){
  if(d.debtType==='TL') return d.amount;
  if(d.debtType==='Altin') return d.amount * (GOLD_UNITS[d.unit]||1) * GOLD_RATE;
  if(d.debtType==='Doviz') return d.amount * (FX[d.unit]||1);
  return 0;
}
function debtDisplay(d){
  if(d.debtType==='TL') return formatTL(d.amount);
  if(d.debtType==='Altin') return d.amount+' '+(GOLD_LABELS[d.unit]||d.unit);
  if(d.debtType==='Doviz') return d.amount.toLocaleString('tr-TR')+' '+d.unit;
  return '';
}

// ---------- AGGREGATES ----------
function totalDebt(){
  // Kalan Toplam Borç: krediler + kartlar + elden borçlar (döviz/altın dahil). Faturalar burada YOK —
  // faturaların "kalan toplam bakiyesi" kavramı yok, sadece aylık gider oldukları için Aylık Borç'a girerler.
  const loans = state.loans.reduce((s,l)=>s+loanRemaining(l),0);
  const cards = state.cards.reduce((s,c)=>s+(c.totalDebt||0),0);
  const kmh = state.kmhAccounts.reduce((s,k)=>s+(k.debt||0),0);
  const bills = state.bills.reduce((s,b)=>{
    if(b.autoPay) return s;
    const r = billRecord(b, state.selectedMonth);
    return s + (r.status!=='odendi' ? r.amount : 0);
  },0);
  const debts = state.debts.filter(d=>!d.paid && d.direction==='borcum').reduce((s,d)=>s+debtTL(d),0);
  return { loans, cards, kmh, bills, debts, total: loans+cards+kmh+debts };
}
function monthlyDue(ym){
  // Aylık Borç: seçilen ay içinde ödenmesi gereken toplam tutar (kredi taksiti, kart bu ayki tutarı,
  // faturalar, elden borçlar, manuel ödemeler) — henüz ödenmemiş olanların toplamı.
  return monthlyRows(ym).filter(r=>r.status!=='odendi').reduce((s,r)=>s+r.amount,0);
}
function monthlyRows(ym){
  const rows = [];
  state.loans.forEach(l=>{
    const inst = loanInstallmentForMonth(l, ym);
    if(inst) rows.push({ kind:'loan', refId:l.id, key:inst.key, day:l.dueDay||1, name:l.name, cat:'kredi',
      amount:inst.amount, status:inst.status });
  });
  state.bills.forEach(b=>{
    if(b.autoPay) return;
    const r = billRecord(b, ym);
    rows.push({ kind:'bill', refId:b.id, key:b.id+'#'+ym, day:b.dueDay||1, name:b.name, cat:'fatura',
      amount:r.amount, status:r.status, isEstimate:r.isEstimate });
  });
  state.cards.forEach(c=>{
    const st = cardStatement(c.id, ym);
    if(st) rows.push({ kind:'card', refId:c.id, key:st.id, day:c.dueDay||1, name:bankByCode(c.bankCode).name+' Kartı', cat:'kart',
      amount:st.amount, status:st.status });
  });
  state.manualPayments.filter(p=>p.ym===ym).forEach(p=>{
    rows.push({ kind:'manual', refId:p.id, key:p.id, day:new Date(p.date).getDate(), name:p.description, cat:p.category||'elden',
      amount:p.amount, status:p.status });
  });
  state.debts.filter(d=>!d.paid && d.direction==='borcum').forEach(d=>{
    rows.push({ kind:'debt', refId:d.id, key:d.id, day:d.date?new Date(d.date).getDate():1, name:d.person, cat:'elden',
      amount:debtTL(d), status:'bekliyor' });
  });
  state.kmhAccounts.forEach(k=>{
    // Aylık Borç'a KMH'nin yalnızca bu dönem ödenmesi planlanan tutarı (Ödenecek Borç) dahil
    // edilir — toplam revolving bakiyenin tamamı değil. Ödenecek Borç ödenip sıfırlanınca satır
    // tamamen kalkar, böylece Toplam Borç ile Aylık Borç aynı tutarı iki kez saymaz.
    const amt = k.plannedPayment||0;
    if(amt>0){
      rows.push({ kind:'kmh', refId:k.id, key:k.id+'#'+ym, day:k.dueDay||1, name:bankByCode(k.bankCode).name+' KMH', cat:'kmh',
        amount:amt, status: periodStatus(false, ym, k.dueDay) });
    }
  });
  rows.sort((a,b)=>a.day-b.day);
  return rows;
}

// ---------- NOTIFICATIONS ----------
function getNotifications(){
  const today = new Date(); today.setHours(0,0,0,0);
  const overdue=[], dueToday=[], soon=[];
  const dismissed = state.dismissedNotifs||[];
  function bucket(key, name, amount, dueDate){
    if(dismissed.includes(key)) return;
    const days = Math.round((dueDate-today)/86400000);
    const item = { key, name, amount, days };
    if(days<0) overdue.push(item);
    else if(days===0) dueToday.push(item);
    else if(days<=5) soon.push(item);
  }
  state.loans.forEach(l=>{
    const insts = loanInstallments(l);
    const next = insts.find(i=>i.status!=='odendi');
    if(next){
      const [y,m] = next.ym.split('-').map(Number);
      bucket('loan-'+next.key, l.name, next.amount, new Date(y, m-1, l.dueDay||1));
    }
  });
  state.cards.forEach(c=>{
    const st = cardStatement(c.id, state.selectedMonth);
    if(st && st.status!=='odendi'){
      const [y,m] = state.selectedMonth.split('-').map(Number);
      bucket('card-'+st.id, bankByCode(c.bankCode).name+' Kartı', st.amount, new Date(y, m-1, c.dueDay||1));
    }
  });
  state.bills.forEach(b=>{
    if(b.autoPay) return;
    const r = billRecord(b, state.selectedMonth);
    if(r.status!=='odendi'){
      const [y,m] = state.selectedMonth.split('-').map(Number);
      bucket('bill-'+b.id+'-'+state.selectedMonth, b.name, r.amount, new Date(y, m-1, b.dueDay||1));
    }
  });
  return { overdue, dueToday, soon };
}
function updateNotifBadge(){
  const n = getNotifications();
  const count = n.overdue.length + n.dueToday.length + n.soon.length;
  const badge = document.getElementById('notifBadge');
  const bell = document.getElementById('notifBell');
  if(!badge) return;
  if(count>0){ badge.textContent = count>9?'9+':count; badge.style.display='flex'; if(bell) bell.classList.add('bell-active'); }
  else { badge.style.display='none'; if(bell) bell.classList.remove('bell-active'); }
}

function initLongPress(container){
  container.querySelectorAll('[data-lp-type]').forEach(el=>{
    let timer=null, moved=false, startX=0, startY=0, fired=false;
    function start(x,y){
      moved=false; fired=false; startX=x; startY=y;
      timer=setTimeout(()=>{
        if(!moved){
          fired=true;
          if(window.getSelection) window.getSelection().removeAllRanges();
          if(navigator.vibrate) navigator.vibrate(12);
          openModal('itemActions', el.dataset.lpType+'|'+el.dataset.lpId);
        }
      }, 480);
    }
    function move(x,y){ if(Math.abs(x-startX)>10 || Math.abs(y-startY)>10){ moved=true; clearTimeout(timer); } }
    function cancel(){ clearTimeout(timer); }
    el.addEventListener('pointerdown', e=>start(e.clientX,e.clientY));
    el.addEventListener('pointermove', e=>move(e.clientX,e.clientY));
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointerleave', cancel);
    el.addEventListener('contextmenu', e=>e.preventDefault());
  });
}

function marketChangeHtml(pct){
  if(pct==null || isNaN(pct)) return '<div class="mup" style="color:var(--ink-soft);">—</div>';
  const up = pct>=0;
  return `<div class="${up?'mup':'mdown'}">${up?'↑':'↓'} %${Math.abs(pct).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>`;
}
function renderMarketSection(){
  const chg = state.marketChange || {};
  const updLabel = liveRatesUpdatedAt
    ? liveRatesUpdatedAt.toLocaleDateString('tr-TR',{day:'numeric',month:'long'}) + ' · ' + liveRatesUpdatedAt.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})
    : 'yaklaşık (canlı veri alınamadı)';
  return `
    <div class="panel">
      <div class="head"><h2>Piyasa</h2><span>Son güncelleme: ${updLabel}<button class="refresh-btn" data-action="refresh-market" title="Yenile">↻</button></span></div>

// ---------- LOANS ----------
function formatDMY(ym, day){
  const [y,m] = ym.split('-');
  return String(day).padStart(2,'0')+'.'+m+'.'+y;
}
function renderLoans(){
  $fab.style.display='none';
  const addBtn = `<button class="kr-add" data-action="open-modal" data-modal="addLoan">
      <span>＋</span>
      <div><strong>Yeni Kredi Eklemek İçin Dokunun</strong><small>Farklı bankalardaki kredilerinizi buradan ekleyebilirsiniz.</small></div>
    </button>`;
  if(state.loans.length===0) return addBtn;
  const loansTotalRemaining = state.loans.reduce((s,l)=> s + loanRemaining(l), 0);
  const loansMonthlyDue = state.loans.reduce((s,l)=>{
    const inst = loanInstallmentForMonth(l, state.selectedMonth);
    return s + (inst && inst.status!=='odendi' ? inst.amount : 0);
  }, 0);
  const summary = `
    <div class="kr-summary">
      <div><b>Toplam Kredi Borcu</b><strong>${formatTL(loansTotalRemaining)}</strong></div>
      <div><b>Bu Ay Ödenecek</b><strong>${formatTL(loansMonthlyDue)}</strong></div>
    </div>`;
  const loansSorted = state.loans.slice().sort((a,b)=>{
    if(ui.loanSort==='amount') return loanRemaining(b) - loanRemaining(a);
    const na = loanInstallments(a).find(i=>i.status!=='odendi');
    const nb = loanInstallments(b).find(i=>i.status!=='odendi');
    const da = na ? na.ym+String(a.dueDay).padStart(2,'0') : '9999';
    const db = nb ? nb.ym+String(b.dueDay).padStart(2,'0') : '9999';
    return da.localeCompare(db);
  });
  const listHead = `
    <div class="kr-list-head">
      <h2>Kredi Listesi</h2>
      <button data-action="toggle-loan-sort">☷ ${ui.loanSort==='amount' ? 'Tutara Göre' : 'Ödeme Tarihine Göre'} ⌄</button>
    </div>`;
  const cards = loansSorted.map(l=>{
      const insts = loanInstallments(l);
      const nextUnpaid = insts.find(i=>i.status!=='odendi');
      const dueStr = nextUnpaid ? formatDMY(nextUnpaid.ym, l.dueDay) : '-';
      const bank = bankByCode(l.bankCode);
      // Durum kutusu her zaman SEÇİLİ AYIN (Aylık sayfadaki ile aynı, tek kaynaktan) taksitini
      // yansıtır — "sıradaki ödenmemiş taksit"i değil. Böylece Eylül ödendiğinde, henüz Ekim
      // gelmediyse kart hâlâ ÖDENDİ gösterir; yeni ay geldiğinde kendi taksitine göre güncellenir.
      const thisMonthInst = loanInstallmentForMonth(l, state.selectedMonth);
      let statusKey, statusCls, pillLabel;
      if(!thisMonthInst){ statusKey='odendi'; statusCls='paid'; pillLabel = '&nbsp;'; }
      else if(thisMonthInst.status==='odendi'){ statusKey='odendi'; statusCls='paid'; pillLabel = 'ÖDENDİ'; }
      else { statusKey = thisMonthInst.status; statusCls = statusKey==='gecikti'?'late':'waiting'; pillLabel = statusKey==='gecikti' ? '! GECİKTİ' : '◷ BEKLİYOR'; }
      return `<article class="kr-card" data-action="nav" data-page="loanDetail" data-id="${l.id}" data-lp-type="loan" data-lp-id="${l.id}" style="background:${bank.color}17;">
        <div class="kr-main">
          ${bankLogoHtml(bank, 'kr-bank-logo')}
          <div><h2>${bank.name}</h2><p>${esc(l.loanType||l.name)}</p>${(l.name && l.name!==l.loanType) ? `<small>${esc(l.name)}</small>` : ''}</div>
          <span class="kr-status ${statusCls}">${pillLabel}</span>
        </div>
        <div class="kr-meta">
          <div>Kalan Borç<strong>${formatTL(loanRemaining(l))}</strong></div>
          <div>Aylık Ödeme<strong>${formatTL(l.amount)}</strong></div>
          <div class="${statusKey==='gecikti'?'kr-late':''}">Son Ödeme<strong>${dueStr}</strong></div>
        </div>
      </article>`;
    }).join('');
  return `
    ${summary}
    ${listHead}
    <div class="kr-scroll">
      ${cards}
      ${addBtn}
    </div>
    <div class="kr-info">ⓘ <span>Kayda dokunarak detayları görüntüleyin.<br>Uzun basarak <b>Düzenle</b> veya <b>Sil</b> seçeneklerini açın.</span></div>
  `;
}

function renderLoanDetail(){
  const l = state.loans.find(x=>x.id===ui.loanDetailId);
  if(!l) return '<div class="empty">Kredi bulunamadı.</div>';
  const insts = loanInstallments(l);
  const bank = bankByCode(l.bankCode);
  return `
    <button class="back-link" data-action="nav" data-page="loans">‹ Krediler</button>
    <div class="item-card" style="cursor:default;">
      <div class="item-title-row" style="margin-bottom:10px;">
        ${bankAvatarHtml(bank,'bank-avatar sm')}
        <div><p class="item-title" style="font-size:16px;">${esc(l.name)}</p><p class="item-sub">${bank.name}${l.loanType?' · '+esc(l.loanType):''}</p></div>
      </div>
      <div class="summary-grid">
        <div class="summary-cell"><div class="l">Aylık Taksit</div><div class="v">${formatTL(l.amount)}</div></div>
        <div class="summary-cell"><div class="l">Kalan Taksit</div><div class="v">${insts.filter(i=>i.status!=='odendi').length} / ${l.count}</div></div>
        ${l.infoInterestRate!=null ? `<div class="summary-cell"><div class="l">Faiz Oranı (bilgi)</div><div class="v">%${String(l.infoInterestRate).replace('.',',')}</div></div>` : ''}
      </div>
    </div>
    <div class="section-title">Taksit Planı (otomatik oluşturuldu)</div>
    <div class="card-wrap" style="padding:0 12px;">
      ${insts.map(i=>`
        <div class="inst-row" data-action="toggle-installment" data-loan="${l.id}" data-idx="${i.index}">
          <span class="inst-date">${monthLabel(i.ym)}</span>
          <span class="inst-amt">${formatTL(i.amount)}</span>
          <span class="pill ${i.status}">${i.status}</span>
        </div>`).join('')}
    </div>
    <button class="danger-btn" data-action="delete-loan" data-id="${l.id}">Krediyi Sil</button>
  `;
}

// ---------- CARDS ----------
function renderCards(){
  $fab.style.display='none';
  const addBtn = `<button class="kr-add" data-action="open-modal" data-modal="addCard">
      <span>＋</span>
      <div><strong>Yeni Kart Eklemek İçin Dokunun</strong><small>Farklı bankalardaki kredi kartlarınızı buradan ekleyebilirsiniz.</small></div>
    </button>`;
  if(state.cards.length===0) return addBtn;
  const totalDebt = state.cards.reduce((s,c)=>s+(c.totalDebt||0),0);
  const totalLimit = state.cards.reduce((s,c)=>s+(c.limit||0),0);
  const monthlyDue = state.cards.reduce((s,c)=>{
    const st = cardStatement(c.id, state.selectedMonth);
    return s + (st && st.status!=='odendi' ? (st.amount||0) : 0);
  }, 0);
  const summary = `
    <div class="kr-summary cols3">
      <div><b>Toplam Kart Borcu</b><strong>${formatTL(totalDebt)}</strong></div>
      <div><b>Bu Ay Ödenecek</b><strong>${formatTL(monthlyDue)}</strong></div>
      <div><b>Kullanılabilir Limit</b><strong>${formatTL(totalLimit-totalDebt)}</strong></div>
    </div>`;
  const listHead = `
    <div class="kr-list-head">
      <h2>Kart Listesi</h2>
    </div>`;
  const cards = state.cards.map(c=>{
      const st = cardStatement(c.id, state.selectedMonth);
      const bank = bankByCode(c.bankCode);
      const debt = c.totalDebt||0;
      const remainingLimit = (c.limit||0) - debt;
      // Kredi kartında her ay borç olmak zorunda değildir: bu ay için hiç ödenecek bir tutar
      // (statement) yoksa kutu tamamen BOŞ kalır — ÖDENDİ/BEKLİYOR/GECİKTİ yazılmaz. Sadece bu ay
      // gerçekten ödenecek bir miktar VARSA durum hesaplanır.
      const hasCharge = !!(st && (st.amount||0) > 0);
      const paid = !!(st && st.status==='odendi');
      const statusKey = hasCharge ? periodStatus(paid, state.selectedMonth, c.dueDay) : 'odendi';
      const statusCls = statusKey==='odendi' ? 'paid' : (statusKey==='gecikti' ? 'late' : 'waiting');
      const pillLabel = !hasCharge ? '&nbsp;' : (statusKey==='odendi' ? 'ÖDENDİ' : (statusKey==='gecikti' ? '! GECİKTİ' : '◷ BEKLİYOR'));
      return `<article class="kr-card" data-action="open-modal" data-modal="cardStatement" data-id="${c.id}" data-lp-type="card" data-lp-id="${c.id}" style="background:${bank.color}17;">
        <div class="kr-main">
          ${bankLogoHtml(bank, 'kr-bank-logo')}
          <div><div class="kr-title-row"><h2>${bank.name}</h2><span class="kr-duedate">Son Ödeme: ${c.dueDay||'-'}'i</span></div><p>${c.name?esc(c.name):'Kredi Kartı'}</p></div>
          <span class="kr-status ${statusCls}">${pillLabel}</span>
        </div>
        <div class="kr-meta cols4">
          <div>Kart Limiti<strong>${formatTL(c.limit||0)}</strong></div>
          <div>Güncel Borç<strong>${formatTL(debt)}</strong></div>
          <div>Bu Ay Ödenecek<strong>${st?formatTL(st.amount):'—'}</strong></div>

// ---------- KMH (Kredili Mevduat Hesabı) ----------
function renderKmh(){
  $fab.style.display='none';
  const addBtn = `<button class="kr-add" data-action="open-modal" data-modal="addKmh">
      <span>＋</span>
      <div><strong>Yeni KMH Hesabı Eklemek İçin Dokunun</strong><small>Farklı bankalardaki KMH hesaplarınızı buradan ekleyebilirsiniz.</small></div>
    </button>`;
  if(state.kmhAccounts.length===0) return addBtn;
  const totalLimit = state.kmhAccounts.reduce((s,k)=>s+(k.limit||0),0);
  const totalDebt = state.kmhAccounts.reduce((s,k)=>s+(k.debt||0),0);
  const totalEstInterest = state.kmhAccounts.reduce((s,k)=>{
    const rate = k.customMonthlyRate!=null ? k.customMonthlyRate : kmhRateForBank(k.bankCode);
    return s + calculateKmhInterest(k.transactions||[], todayStr(), rate).total;
  },0);
  const summary = `
    <div class="kr-summary cols4">
      <div><b>Toplam KMH Limiti</b><strong>${formatTL(totalLimit)}</strong></div>
      <div><b>Toplam Kullanım</b><strong>${formatTL(totalDebt)}</strong></div>
      <div><b>Tah. Toplam Faiz</b><strong>${formatTL(totalEstInterest)}</strong></div>
      <div><b>Kalan Limit</b><strong>${formatTL(totalLimit-totalDebt)}</strong></div>
    </div>`;
  const listHead = `
    <div class="kr-list-head">
      <h2>KMH Hesapları</h2>
    </div>`;
  const cards = state.kmhAccounts.map(k=>{
      const bank = bankByCode(k.bankCode);
      const debt = k.debt||0;
      const planned = k.plannedPayment||0;
      const remainingLimit = (k.limit||0) - debt;
      // Bu dönem ödenecek bir tutar (Ödenecek Miktar) ayrılmamışsa kutu tamamen BOŞ kalır — Güncel
      // Kullanım'da bakiye kalmış olsa bile henüz "bu ay ödenecek" bir şey yoktur. Sadece Ödenecek
      // Miktar > 0 iken durum (BEKLİYOR/GECİKTİ) hesaplanır.
      const hasCharge = planned > 0;
      const statusKey = hasCharge ? periodStatus(false, currentYm(), k.dueDay) : 'odendi';
      const statusCls = statusKey==='odendi' ? 'paid' : (statusKey==='gecikti' ? 'late' : 'waiting');
      const pillLabel = !hasCharge ? '&nbsp;' : (statusKey==='odendi' ? 'ÖDENDİ' : (statusKey==='gecikti' ? '! GECİKTİ' : '◷ BEKLİYOR'));
      const bankRate = k.customMonthlyRate!=null ? k.customMonthlyRate : kmhRateForBank(k.bankCode);
      const dailyInterest = Math.round(debt * (bankRate/30) * (1 + KMH_TAX_RATES.bsmv + KMH_TAX_RATES.kkdf));
      const estTotal = calculateKmhInterest(k.transactions||[], todayStr(), bankRate);
      const dueDateStr = k.dueDay ? formatDMY(currentYm(), k.dueDay) : '—';
      return `<article class="kr-card" data-action="open-modal" data-modal="kmhSettings" data-id="${k.id}" data-lp-type="kmh" data-lp-id="${k.id}" style="background:${bank.color}17;">
        <div class="kr-main">
          ${bankLogoHtml(bank, 'kr-bank-logo')}
          <div><div class="kr-title-row"><h2>${bank.name}</h2><span class="kr-duedate">Son Ödeme: ${k.dueDay||'-'}'i</span></div><p>KMH Hesabı</p></div>
          <span class="kr-status ${statusCls}">${pillLabel}</span>
        </div>
        <div class="kr-meta cols4">
          <div>Tanımlı Limit<strong>${formatTL(k.limit||0)}</strong></div>
          <div>Güncel Kullanım<strong>${formatTL(debt)}</strong></div>
          <div>Ödenecek Miktar<strong>${formatTL(planned)}</strong></div>
          <div>Kalan Limit<strong>${formatTL(remainingLimit)}</strong></div>
        </div>
        <div class="kr-meta cols4" style="margin-top:4px;">
          <div>Banka Faiz Oranı<strong>~%${(bankRate*100).toLocaleString('tr-TR',{maximumFractionDigits:2})}</strong></div>
          <div>Gün. Tah. Faiz<strong>${formatTL(dailyInterest)}</strong></div>
          <div>Top. Tah. Faiz<strong>${formatTL(estTotal.total)}</strong></div>
          <div>Son Ödeme<strong>${dueDateStr}</strong></div>
        </div>
      </article>`;
    }).join('');
  return `
    ${summary}
    ${listHead}
    <div class="kr-scroll">
      ${cards}
      ${addBtn}
    </div>
    <div class="kr-info">ⓘ <span>Faiz oranı ve tutarlar yaklaşıktır (BDDK tavan oranı esas alınır).<br>Uzun basarak <b>Düzenle</b> veya <b>Sil</b> seçeneklerini açın.</span></div>
  `;
}

function renderBills(){

    </button>`;

  const toplamTutar = recs.reduce((s,x)=>s+(x.r.amount||0),0);

    const kind = b.kind || 'bill';

    if(filter==='variable' && b.isFixed) return false;
    if(search){
      const hay = ((b.name||'')+' '+(b.category||'')).toLocaleLowerCase('tr-TR');

          <div class="cat-icon-row">
            ${kurumBadgeHtml(ic, 'cat-icon')}
            <div><p class="item-title">${esc(b.name)}</p><p class="item-sub">${esc(b.category)} · ${b.kind==='subscription'?'Abonelik':'Fatura'}</p></div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="record-status-pill ${statusKey}">${pillLabel}</span>
            <span class="record-chevron">›</span>
          </div>
        </div>
        <div class="item-meta-row">
          <span>${r.amount>0?formatTL(r.amount):'Tutar bekleniyor'}</span>
          <span>Son ödeme: her ayın ${b.dueDay}'i</span>

        <div class="item-meta-row" style="justify-content:space-between;align-items:center;">

        </div>
        <div class="item-meta-row" style="justify-content:space-between;align-items:center;">

        </div>

  return `

      <div class="summary-cell"><div class="l">Aylık Toplam Tutar</div><div class="v">${formatTL(toplamTutar)}</div></div>

}

document.getElementById('navHomeBtn').addEventListener('click', ()=> navigate('home'));
document.getElementById('navAiBtn').addEventListener('click', ()=> navigate('ai'));
