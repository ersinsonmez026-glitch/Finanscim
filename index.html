// İstek en az 15 saniye yanıt bekler (zaman aşımı) — bu süre dolmadan "modele ulaşılamadı" gibi
// erken bir hata gösterilmez; yanıt gerçekten hiç gelmezse AbortController isteği keser ve
// kullanıcıya net bir "zaman aşımı" mesajı gösterilir.
const AI_REQUEST_TIMEOUT_MS = 20000;

async function geminiRequest(url, key, body){
  let resp;
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), AI_REQUEST_TIMEOUT_MS);
  try{
    resp = await fetch(url + '?key=' + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
  }catch(networkErr){
    if(networkErr && networkErr.name === 'AbortError'){
      const e = new Error('Yapay zekadan yanıt gelmedi (zaman aşımı). Lütfen tekrar dener misin?');
      e.kind = 'timeout';
      throw e;
    }
    const e = new Error('Yapay zekaya bağlanılamadı. İnternet bağlantını kontrol edip tekrar dener misin?');
    e.kind = 'network';
    throw e;
  }finally{
    clearTimeout(timeoutId);
  }
  if(!resp.ok){
    let detail = '';
    try{ detail = await resp.text(); }catch(_e){}
    // Hangi HTTP kodunun (400/404/429/vb.) ve hangi gerçek Google hata metninin döndüğü, kullanıcıya
    // gösterilen sadeleştirilmiş Türkçe mesajdan bağımsız olarak, HER ZAMAN konsola tam olarak yazılır
    // — böylece tarayıcının geliştirici konsolundan sorunun gerçek kaynağı kesin olarak görülebilir.
    console.log('[Gemini API] İstek başarısız — URL:', url, '| HTTP durum kodu:', resp.status, resp.statusText);
    console.log('[Gemini API] Ham hata yanıtı:', detail || '(gövde boş)');
    const e = new Error('http_'+resp.status);
    e.status = resp.status;
    e.detail = detail;
    throw e;
  }
  let data;
  try{ data = await resp.json(); }
  catch(e2){ const e = new Error('Yapay zekadan beklenmeyen bir cevap geldi, lütfen tekrar dener misin?'); e.kind='parse'; throw e; }
  const candidate = data.candidates && data.candidates[0];
  const parts = candidate && candidate.content && candidate.content.parts;
  if(!parts || !parts.length){
    const e = new Error('Yapay zekadan boş bir cevap geldi, lütfen tekrar dener misin?');
    e.kind = 'empty';
    throw e;
  }
  return parts;
}

// Gemini'nin fonksiyon çağırma şeması, parametresi OLMAYAN bir fonksiyon için "parameters"
// alanının hiç GÖNDERİLMEMESİNİ bekler — boş bir "properties:{}" nesnesi göndermek isteği
// tamamen geçersiz kılıp 400 Bad Request ile reddedilmesine yol açabiliyor (ve tek bir bozuk
// araç tanımı, tools listesindeki TÜM 28 aracı birden geçersiz kılıyor — bu yüzden basit sorular
// da dahil HER istek başarısız oluyordu). Gönderim öncesi bu alanı burada temizliyoruz.
function sanitizeToolDeclarations(tools){
  return tools.map(t=>{
    const params = t.parameters;
    if(params && params.properties && Object.keys(params.properties).length===0){
      const { parameters, ...rest } = t;
      return rest;
    }
    return t;
  });
}

// Kullanıcının açık isteği üzerine: HİÇBİR otomatik tekrar deneme (auto-retry/loop) YOK.
// "Gönder" butonuna bir kez basıldığında Gemini'ye TAM OLARAK 1 istek gider; hata (400/404/429/
// ağ hatası, ne olursa olsun) hemen kullanıcıya anlaşılır bir Türkçe mesajla bildirilir ve
// uygulama kendi kendine yeniden denemez. Kullanıcı isterse "Gönder"e tekrar basarak yeni bir
// istek başlatabilir — bu da yine tek seferlik bir istektir.
async function callGemini(contents, thinkingLevel){
  const key = getORKey();
  if(!key) throw new Error('API anahtarı ayarlanmamış. Lütfen önce 🤖 simgesinden anahtarını gir.');
  const body = {
    systemInstruction: { parts:[{ text: buildAiSystemPrompt() }] },
    contents,
    tools: [{ functionDeclarations: sanitizeToolDeclarations(AI_READ_TOOLS.concat(AI_ACTION_TOOLS)) }],
  };
  // generationConfig, sadece geçerli/desteklenen bir değer üretildiğinde eklenir — geçersiz veya
  // boş bir alanın isteğe hiç girmemesi, "Unknown name" tipi 400 hatalarının önüne geçer.
  const genConfig = buildGenerationConfig(thinkingLevel);
  if(genConfig) body.generationConfig = genConfig;
  try{
    return await geminiRequest(geminiUrlFor(AI_MODEL), key, body);
  }catch(err){
    if(err.kind==='network' || err.kind==='parse' || err.kind==='empty' || err.kind==='timeout') throw err;
    if(err.status===401 || err.status===403) throw new Error('API anahtarı geçersiz görünüyor. 🤖 simgesinden anahtarını kontrol et.');
    if(err.status===400) throw new Error('Yapay zeka isteği geçersiz görünüyor. Lütfen tekrar dener misin?');
    if(err.status===404) throw new Error('Yapay zeka modeline ulaşılamadı. Lütfen daha sonra tekrar dener misin?');
    if(err.status===429){
      const e = new Error('Çok hızlı mesaj gönderdiniz, lütfen 10 saniye bekleyin.');
      e.kind = 'rate_limit';
      throw e;
    }
    throw new Error('Yapay zeka şu anda cevap veremedi, lütfen tekrar dener misin?');
  }
}

// Basit sezgisel kural: günlük/basit komutlar için düşük, karmaşık analiz/özet istekleri için
// orta düşünme seviyesi — hız için gereksiz yere yüksek seviye kullanılmaz.
function pickThinkingLevel(text){
  const q = (text||'').toLocaleLowerCase('tr');
  const complexHints = ['analiz','özet','karşılaştır','tahmin','plan','strateji','rapor','öner','değerlendir'];
  return complexHints.some(h=>q.includes(h)) ? 'medium' : 'low';
}

function findBank(nameFragment){
  const q = (nameFragment||'').toLocaleLowerCase('tr');
  if(!q) return bankByCode('diger');
  return BANKS.find(b=>b.name.toLocaleLowerCase('tr').includes(q) || b.short.toLocaleLowerCase('tr').includes(q) || q.includes(b.short.toLocaleLowerCase('tr'))) || bankByCode('diger');
}
function findLoanByName(name){
  const q = (name||'').toLocaleLowerCase('tr');
  return state.loans.find(l=>l.name.toLocaleLowerCase('tr').includes(q) || bankByCode(l.bankCode).name.toLocaleLowerCase('tr').includes(q));
}
function findCardByBank(name){
  const bank = findBank(name);
  const match = state.cards.find(c=>c.bankCode===bank.code);
  if(match) return match;
  if((!name || bank.code==='diger') && state.cards.length===1) return state.cards[0];
  return null;
}
function findKmhByBank(name){
  const bank = findBank(name);
  const match = state.kmhAccounts.find(k=>k.bankCode===bank.code);
  if(match) return match;
  if((!name || bank.code==='diger') && state.kmhAccounts.length===1) return state.kmhAccounts[0];
  return null;
}
function findBillByName(name){
  const q = (name||'').toLocaleLowerCase('tr');
  return state.bills.find(b=>b.name.toLocaleLowerCase('tr').includes(q) || b.category.toLocaleLowerCase('tr').includes(q));
}
function findDebtByPerson(name){
  const q = (name||'').toLocaleLowerCase('tr');
  return state.debts.find(d=>d.person.toLocaleLowerCase('tr').includes(q));
}

// Bu fonksiyon SADECE kullanıcı ONAYLA butonuna bastığında çağrılır — hiçbir zaman
// yapay zeka cevabı geldiği anda otomatik çalıştırılmaz.
function executeAiAction(cmd){
  if(!cmd || !cmd.action) return 'Anlayamadım, tekrar dener misin?';
  const p = cmd.params || cmd;
  switch(cmd.action){
    case 'addLoan': {
      const bank = findBank(p.bankName);
      const amount = Number(p.amount)||0, count = Number(p.count)||0;
      if(!amount||!count) return 'Tutar ve taksit sayısını anlayamadım.';
      state.loans.push({ id:uid(), bankCode:bank.code, loanType:p.loanType||'İhtiyaç Kredisi', name:p.loanType||'Kredi', amount, count, total:amount*count, startMonth:monthKey(new Date()), dueDay:15 });
      save(); render();
      return `${bank.name} için aylık ${formatTL(amount)}, ${count} taksitli kredi eklendi.`;
    }
    case 'markLoanPaid': {
      const loan = findLoanByName(p.loanName);
      if(!loan) return 'Bu isimde bir kredi bulamadım.';
      const next = loanInstallments(loan).find(i=>i.status!=='odendi');
      if(!next) return 'Bu kredinin tüm taksitleri zaten ödenmiş.';
      state.loanStatus[next.key] = 'odendi';
      save(); render();
      return `${loan.name} kredisinin bir sonraki taksiti ödendi olarak işaretlendi.`;
    }
    case 'addCard': {
      const bank = findBank(p.bankName);
      const limit = Number(p.limit)||0;
      if(!limit) return 'Kart limitini anlayamadım.';
      state.cards.push({ id:uid(), bankCode:bank.code, limit, dueDay:15, totalDebt:0 });
      save(); render();
      return `${bank.name} kredi kartı ${formatTL(limit)} limitle eklendi.`;
    }
    case 'setCardDebt': {
      const card = findCardByBank(p.bankName);
      if(!card) return 'Bu bankaya ait bir kredi kartı bulamadım.';
      card.totalDebt = Number(p.amount)||0;
      save(); render();
      return `${bankByCode(card.bankCode).name} kartının toplam borcu ${formatTL(card.totalDebt)} olarak güncellendi.`;
    }
    case 'setCardPlanned': {
      const card = findCardByBank(p.bankName);
      if(!card) return 'Bu bankaya ait bir kredi kartı bulamadım.';
      const amount = Number(p.amount)||0;
      const existing = cardStatement(card.id, state.selectedMonth);
      if(existing) existing.amount = amount;
      else state.cardStatements.push({ id:uid(), cardId:card.id, ym:state.selectedMonth, amount, status:'bekliyor' });
      save(); render();
      return `${bankByCode(card.bankCode).name} kartı için ödenecek miktar ${formatTL(amount)} olarak ayarlandı.`;
    }
    case 'markCardPaid': {
      const card = findCardByBank(p.bankName);
      if(!card) return 'Bu bankaya ait bir kredi kartı bulamadım.';
      const existing = cardStatement(card.id, state.selectedMonth);
      const amt = existing ? existing.amount : 0;
      card.totalDebt = Math.max(0, (card.totalDebt||0) - amt);
      if(existing) existing.status = 'odendi';
      save(); render();
      return `${bankByCode(card.bankCode).name} kartının bu ayki ödemesi (${formatTL(amt)}) yapıldı, borçtan düşüldü.`;
    }
    case 'addKmh': {
      const bank = findBank(p.bankName);
      const limit = Number(p.limit)||0;
      if(!limit) return 'KMH limitini anlayamadım.';
      state.kmhAccounts.push({ id:uid(), bankCode:bank.code, limit, dueDay:15, debt:0, plannedPayment:0, paymentStatus:'bekliyor', paymentStatusYm:null, transactions:[] });
      save(); render();
      return `${bank.name} KMH hesabı ${formatTL(limit)} limitle eklendi.`;
    }
    case 'setKmhDebt': {
      // Toplam Borç (k.debt), Ödenecek Borç'tan (k.plannedPayment) BAĞIMSIZ bir alandır.
      const k = findKmhByBank(p.bankName);
      if(!k) return 'Bu bankaya ait bir KMH hesabı bulamadım.';
      const amount = Number(p.amount)||0;
      k.debt = amount;
      if((k.plannedPayment||0) > amount) k.plannedPayment = amount;
      save(); render();
      return `${bankByCode(k.bankCode).name} KMH toplam borcu ${formatTL(amount)} olarak güncellendi.`;
    }
    case 'markKmhPaid': {
      // Kullanıcının o an ayırdığı Ödenecek Borç tutarı ödenir: bu tutar hem Toplam Borç'tan
      // hem Aylık Borç'tan aynı anda düşer, Ödenecek Borç sıfırlanır, Toplam Limit değişmez.
      const k = findKmhByBank(p.bankName);
      if(!k) return 'Bu bankaya ait bir KMH hesabı bulamadım.';
      const due = k.plannedPayment||0;
      const paid = Math.min(Number(p.amount)||due, due, k.debt||0);
      k.debt = Math.max(0, (k.debt||0) - paid);
      k.plannedPayment = Math.max(0, due - paid);
      save(); render();
      return `${bankByCode(k.bankCode).name} KMH ödemesi (${formatTL(paid)}) yapıldı; Toplam Borç ve Ödenecek Borç aynı anda düştü, kalan limit arttı.`;
    }
    case 'addBill': {
      const amount = Number(p.amount)||0;
      state.bills.push({ id:uid(), name:p.name||p.category||'Fatura', category:p.category||'Diğer', estimatedAmount:amount, dueDay:15, isFixed:false, autoPay:false });
      save(); render();
      return `${p.name||p.category} ${formatTL(amount)} olarak eklendi.`;
    }
    case 'markBillPaid': {
      const bill = findBillByName(p.name);
      if(!bill) return 'Bu isimde bir fatura/abonelik bulamadım.';
      const r = billRecord(bill, state.selectedMonth);
      setBillRecord(bill.id, state.selectedMonth, r.amount, 'odendi');
      save(); render();
      return `${bill.name} ödendi olarak işaretlendi.`;
    }
    case 'setBillAmount': {
      const bill = findBillByName(p.name);
      if(!bill) return 'Bu isimde bir fatura/abonelik bulamadım.';
      const amount = Number(p.amount)||0;
      const r = billRecord(bill, state.selectedMonth);
      setBillRecord(bill.id, state.selectedMonth, amount, r.status);
      save(); render();
      return `${bill.name} tutarı ${formatTL(amount)} olarak güncellendi.`;
    }
    case 'toggleBillAutoPay': {
      const bill = findBillByName(p.name);
      if(!bill) return 'Bu isimde bir fatura/abonelik bulamadım.';
      bill.autoPay = !!p.on;
      save(); render();
      return `${bill.name} için otomatik ödeme talimatı ${bill.autoPay?'açıldı':'kapatıldı'}.`;
    }
    case 'addDebt': {
      const amount = Number(p.amount)||0;
      state.debts.push({ id:uid(), person:p.person||'İsimsiz', direction:p.direction==='alacak'?'alacak':'borcum', debtType:'TL', unit:'TL', amount, date:new Date().toISOString().slice(0,10), paid:false });
      save(); render();
      return `${p.person} için ${formatTL(amount)} kaydı eklendi.`;
    }
    case 'markDebtPaid': {
      const debt = findDebtByPerson(p.person);
      if(!debt) return 'Bu isimde bir elden borç kaydı bulamadım.';
      debt.paid = true;
      save(); render();
      return `${debt.person} ile olan borç ödendi olarak işaretlendi.`;
    }
    case 'setIncome': {
      state.monthlyIncome = Number(p.amount)||0;
      save(); render();
      return `Aylık gelir ${formatTL(state.monthlyIncome)} olarak güncellendi.`;
    }
    default: return 'Bu işlemi henüz yapamıyorum.';
  }
}

// ---- Sohbet akışı (Gemini Function/Tool Calling) ----
// geminiHistory: Gemini'nin "contents" formatında tuttuğumuz gerçek konuşma geçmişi — aiMessages
// (ekranda gösterilen balonlar) ile aynı şey DEĞİLDİR. Her mesajda tüm finans verisi BURAYA
// gömülmez; model ihtiyaç duyduğu veriyi get_/search_/calculate_ araçlarını çağırarak alır.
let geminiHistory = [];
let aiBusy = false; // bir yanıt beklenirken yeni istek gönderilmesini / donmayı engeller
let aiCooldownUntil = 0; // 429 (çok fazla istek) sonrası butonun pasif kalacağı an (Date.now() ms)

async function sendAiMessage(text){
  if(!text) return;
  if(aiBusy) return; // önceki istek hâlâ cevap beklerken aynı isteği ikinci kez gönderme
  if(Date.now() < aiCooldownUntil) return; // 429 sonrası 10 saniyelik bekleme dolmadan yeni istek atma
  if(!getORKey()){ openModal('aiSettings'); return; }
  aiBusy = true;
  const sendBtn = document.querySelector('[data-action="ai-send"]');
  if(sendBtn) sendBtn.disabled = true;
  aiMessages.push({ role:'user', text });
  aiMessages.push({ role:'assistant', text:'…', thinking:true });
  render();
  geminiHistory.push({ role:'user', parts:[{ text }] });
  const thinkingLevel = pickThinkingLevel(text);
  try{
    let finalText = null;
    let pendingCmd = null;
    for(let round=0; round<5 && finalText===null && !pendingCmd; round++){
      const parts = await callGemini(geminiHistory, thinkingLevel);
      // Gemini 3 modelleri (gemini-3.6-flash dahil) fonksiyon çağrılarında bir "thoughtSignature"
      // döner ve bir SONRAKİ istekte bunu AYNEN geri göndermezsen "... is missing a
      // thoughtSignature" mesajıyla 400 Bad Request verir. Bu yüzden fonksiyon çağrısı
      // parçalarını (varsa thoughtSignature'ı da içinde tutarak) OLDUĞU GİBİ geri yazıyoruz —
      // sadece {name,args} çıkarıp yeniden kurmuyoruz. Ayrıca Gemini bir turda BİRDEN FAZLA
      // (paralel) fonksiyon çağrısı da dönebilir; hepsini işliyoruz, sadece ilkini değil.
      const funcCallParts = parts.filter(p=>p.functionCall);
      if(funcCallParts.length){
        geminiHistory.push({ role:'model', parts: funcCallParts });
        const responseParts = [];
        for(const fcPart of funcCallParts){
          const { name, args, id } = fcPart.functionCall;
          if(AI_WRITE_ACTION_NAMES.includes(name)){
            if(!pendingCmd){
              // Yazma (veri değiştiren) aracı — HİÇBİR ZAMAN otomatik çalıştırılmaz. Sadece
              // kullanıcı arayüzde ONAYLA'ya basınca executeAiAction() ile gerçekleşir.
              const respPart = { functionResponse:{ name, response:{ durum:'kullanıcı_onayı_bekleniyor' } } };
              if(id) respPart.functionResponse.id = id;
              // _historyResponsePart: bu nesneye doğrudan referansı saklıyoruz ki kullanıcı
              // ONAYLA/VAZGEÇ'e bastığında, geçmişteki bu yer tutucu yanıtı GERÇEK sonuçla
              // güncelleyebilelim (confirmPendingAction/cancelPendingAction içinde).
              pendingCmd = { action:name, params:args||{}, summary:(args&&args.summary) || 'Bu işlemi yapmak istiyor musun?', _historyResponsePart: respPart };
              responseParts.push(respPart);
            } else {
              // Aynı turda ikinci bir yazma isteği daha gelirse: arayüz tek seferde tek
              // ONAYLA/VAZGEÇ gösterdiği için sadece ilki onaya sunulur, veri asla otomatik
              // değişmez — diğeri açıkça "atlandı" sonucuyla geçiştirilir.
              const respPart = { functionResponse:{ name, response:{ durum:'atlandı_aynı_turda_baska_islem_onay_bekliyor' } } };
              if(id) respPart.functionResponse.id = id;
              responseParts.push(respPart);
            }
          } else {
            // Okuma aracı — hemen çalıştır, sonucu modele geri ver ki cevabı tamamlasın.
            const result = dispatchAiReadTool(name, args||{});
            const respPart = { functionResponse:{ name, response: result==null?{}:{ sonuc: result } } };
            if(id) respPart.functionResponse.id = id;
            responseParts.push(respPart);
          }
        }
        geminiHistory.push({ role:'user', parts: responseParts });
      } else {
        const textPart = parts.find(p=>p.text);
        finalText = (textPart && textPart.text) || 'Cevabı anlayamadım, tekrar sorar mısın?';
        geminiHistory.push({ role:'model', parts:[{ text: finalText }] });
      }
    }
    aiMessages.pop(); // "…" balonunu kaldır
    if(pendingCmd){
      pendingAiAction = pendingCmd;
      aiMessages.push({ role:'assistant', text: pendingCmd.summary, pendingAction: pendingCmd });
    } else {
      aiMessages.push({ role:'assistant', text: finalText || 'Cevabı anlayamadım, tekrar sorar mısın?' });
    }
  } catch(err){
    aiMessages.pop();
    aiMessages.push({ role:'assistant', text: '⚠️ ' + (err.message || 'Beklenmeyen bir hata oluştu, lütfen tekrar dener misin?') });
    // Hatalı turu geçmişten temizle ki bir sonraki mesaj bozuk bir bağlamla başlamasın.
    if(geminiHistory.length && geminiHistory[geminiHistory.length-1].role==='user') geminiHistory.pop();
    if(err.kind==='rate_limit'){
      // 429 (kota/dakikalık limit) alındığında art arda otomatik yeniden deneme YAPILMAZ —
      // bunun yerine kullanıcı görsün diye buton 10 saniyeliğine pasif hale getirilir; süre
      // dolunca kendiliğinden tekrar aktif olur.
      aiCooldownUntil = Date.now() + 10000;
      setTimeout(()=>{ render(); }, 10000);
    }
  } finally {
    aiBusy = false;
    const sendBtn2 = document.querySelector('[data-action="ai-send"]');
    if(sendBtn2) sendBtn2.disabled = false;
  }
  render();
}
function confirmPendingAction(msgIndex){
  const msg = aiMessages[msgIndex];
  if(!msg || !msg.pendingAction) return;
  const pendingAction = msg.pendingAction;
  const resultText = executeAiAction(pendingAction);
  msg.pendingAction = null;
  msg.confirmed = true;
  aiMessages.push({ role:'assistant', text: '✅ ' + resultText });
  // Gemini'ye gönderilen konuşma geçmişindeki "kullanıcı_onayı_bekleniyor" yer tutucusunu,
  // kullanıcının GERÇEKTEN ONAYLA'ya bastığını ve işlemin sonucunu yansıtacak şekilde
  // güncelliyoruz — böylece kullanıcı hemen ardından yeni bir soru sorarsa model bu işlemin
  // gerçekten uygulandığını (ya da uygulanmadığını) bilir, geçmiş tutarsız kalmaz.
  if(pendingAction._historyResponsePart){
    pendingAction._historyResponsePart.functionResponse.response = { durum:'kullanıcı_onayladı_ve_islem_uygulandı', sonuc: resultText };
  }
  render();
}
function cancelPendingAction(msgIndex){
  const msg = aiMessages[msgIndex];
  if(!msg) return;
  const pendingAction = msg.pendingAction;
  msg.pendingAction = null;
  msg.cancelled = true;
  aiMessages.push({ role:'assistant', text: 'İşlem iptal edildi, kayıt değiştirilmedi.' });
  if(pendingAction && pendingAction._historyResponsePart){
    pendingAction._historyResponsePart.functionResponse.response = { durum:'kullanıcı_vazgeçti_islem_uygulanmadı' };
  }
  render();
}

function renderAI(){
  $fab.style.display='none';
  const aiCoolingDown = Date.now() < aiCooldownUntil; // 429 sonrası 10 sn'lik bekleme penceresi
  const bubbles = aiMessages.map((m,i)=>{
    if(m.role==='user'){
      return `<div class="ai-bubble ai-user">${esc(m.text)}</div>`;
    }
    let extra = '';
    if(m.pendingAction){
      extra = `<div class="ai-confirm-row">
        <button class="save-btn" style="margin:6px 4px 0 0;display:inline-block;width:auto;padding:9px 18px;" data-action="ai-confirm" data-idx="${i}">ONAYLA</button>
        <button class="cancel-btn" style="margin:6px 0 0;display:inline-block;width:auto;padding:9px 18px;" data-action="ai-cancel" data-idx="${i}">VAZGEÇ</button>
      </div>`;
    }
    return `<div class="ai-bubble ai-assistant ${m.thinking?'ai-thinking':''}">${esc(m.text).replace(/\n/g,'<br>')}${extra}</div>`;
  }).join('');
  return `
    <div class="ai-chat-wrap">
      <div class="ai-header-row">
        <button data-action="open-modal" data-modal="aiSettings" style="background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;">⚙ API Ayarı</button>
        <button class="ai-close-btn" data-action="ai-close" title="Kapat">✕</button>
      </div>
      <div class="ai-messages" id="aiMessages">
        ${bubbles || '<div class="empty">Merhaba! Kredilerin, kartların, faturaların ve KMH hesapların hakkında soru sorabilir, hesap yaptırabilir ya da yeni kayıt eklememi isteyebilirsin.</div>'}
      </div>
      <div class="ai-input-row">
        <input id="aiInputBox" class="ai-input-box" placeholder="Mesajını yaz..." autocomplete="off" ${(aiBusy||aiCoolingDown)?'disabled':''}>
        <button class="ai-send-btn" data-action="ai-send" ${(aiBusy||aiCoolingDown)?'disabled':''}>${aiBusy?'<span class="ai-send-spinner"></span> Gönderiliyor…':(aiCoolingDown?'Bekleyin…':'Gönder')}</button>
      </div>
    </div>`;
}


function flushAndSave(){
  if(activeInlineCommit) activeInlineCommit();
  save();
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushAndSave(); });
window.addEventListener('pagehide', flushAndSave);
window.addEventListener('beforeunload', flushAndSave);
})();
</script>
