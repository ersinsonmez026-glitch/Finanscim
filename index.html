document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  try{
    if(typeof claude === 'undefined' || !claude.use){
      alert('İndirme özelliği bu görünümde kullanılamıyor.');
      return;
    }
    const downloads = await claude.use('downloads');
    if(!downloads){
      alert('İndirme özelliği bu görünümde kullanılamıyor.');
      return;
    }
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    await downloads.save({ filename: 'borc-takip.html', data: html });
  } catch(e){
    if(e && e.code === 'declined') return;
    console.error('download failed', e);
  }
});
$modalBackdrop.addEventListener('click', e=>{ if(e.target===$modalBackdrop) closeModal(); });

document.body.addEventListener('click', function(e){
  if(e.target.tagName==='INPUT' || e.target.tagName==='SELECT'){ e.stopPropagation(); return; }
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='inline-edit'){
    startInlineEdit(t.dataset.id, t.dataset.field, t);
    return;
  }
  if(action==='edit-income'){
    const row = t.closest('.fin-row');
    const valueEl = row ? row.querySelector('.fr-value') : t;
    startIncomeEdit(valueEl);
    return;
  }
  if(action==='lp-edit'){
    const type=t.dataset.type, id=t.dataset.id;
    closeModal();
    if(type==='loan') openModal('editLoan', id);
    if(type==='card') openModal('cardStatement', id);
    if(type==='kmh') openModal('kmhSettings', id);
    if(type==='bill') openModal('billRecord', id);
    if(type==='debt') openModal('viewDebt', id);
    return;
  }
  if(action==='lp-delete'){
    const type=t.dataset.type, id=t.dataset.id;
    closeModal();
    askConfirm('Bu kaydı silmek istediğine emin misin?', ()=>{
      if(type==='loan'){ state.loans = state.loans.filter(l=>l.id!==id); }
      if(type==='card'){ state.cards = state.cards.filter(c=>c.id!==id); state.cardStatements = state.cardStatements.filter(s=>s.cardId!==id); }
      if(type==='kmh'){ state.kmhAccounts = state.kmhAccounts.filter(k=>k.id!==id); }
      if(type==='bill'){ state.bills = state.bills.filter(b=>b.id!==id); delete state.billOverrides[id]; }
      if(type==='debt'){ state.debts = state.debts.filter(d=>d.id!==id); }
      save(); render();
    });
    return;
  }
  if(action==='pick-month'){
    state.selectedMonth = t.dataset.ym;
    save(); closeModal(); navigate('monthly');
    return;
  }
  if(action==='toggle-card-status'){
    const id = t.dataset.id;
    const card = state.cards.find(c=>c.id===id);
    let st = cardStatement(id, state.selectedMonth);
    if(!st){
      st = { id:uid(), cardId:id, ym:state.selectedMonth, amount:0, status:'odendi' };
      state.cardStatements.push(st);
      card.totalDebt = Math.max(0, (card.totalDebt||0) - st.amount);
    } else if(st.status==='odendi'){
      st.status = 'bekliyor';
      card.totalDebt = (card.totalDebt||0) + st.amount;
    } else {
      st.status = 'odendi';
      card.totalDebt = Math.max(0, (card.totalDebt||0) - st.amount);
    }
    save(); render(); return;
  }

  if(action==='nav'){ navigate(t.dataset.page, t.dataset.id?{loanDetailId:t.dataset.id}:null); return; }
  if(action==='refresh-market'){ fetchLiveRates(); return; }
  if(action==='toggle-loan-sort'){
    ui.loanSort = (ui.loanSort==='amount') ? 'date' : 'amount';
    render(); return;
  }
  if(action==='close-modal'){ closeModal(); return; }
  if(action==='open-modal'){ openModal(t.dataset.modal, t.dataset.id); return; }
  if(action==='toggle-switch'){ t.classList.toggle('on'); return; }

  if(action==='month-prev'){ state.selectedMonth = addMonths(state.selectedMonth,-1); save(); render(); return; }
  if(action==='month-next'){ state.selectedMonth = addMonths(state.selectedMonth,1); save(); render(); return; }

  // choice rows (bill category, direction, debt type, loan type)
  if(t.parentElement && t.parentElement.classList.contains('choice-row') && t.tagName==='BUTTON'){
    const row = t.parentElement;
    row.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    row.dataset.value = t.dataset.val;
    if(row.id==='typeChoice') updateTypeExtra(t.dataset.val);
    return;
  }
  // bank chip grids
  if(t.classList.contains('bank-chip')){
    const row = t.parentElement;
    row.querySelectorAll('.bank-chip').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    row.dataset.value = t.dataset.val;
    return;
  }
  // day picker grid
  if(t.classList.contains('day-cell')){
    const row = t.parentElement;
    row.querySelectorAll('.day-cell').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    row.dataset.value = t.dataset.val;
    return;
  }
  // bill category grid
  if(t.classList.contains('cat-chip')){
    const row = t.parentElement;
    row.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    row.dataset.value = t.dataset.val;
    const wrap = document.getElementById('nameFieldWrap');
    if(wrap) wrap.innerHTML = billNameField(t.dataset.val);
    return;
  }

  if(action==='save-loan'){
    const bankRow=document.getElementById('loanBankChoice'), typeRow=document.getElementById('loanTypeChoice');
    const bankCode = bankRow.dataset.value || bankRow.querySelector('.active').dataset.val;
    const loanType = typeRow.dataset.value || typeRow.querySelector('.active').dataset.val;
    const nameInput=val('f_name'), amount=tlVal('f_amount'), count=parseInt(val('f_count'))||0,
      start=wheelValue('loanDateWheel_m')||state.selectedMonth, day=parseInt(wheelValue('loanDateWheel_d'))||15;
    if(!amount||!count){ alert('Aylık taksit ve taksit sayısı zorunlu.'); return; }
    const name = nameInput || loanType;
    const loanNo = val('f_loanNo').trim();
    const infoRateEl = document.getElementById('f_infoRate');
    const infoRateRaw = infoRateEl ? infoRateEl.value.trim().replace(',','.') : '';
    const infoRateNum = infoRateRaw ? parseFloat(infoRateRaw) : NaN;
    // infoInterestRate SADECE bilgi amaçlıdır — hiçbir hesaplamada (taksit, kalan borç vb.) kullanılmaz.
    state.loans.push({ id:uid(), bankCode, loanType, name, loanNo: loanNo||null, total:amount*count, amount, count, startMonth:start, dueDay:day,
      infoInterestRate: (!isNaN(infoRateNum) && infoRateNum>0) ? infoRateNum : null });
    save(); closeModal(); navigate('loans'); return;
  }
  if(action==='save-loan-edit'){
    const id=t.dataset.id;
    const loan = state.loans.find(l=>l.id===id);
    if(!loan) return;
    const bankRow=document.getElementById('loanBankChoice'), typeRow=document.getElementById('loanTypeChoice');
    const bankCode = bankRow.dataset.value || bankRow.querySelector('.active').dataset.val;
    const loanType = typeRow.dataset.value || typeRow.querySelector('.active').dataset.val;
    const nameInput=val('f_name'), amount=tlVal('f_amount'), count=parseInt(val('f_count'))||0,
      start=wheelValue('loanDateWheel_m')||loan.startMonth, day=parseInt(wheelValue('loanDateWheel_d'))||loan.dueDay;
    const remainingInput = document.getElementById('f_remaining');
    if(!amount||!count){ alert('Aylık taksit ve taksit sayısı zorunlu.'); return; }
    loan.bankCode=bankCode; loan.loanType=loanType; loan.name=nameInput||loanType;
    loan.loanNo = val('f_loanNo').trim() || null;
    loan.amount=amount; loan.count=count; loan.total=amount*count; loan.startMonth=start; loan.dueDay=day;
    const infoRateEl = document.getElementById('f_infoRate');
    const infoRateRaw = infoRateEl ? infoRateEl.value.trim().replace(',','.') : '';
    const infoRateNum = infoRateRaw ? parseFloat(infoRateRaw) : NaN;
    loan.infoInterestRate = (!isNaN(infoRateNum) && infoRateNum>0) ? infoRateNum : null; // Sadece bilgi amaçlı, hesaplamaya dahil edilmez.
    if(remainingInput){
      let remaining = parseInt(remainingInput.value);
      if(!isNaN(remaining)){
        remaining = Math.max(0, Math.min(count, remaining));
        const paidCount = count - remaining;
        for(let i=0;i<count;i++){
          const key = id+'#'+i;
          if(i < paidCount) state.loanStatus[key] = 'odendi';
          else delete state.loanStatus[key];
        }
      }
    }
    save(); closeModal(); navigate('loans'); return;
  }
  if(action==='toggle-installment'){
    const key = t.dataset.loan+'#'+t.dataset.idx;
    state.loanStatus[key] = (state.loanStatus[key]==='odendi') ? 'bekliyor' : 'odendi';
    save(); render(); return;
  }
  if(action==='delete-loan'){
    const id=t.dataset.id;
    closeModal();
    askConfirm('Bu krediyi ve tüm taksit kayıtlarını silmek istediğine emin misin?', ()=>{
      state.loans = state.loans.filter(l=>l.id!==id);
      save(); navigate('loans');
    });
    return;
  }

  if(action==='save-card'){
    const bankRow=document.getElementById('cardBankChoice');
    const bankCode = bankRow.dataset.value || bankRow.querySelector('.active').dataset.val;
    const day = parseInt(wheelValue('cardDayChoice'))||15;
    const limit=tlVal('f_limit');
    if(!limit){ alert('Kart limiti girmeden kart eklenemez.'); return; }
    const totalDebt = tlVal('f_totalDebt');
    const amount = tlVal('f_amount');
    const name = val('f_name');
    const id = uid();
    state.cards.push({ id, bankCode, limit, dueDay:day, totalDebt, name });
    if(amount>0) state.cardStatements.push({ id:uid(), cardId:id, ym:state.selectedMonth, amount, status:'bekliyor' });
    save(); closeModal(); navigate('cards'); return;
  }
  if(action==='save-card-settings'){
    const id=t.dataset.id, limit=tlVal('f_limit'), totalDebt=tlVal('f_totalDebt'), amount=tlVal('f_amount');
    if(!limit){ alert('Kart limiti girmeden kaydedilemez.'); return; }
    const day = parseInt(wheelValue('cardDayChoice'))||15;
    const name = val('f_name');
    const paidOn = document.getElementById('f_paid').classList.contains('on');
    const card = state.cards.find(c=>c.id===id);
    const existing = cardStatement(id, state.selectedMonth);
    const wasPaid = existing && existing.status==='odendi';
    let newTotalDebt = totalDebt;
    if(!wasPaid && paidOn){ newTotalDebt = Math.max(0, newTotalDebt - amount); }
    else if(wasPaid && !paidOn){ newTotalDebt = newTotalDebt + (existing.amount||0); }
    if(card){ card.limit = limit; card.dueDay = day; card.totalDebt = newTotalDebt; card.name = name; }
    if(existing){ existing.amount = amount; existing.status = paidOn?'odendi':'bekliyor'; }
    else if(amount>0 || paidOn) state.cardStatements.push({ id:uid(), cardId:id, ym:state.selectedMonth, amount, status:paidOn?'odendi':'bekliyor' });
    save(); closeModal(); render(); return;
  }
  if(action==='delete-card'){
    const id=t.dataset.id;
    closeModal();
    askConfirm('Bu kartı ve ekstrelerini silmek istediğine emin misin?', ()=>{
      state.cards = state.cards.filter(c=>c.id!==id);
      state.cardStatements = state.cardStatements.filter(s=>s.cardId!==id);
      save(); navigate('cards');
    });
    return;
  }
  if(action==='save-kmh'){
    const bankRow=document.getElementById('kmhBankChoice');
    const bankCode = bankRow.dataset.value || bankRow.querySelector('.active').dataset.val;
    const limit=tlVal('f_limit');
    if(!limit){ alert('KMH limiti girmeden kaydedilemez.'); return; }
    const day = parseInt(wheelValue('kmhDayChoice'))||15;
    const totalDebt = tlVal('f_totalDebt');
    const transactions = totalDebt>0 ? [{ date: todayStr(), amount: totalDebt }] : [];
    state.kmhAccounts.push({ id:uid(), bankCode, limit, dueDay:day, debt:totalDebt, plannedPayment:0, paymentStatus:'bekliyor', paymentStatusYm:null, transactions });
    save(); closeModal(); navigate('kmh'); return;
  }
  if(action==='save-kmh-settings'){
    // Toplam Borç (k.debt) ve Ödenecek Borç (k.plannedPayment) BİRBİRİNDEN BAĞIMSIZ iki alandır:
    // Toplam Borç KMH'nin güncel toplam bakiyesi, Ödenecek Borç ise kullanıcının bu dönem
    // ödemek üzere ayırdığı (Toplam Borç'un tamamı olmak zorunda olmayan) tutardır. Burada
    // ikisi de doğrudan kullanıcının girdiği değere ayarlanır — biri diğerinden hesaplanmaz.
    // Toplam Borç değiştiyse (artış=kullanım, azalış=ödeme), Tah. Toplam Faiz'in gerçek geçmişe
    // göre hesaplanabilmesi için aradaki fark bir işlem (transaction) olarak da kaydedilir.
    const id=t.dataset.id, limit=tlVal('f_limit'), totalDebtInput=tlVal('f_totalDebt'), plannedInput=tlVal('f_planned');
    if(!limit){ alert('KMH limiti girmeden kaydedilemez.'); return; }
    const day = parseInt(wheelValue('kmhDayChoice'))||15;
    const rateEl = document.getElementById('f_kmhRate');
    const rateRaw = rateEl ? rateEl.value.trim().replace(',','.') : '';
    const rateNum = rateRaw ? parseFloat(rateRaw) : NaN;
    const k = state.kmhAccounts.find(x=>x.id===id);
    if(k){
      const delta = totalDebtInput - (k.debt||0);
      if(delta!==0){
        if(!k.transactions) k.transactions=[];
        k.transactions.push({ date: todayStr(), amount: delta });
      }
      k.limit = limit; k.dueDay = day;
      k.debt = totalDebtInput;
      k.plannedPayment = Math.min(plannedInput, totalDebtInput);
      k.customMonthlyRate = (!isNaN(rateNum) && rateNum>0) ? (rateNum/100) : null; // Kullanıcı kendi bankasının gerçek oranını girdiyse esas alınır.
    }
    save(); closeModal(); render(); return;
  }
  if(action==='mark-kmh-paid'){
    // Kullanıcı, o an ayrılmış Ödenecek Borç tutarını ödendi olarak işaretler. Gerçek KMH
    // hesaplarında yapılan ödeme ÖNCE birikmiş faize, kalan kısmı ANAPARAYA uygulanır — yani
    // ödediğin tutarın tamamı kadar borç azalmaz. Bunu doğru yansıtmak için: önce o ana kadar
    // birikmiş tahmini faiz anaparaya eklenir (kapitalize edilir, faiz sayacı sıfırlanır), sonra
    // ödenen tutarın tamamı bu yeni bakiyeden düşülür. Toplam Limit hiç değişmez.
    const id=t.dataset.id;
    const k = state.kmhAccounts.find(x=>x.id===id);
    if(k){
      const planned = k.plannedPayment||0;
      if(planned>0){
        if(!k.transactions) k.transactions=[];
        const bankRate = k.customMonthlyRate!=null ? k.customMonthlyRate : kmhRateForBank(k.bankCode);
        const accrued = calculateKmhInterest(k.transactions, todayStr(), bankRate).total;
        if(accrued>0) k.transactions.push({ date: todayStr(), amount: accrued }); // birikmiş faiz anaparaya eklendi
        k.transactions.push({ date: todayStr(), amount: -planned }); // ödeme
        k.debt = Math.max(0, (k.debt||0) + accrued - planned);
      }
      k.plannedPayment = 0;
    }
    save(); closeModal(); render(); return;
  }
  if(action==='delete-kmh'){
    const id=t.dataset.id;
    closeModal();
    askConfirm('Bu KMH hesabını silmek istediğine emin misin?', ()=>{
      state.kmhAccounts = state.kmhAccounts.filter(k=>k.id!==id);
      save(); navigate('kmh');
    });
    return;
  }

  if(action==='save-bill'){
    const kind = t.dataset.kind || ui.billAddKind || 'bill';
    const kurumRow = document.getElementById('billKurumChoice');
    const category = kurumRow ? (kurumRow.dataset.value || kurumRow.querySelector('.active').dataset.val) : 'Diğer';
    const nameInput=val('f_name'), amount=tlVal('f_amount'), day=parseInt(wheelValue('billDayChoice'))||15;
    const name = nameInput || category;
    const isFixed = document.getElementById('f_isFixed') ? document.getElementById('f_isFixed').classList.contains('on') : false;
    const autoPay = document.getElementById('f_autoPay') ? document.getElementById('f_autoPay').classList.contains('on') : false;
    state.bills.push({ id:uid(), kind, name, category, estimatedAmount:amount, dueDay:day, isFixed, autoPay });
    save(); navigate('bills'); return;
  }
  if(action==='set-bill-kind'){
    ui.billAddKind = t.dataset.kind;
    render(); return;
  }
  if(action==='ai-send'){
    if(aiBusy) return; // yanıt beklenirken aynı isteğin tekrar tekrar gönderilmesini engelle
    if(Date.now() < aiCooldownUntil) return; // 429 sonrası 10 saniyelik bekleme dolmadan yeni istek atma
    const box = document.getElementById('aiInputBox');
    if(box){ const v = box.value.trim(); if(v){ box.value=''; sendAiMessage(v); } }
    return;
  }
  if(action==='ai-confirm'){ confirmPendingAction(parseInt(t.dataset.idx)); return; }
  if(action==='ai-cancel'){ cancelPendingAction(parseInt(t.dataset.idx)); return; }
  if(action==='save-ai-key'){
    const key = val('f_orkey');
    if(key) localStorage.setItem('gemini_api_key', key);
    else localStorage.removeItem('gemini_api_key');
    closeModal();
    return;
  }
  if(action==='ai-close'){ navigate('home'); return; }
  if(action==='toggle-bill-autopay'){
    const bill = state.bills.find(b=>b.id===t.dataset.id);
    if(bill){ bill.autoPay = !bill.autoPay; save(); render(); }
    return;
  }
  if(action==='toggle-bill-fixed'){
    const bill = state.bills.find(b=>b.id===t.dataset.id);
    if(bill){ bill.isFixed = !bill.isFixed; save(); render(); }
    return;
  }
  if(action==='set-bill-filter'){
    ui.billFilter = t.dataset.filter;
    render();
    return;
  }
  if(action==='save-bill-record'){
    const id=t.dataset.id, amount=tlVal('f_amount');
    const paidOn = document.getElementById('f_paid').classList.contains('on');
    const fixedOn = document.getElementById('f_isFixed').classList.contains('on');
    const autoPayOn = document.getElementById('f_autoPay') ? document.getElementById('f_autoPay').classList.contains('on') : false;
    const bill = state.bills.find(b=>b.id===id);
    if(bill){ bill.isFixed = fixedOn; bill.autoPay = autoPayOn; }
    setBillRecord(id, state.selectedMonth, amount, paidOn?'odendi':'bekliyor');
    closeModal(); render(); return;
  }
  if(action==='delete-bill'){
    const id=t.dataset.id;
    closeModal();
    askConfirm('Bu aboneliği silmek istediğine emin misin?', ()=>{
      state.bills = state.bills.filter(b=>b.id!==id);
      delete state.billOverrides[id];
      save(); navigate('bills');
    });
    return;
  }

  if(action==='save-debt'){
    const dirRow=document.getElementById('dirChoice'), typeRow=document.getElementById('typeChoice');
    const direction = dirRow.dataset.value || dirRow.querySelector('.active').dataset.val;
    const debtType = typeRow.dataset.value || typeRow.querySelector('.active').dataset.val;
    const person=val('f_person'), amount=tlVal('f_amount');
    const date = buildDateFromWheel('debtDateWheel');
    if(!person||!amount){ alert('Kişi ve miktar gerekli.'); return; }
    let unit = 'TL';
    if(debtType==='Altin') unit = document.getElementById('f_goldUnit') ? document.getElementById('f_goldUnit').value : 'gram24';
    if(debtType==='Doviz') unit = document.getElementById('f_fxUnit') ? document.getElementById('f_fxUnit').value : 'USD';
    state.debts.push({ id:uid(), person, direction, debtType, unit, amount, date, paid:false });
    save(); closeModal(); navigate('debts'); return;
  }
  if(action==='save-debt-status'){
    const d = state.debts.find(x=>x.id===t.dataset.id);
    d.paid = document.getElementById('f_paid').classList.contains('on');
    save(); closeModal(); navigate('debts'); return;
  }
  if(action==='delete-debt'){
    const id=t.dataset.id;
    closeModal();
    askConfirm('Bu kaydı silmek istediğine emin misin?', ()=>{
      state.debts = state.debts.filter(d=>d.id!==id);
      save(); navigate('debts');
    });
    return;
  }

  if(action==='save-manual-payment'){
    const description=val('f_desc'), amount=tlVal('f_amount');
    const date = buildDateFromWheel('paymentDateWheel') || (state.selectedMonth+'-01');
    const catRow = document.getElementById('manualPayCatChoice');
    const category = catRow ? (catRow.dataset.value || catRow.querySelector('.active').dataset.val) : 'elden';
    if(!description||!amount){ alert('Açıklama ve tutar gerekli.'); return; }
    state.manualPayments.push({ id:uid(), ym:state.selectedMonth, description, amount, date, category, status:'bekliyor' });
    save(); closeModal(); render(); return;
  }
  if(action==='save-manual-payment-edit'){
    const id=t.dataset.id;
    const p = state.manualPayments.find(x=>x.id===id);
    if(!p) return;
    const description=val('f_desc'), amount=tlVal('f_amount');
    const date = buildDateFromWheel('paymentDateWheel') || p.date;
    const catRow = document.getElementById('manualPayCatChoice');
    const category = catRow ? (catRow.dataset.value || catRow.querySelector('.active').dataset.val) : p.category;
    if(!description||!amount){ alert('Açıklama ve tutar gerekli.'); return; }
    p.description=description; p.amount=amount; p.date=date; p.category=category;
    save(); closeModal(); render(); return;
  }
  if(action==='delete-manual-payment'){
    const id=t.dataset.id;
    closeModal();
    askConfirm('Bu ödeme kaydını silmek istediğine emin misin?', ()=>{
      state.manualPayments = state.manualPayments.filter(p=>p.id!==id);
      save(); render();
    });
    return;
  }
  if(action==='toggle-row'){
    const kind=t.dataset.kind;
    if(kind==='loan'){
      const [loanId, idx] = t.dataset.key.split('#');
      state.loanStatus[t.dataset.key] = (state.loanStatus[t.dataset.key]==='odendi')?'bekliyor':'odendi';
      save(); render(); return;
    }
    if(kind==='bill'){
      const b = state.bills.find(x=>x.id===t.dataset.ref);
      const r = billRecord(b, state.selectedMonth);
      setBillRecord(b.id, state.selectedMonth, r.amount, r.status==='odendi'?'bekliyor':'odendi');
      render(); return;
    }
    if(kind==='card'){
      const st = state.cardStatements.find(s=>s.id===t.dataset.key);
      const card = state.cards.find(c=>c.id===t.dataset.ref);
      if(st && card){
        if(st.status==='odendi'){ st.status='bekliyor'; card.totalDebt=(card.totalDebt||0)+st.amount; }
        else { st.status='odendi'; card.totalDebt=Math.max(0,(card.totalDebt||0)-st.amount); }
        save(); render();
      }
      return;
    }
    if(kind==='manual'){
      const p = state.manualPayments.find(x=>x.id===t.dataset.ref);
      if(p){ p.status = p.status==='odendi'?'bekliyor':'odendi'; save(); render(); }
      return;
    }
    if(kind==='debt'){
      const d = state.debts.find(x=>x.id===t.dataset.ref);
      if(d){ d.paid = true; save(); render(); }
      return;
    }
    if(kind==='kmh'){
      // Aylık sayfadaki hızlı geçiş: o an ayrılmış Ödenecek Borç tutarını öder/geri açar.
      // Toplam Borç'un tamamını değil, sadece bu dönem için planlanan tutarı etkiler.
      const k = state.kmhAccounts.find(x=>x.id===t.dataset.ref);
      if(k){
        if((k.plannedPayment||0) <= 0 && k.lastPlanned){
          k.plannedPayment = k.lastPlanned;
          k.debt = (k.debt||0) + k.lastPlanned;
          k.lastPlanned = 0;
        } else if((k.plannedPayment||0) > 0){
          k.lastPlanned = k.plannedPayment;
          k.debt = Math.max(0, (k.debt||0) - k.plannedPayment);
          k.plannedPayment = 0;
        }
        save(); render();
      }
      return;
    }
  }
});

function updateTypeExtra(type){
  const el = document.getElementById('typeExtra');
  if(!el) return;
  if(type==='Altin'){
    el.innerHTML = `<div class="field"><label>Altın Türü</label><select id="f_goldUnit">
      ${Object.keys(GOLD_LABELS).map(k=>`<option value="${k}">${GOLD_LABELS[k]}</option>`).join('')}</select></div>`;
  } else if(type==='Doviz'){
    el.innerHTML = `<div class="field"><label>Döviz</label><select id="f_fxUnit"><option value="USD">USD</option><option value="EUR">EUR</option></select></div>`;
  } else { el.innerHTML=''; }
}

function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function numVal(id){ const v=parseFloat(val(id)); return isNaN(v)?0:v; }
function tlVal(id){
  const el = document.getElementById(id);
  if(!el) return 0;
  const digits = el.value.replace(/\D/g,'');
  return digits ? parseInt(digits,10) : 0;
}
function formatTLInputLive(el){
  el.addEventListener('input', ()=>{
    const digits = el.value.replace(/\D/g,'');
    el.value = digits ? Number(digits).toLocaleString('tr-TR') : '';
  });
}

let activeInlineCommit = null;
function startIncomeEdit(spanEl){
  const current = state.monthlyIncome||0;
  spanEl.innerHTML = `<input type="text" inputmode="numeric" class="fin-inline-input">`;
  const inp = spanEl.querySelector('input');
  inp.value = current ? current.toLocaleString('tr-TR') : '';
  formatTLInputLive(inp);
  inp.focus(); inp.select();
  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    activeInlineCommit = null;
    const digits = inp.value.replace(/\D/g,'');
    state.monthlyIncome = digits ? parseInt(digits,10) : 0;
    save(); render();
  }
  activeInlineCommit = commit;
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
}
function startInlineEdit(entityId, field, spanEl){
  const isKmh = field==='kmhDebt' || field==='kmhPlanned';
  const card = isKmh ? state.kmhAccounts.find(k=>k.id===entityId) : state.cards.find(c=>c.id===entityId);
  if(!card) return;
  let current = 0;
  if(field==='totalDebt') current = card.totalDebt||0;
  else if(field==='kmhDebt') current = card.debt||0;
  else if(field==='kmhPlanned') current = card.plannedPayment||0;
  else if(field==='amount'){ const st = cardStatement(entityId, state.selectedMonth); current = st?st.amount:0; }
  spanEl.innerHTML = `<input type="text" inputmode="numeric" class="cc-inline-input">`;
  const inp = spanEl.querySelector('input');
  inp.value = current ? current.toLocaleString('tr-TR') : '';
  formatTLInputLive(inp);
  inp.focus(); inp.select();
  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    activeInlineCommit = null;
    const digits = inp.value.replace(/\D/g,'');

      else state.cardStatements.push({ id:uid(), cardId:entityId, ym:state.selectedMonth, amount, status:'bekliyor' });
    }
    save(); render();

}

// İstek en az 15 saniye yanıt bekler (zaman aşımı) — bu süre dolmadan "modele ulaşılamadı" gibi
// erken bir hata gösterilmez; yanıt gerçekten hiç gelmezse AbortController isteği keser ve
// kullanıcıya net bir "zaman aşımı" mesajı gösterilir.
const AI_REQUEST_TIMEOUT_MS = 20000;

async function geminiRequest(url, key, body){
  let resp;
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), AI_REQUEST_TIMEOUT_MS);
  try{
    resp = await fetch(url + '?key=' + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
  }catch(networkErr){
    if(networkErr && networkErr.name === 'AbortError'){
      const e = new Error('Yapay zekadan yanıt gelmedi (zaman aşımı). Lütfen tekrar dener misin?');
      e.kind = 'timeout';
      throw e;
    }
    const e = new Error('Yapay zekaya bağlanılamadı. İnternet bağlantını kontrol edip tekrar dener misin?');
    e.kind = 'network';
    throw e;
  }finally{
    clearTimeout(timeoutId);
  }
  if(!resp.ok){
    let detail = '';
    try{ detail = await resp.text(); }catch(_e){}
    // Hangi HTTP kodunun (400/404/429/vb.) ve hangi gerçek Google hata metninin döndüğü, kullanıcıya
    // gösterilen sadeleştirilmiş Türkçe mesajdan bağımsız olarak, HER ZAMAN konsola tam olarak yazılır
    // — böylece tarayıcının geliştirici konsolundan sorunun gerçek kaynağı kesin olarak görülebilir.
    console.log('[Gemini API] İstek başarısız — URL:', url, '| HTTP durum kodu:', resp.status, resp.statusText);
    console.log('[Gemini API] Ham hata yanıtı:', detail || '(gövde boş)');
    const e = new Error('http_'+resp.status);
    e.status = resp.status;
    e.detail = detail;
    throw e;
  }
  let data;
  try{ data = await resp.json(); }
  catch(e2){ const e = new Error('Yapay zekadan beklenmeyen bir cevap geldi, lütfen tekrar dener misin?'); e.kind='parse'; throw e; }
  const candidate = data.candidates && data.candidates[0];
  const parts = candidate && candidate.content && candidate.content.parts;
  if(!parts || !parts.length){
    const e = new Error('Yapay zekadan boş bir cevap geldi, lütfen tekrar dener misin?');
    e.kind = 'empty';
    throw e;
  }
  return parts;
}

// Gemini'nin fonksiyon çağırma şeması, parametresi OLMAYAN bir fonksiyon için "parameters"
// alanının hiç GÖNDERİLMEMESİNİ bekler — boş bir "properties:{}" nesnesi göndermek isteği
// tamamen geçersiz kılıp 400 Bad Request ile reddedilmesine yol açabiliyor (ve tek bir bozuk
// araç tanımı, tools listesindeki TÜM 28 aracı birden geçersiz kılıyor — bu yüzden basit sorular
// da dahil HER istek başarısız oluyordu). Gönderim öncesi bu alanı burada temizliyoruz.
function sanitizeToolDeclarations(tools){
  return tools.map(t=>{
    const params = t.parameters;
    if(params && params.properties && Object.keys(params.properties).length===0){
      const { parameters, ...rest } = t;
      return rest;
    }
    return t;
  });
}

// Kullanıcının açık isteği üzerine: HİÇBİR otomatik tekrar deneme (auto-retry/loop) YOK.
// "Gönder" butonuna bir kez basıldığında Gemini'ye TAM OLARAK 1 istek gider; hata (400/404/429/
// ağ hatası, ne olursa olsun) hemen kullanıcıya anlaşılır bir Türkçe mesajla bildirilir ve
// uygulama kendi kendine yeniden denemez. Kullanıcı isterse "Gönder"e tekrar basarak yeni bir
// istek başlatabilir — bu da yine tek seferlik bir istektir.
async function callGemini(contents, thinkingLevel){
  const key = getORKey();
  if(!key) throw new Error('API anahtarı ayarlanmamış. Lütfen önce 🤖 simgesinden anahtarını gir.');
  const body = {
    systemInstruction: { parts:[{ text: buildAiSystemPrompt() }] },
    contents,
    tools: [{ functionDeclarations: sanitizeToolDeclarations(AI_READ_TOOLS.concat(AI_ACTION_TOOLS)) }],
  };
  // generationConfig, sadece geçerli/desteklenen bir değer üretildiğinde eklenir — geçersiz veya
  // boş bir alanın isteğe hiç girmemesi, "Unknown name" tipi 400 hatalarının önüne geçer.
  const genConfig = buildGenerationConfig(thinkingLevel);
  if(genConfig) body.generationConfig = genConfig;
  try{
    return await geminiRequest(geminiUrlFor(AI_MODEL), key, body);
  }catch(err){
    if(err.kind==='network' || err.kind==='parse' || err.kind==='empty' || err.kind==='timeout') throw err;
    if(err.status===401 || err.status===403) throw new Error('API anahtarı geçersiz görünüyor. 🤖 simgesinden anahtarını kontrol et.');
    if(err.status===400) throw new Error('Yapay zeka isteği geçersiz görünüyor. Lütfen tekrar dener misin?');
    if(err.status===404) throw new Error('Yapay zeka modeline ulaşılamadı. Lütfen daha sonra tekrar dener misin?');
    if(err.status===429){
      const e = new Error('Çok hızlı mesaj gönderdiniz, lütfen 10 saniye bekleyin.');
      e.kind = 'rate_limit';
      throw e;
    }
    throw new Error('Yapay zeka şu anda cevap veremedi, lütfen tekrar dener misin?');
  }
}

// orta düşünme seviyesi — hız için gereksiz yere yüksek seviye kullanılmaz.
function pickThinkingLevel(text){
  const q = (text||'').toLocaleLowerCase('tr');
  const complexHints = ['analiz','özet','karşılaştır','tahmin','plan','strateji','rapor','öner','değerlendir'];
  return complexHints.some(h=>q.includes(h)) ? 'medium' : 'low';
}

function findBank(nameFragment){
  const q = (nameFragment||'').toLocaleLowerCase('tr');
  if(!q) return bankByCode('diger');
  return BANKS.find(b=>b.name.toLocaleLowerCase('tr').includes(q) || b.short.toLocaleLowerCase('tr').includes(q) || q.includes(b.short.toLocaleLowerCase('tr'))) || bankByCode('diger');
}
function findLoanByName(name){
  const q = (name||'').toLocaleLowerCase('tr');
  return state.loans.find(l=>l.name.toLocaleLowerCase('tr').includes(q) || bankByCode(l.bankCode).name.toLocaleLowerCase('tr').includes(q));
}
function findCardByBank(name){
  const bank = findBank(name);
  const match = state.cards.find(c=>c.bankCode===bank.code);
  if(match) return match;
  if((!name || bank.code==='diger') && state.cards.length===1) return state.cards[0];
  return null;
}
function findKmhByBank(name){
  const bank = findBank(name);
  const match = state.kmhAccounts.find(k=>k.bankCode===bank.code);
  if(match) return match;
  if((!name || bank.code==='diger') && state.kmhAccounts.length===1) return state.kmhAccounts[0];
  return null;
}
function findBillByName(name){
  const q = (name||'').toLocaleLowerCase('tr');
  return state.bills.find(b=>b.name.toLocaleLowerCase('tr').includes(q) || b.category.toLocaleLowerCase('tr').includes(q));
}
function findDebtByPerson(name){
  const q = (name||'').toLocaleLowerCase('tr');
  return state.debts.find(d=>d.person.toLocaleLowerCase('tr').includes(q));
}

// Bu fonksiyon SADECE kullanıcı ONAYLA butonuna bastığında çağrılır — hiçbir zaman
// yapay zeka cevabı geldiği anda otomatik çalıştırılmaz.
function executeAiAction(cmd){
  if(!cmd || !cmd.action) return 'Anlayamadım, tekrar dener misin?';
  const p = cmd.params || cmd;
  switch(cmd.action){
    case 'addLoan': {
      const bank = findBank(p.bankName);
      const amount = Number(p.amount)||0, count = Number(p.count)||0;
      if(!amount||!count) return 'Tutar ve taksit sayısını anlayamadım.';
      state.loans.push({ id:uid(), bankCode:bank.code, loanType:p.loanType||'İhtiyaç Kredisi', name:p.loanType||'Kredi', amount, count, total:amount*count, startMonth:monthKey(new Date()), dueDay:15 });
      save(); render();
      return `${bank.name} için aylık ${formatTL(amount)}, ${count} taksitli kredi eklendi.`;
    }
    case 'markLoanPaid': {
      const loan = findLoanByName(p.loanName);
      if(!loan) return 'Bu isimde bir kredi bulamadım.';
      const next = loanInstallments(loan).find(i=>i.status!=='odendi');
      if(!next) return 'Bu kredinin tüm taksitleri zaten ödenmiş.';
      state.loanStatus[next.key] = 'odendi';
      save(); render();
      return `${loan.name} kredisinin bir sonraki taksiti ödendi olarak işaretlendi.`;
    }
    case 'addCard': {
      const bank = findBank(p.bankName);
      const limit = Number(p.limit)||0;
      if(!limit) return 'Kart limitini anlayamadım.';
      state.cards.push({ id:uid(), bankCode:bank.code, limit, dueDay:15, totalDebt:0 });
      save(); render();
      return `${bank.name} kredi kartı ${formatTL(limit)} limitle eklendi.`;
    }
    case 'setCardDebt': {
      const card = findCardByBank(p.bankName);
      if(!card) return 'Bu bankaya ait bir kredi kartı bulamadım.';
      card.totalDebt = Number(p.amount)||0;
      save(); render();
      return `${bankByCode(card.bankCode).name} kartının toplam borcu ${formatTL(card.totalDebt)} olarak güncellendi.`;
    }
    case 'setCardPlanned': {
      const card = findCardByBank(p.bankName);
      if(!card) return 'Bu bankaya ait bir kredi kartı bulamadım.';
      const amount = Number(p.amount)||0;
      const existing = cardStatement(card.id, state.selectedMonth);
      if(existing) existing.amount = amount;
      else state.cardStatements.push({ id:uid(), cardId:card.id, ym:state.selectedMonth, amount, status:'bekliyor' });
      save(); render();
      return `${bankByCode(card.bankCode).name} kartı için ödenecek miktar ${formatTL(amount)} olarak ayarlandı.`;
    }
    case 'markCardPaid': {
      const card = findCardByBank(p.bankName);
      if(!card) return 'Bu bankaya ait bir kredi kartı bulamadım.';
      const existing = cardStatement(card.id, state.selectedMonth);
      const amt = existing ? existing.amount : 0;
      card.totalDebt = Math.max(0, (card.totalDebt||0) - amt);
      if(existing) existing.status = 'odendi';
      save(); render();
      return `${bankByCode(card.bankCode).name} kartının bu ayki ödemesi (${formatTL(amt)}) yapıldı, borçtan düşüldü.`;
    }
    case 'addKmh': {
      const bank = findBank(p.bankName);
      const limit = Number(p.limit)||0;
      if(!limit) return 'KMH limitini anlayamadım.';
      state.kmhAccounts.push({ id:uid(), bankCode:bank.code, limit, dueDay:15, debt:0, plannedPayment:0, paymentStatus:'bekliyor', paymentStatusYm:null, transactions:[] });
      save(); render();
      return `${bank.name} KMH hesabı ${formatTL(limit)} limitle eklendi.`;
    }
    case 'setKmhDebt': {
      // Toplam Borç (k.debt), Ödenecek Borç'tan (k.plannedPayment) BAĞIMSIZ bir alandır.
      // Fark, Tah. Toplam Faiz'in gerçek geçmişe göre hesaplanabilmesi için işlem olarak da kaydedilir.
      const k = findKmhByBank(p.bankName);
      if(!k) return 'Bu bankaya ait bir KMH hesabı bulamadım.';
      const amount = Number(p.amount)||0;
      const delta = amount - (k.debt||0);
      if(delta!==0){ if(!k.transactions) k.transactions=[]; k.transactions.push({ date: todayStr(), amount: delta }); }
      k.debt = amount;
      if((k.plannedPayment||0) > amount) k.plannedPayment = amount;
      save(); render();
      return `${bankByCode(k.bankCode).name} KMH toplam borcu ${formatTL(amount)} olarak güncellendi.`;
    }
    case 'markKmhPaid': {
      // Ödeme ÖNCE birikmiş faize, kalanı anaparaya uygulanır: önce tahmini faiz anaparaya
      // kapitalize edilir (faiz sayacı sıfırlanır), sonra ödenen tutarın tamamı düşülür.
      const k = findKmhByBank(p.bankName);
      if(!k) return 'Bu bankaya ait bir KMH hesabı bulamadım.';
      const due = k.plannedPayment||0;
      const paid = Math.min(Number(p.amount)||due, due, k.debt||0);
      let accrued = 0;
      if(paid>0){
        if(!k.transactions) k.transactions=[];
        const bankRate = k.customMonthlyRate!=null ? k.customMonthlyRate : kmhRateForBank(k.bankCode);
        accrued = calculateKmhInterest(k.transactions, todayStr(), bankRate).total;
        if(accrued>0) k.transactions.push({ date: todayStr(), amount: accrued });
        k.transactions.push({ date: todayStr(), amount: -paid });
      }
      k.debt = Math.max(0, (k.debt||0) + accrued - paid);
      k.plannedPayment = Math.max(0, due - paid);
      save(); render();
      return `${bankByCode(k.bankCode).name} KMH ödemesi (${formatTL(paid)}) yapıldı; birikmiş faiz önce anaparaya eklendi, kalan tutar borçtan düştü.`;
    }
    case 'addBill': {
      const amount = Number(p.amount)||0;
      state.bills.push({ id:uid(), name:p.name||p.category||'Fatura', category:p.category||'Diğer', estimatedAmount:amount, dueDay:15, isFixed:false, autoPay:false });
      save(); render();
      return `${p.name||p.category} ${formatTL(amount)} olarak eklendi.`;
    }
    case 'markBillPaid': {
      const bill = findBillByName(p.name);
      if(!bill) return 'Bu isimde bir fatura/abonelik bulamadım.';
      const r = billRecord(bill, state.selectedMonth);
      setBillRecord(bill.id, state.selectedMonth, r.amount, 'odendi');
      save(); render();
      return `${bill.name} ödendi olarak işaretlendi.`;
    }
    case 'setBillAmount': {
      const bill = findBillByName(p.name);
      if(!bill) return 'Bu isimde bir fatura/abonelik bulamadım.';
      const amount = Number(p.amount)||0;
      const r = billRecord(bill, state.selectedMonth);
      setBillRecord(bill.id, state.selectedMonth, amount, r.status);
      save(); render();
      return `${bill.name} tutarı ${formatTL(amount)} olarak güncellendi.`;
    }
    case 'toggleBillAutoPay': {
      const bill = findBillByName(p.name);
      if(!bill) return 'Bu isimde bir fatura/abonelik bulamadım.';
      bill.autoPay = !!p.on;
      save(); render();
      return `${bill.name} için otomatik ödeme talimatı ${bill.autoPay?'açıldı':'kapatıldı'}.`;
    }
    case 'addDebt': {
      const amount = Number(p.amount)||0;
      state.debts.push({ id:uid(), person:p.person||'İsimsiz', direction:p.direction==='alacak'?'alacak':'borcum', debtType:'TL', unit:'TL', amount, date:new Date().toISOString().slice(0,10), paid:false });
      save(); render();
      return `${p.person} için ${formatTL(amount)} kaydı eklendi.`;
    }
    case 'markDebtPaid': {
      const debt = findDebtByPerson(p.person);
      if(!debt) return 'Bu isimde bir elden borç kaydı bulamadım.';
      debt.paid = true;
      save(); render();
      return `${debt.person} ile olan borç ödendi olarak işaretlendi.`;
    }
    case 'setIncome': {
      state.monthlyIncome = Number(p.amount)||0;
      save(); render();
      return `Aylık gelir ${formatTL(state.monthlyIncome)} olarak güncellendi.`;
    }
    default: return 'Bu işlemi henüz yapamıyorum.';
  }
}

// ---- Sohbet akışı (Gemini Function/Tool Calling) ----
// geminiHistory: Gemini'nin "contents" formatında tuttuğumuz gerçek konuşma geçmişi — aiMessages
// (ekranda gösterilen balonlar) ile aynı şey DEĞİLDİR. Her mesajda tüm finans verisi BURAYA
// gömülmez; model ihtiyaç duyduğu veriyi get_/search_/calculate_ araçlarını çağırarak alır.
let geminiHistory = [];
let aiBusy = false; // bir yanıt beklenirken yeni istek gönderilmesini / donmayı engeller
let aiCooldownUntil = 0; // 429 (çok fazla istek) sonrası butonun pasif kalacağı an (Date.now() ms)

async function sendAiMessage(text){
  if(!text) return;
  if(aiBusy) return; // önceki istek hâlâ cevap beklerken aynı isteği ikinci kez gönderme
  if(Date.now() < aiCooldownUntil) return; // 429 sonrası 10 saniyelik bekleme dolmadan yeni istek atma
  if(!getORKey()){ openModal('aiSettings'); return; }
  aiBusy = true;
  const sendBtn = document.querySelector('[data-action="ai-send"]');
  if(sendBtn) sendBtn.disabled = true;
  aiMessages.push({ role:'user', text });
  aiMessages.push({ role:'assistant', text:'…', thinking:true });
  render();
  geminiHistory.push({ role:'user', parts:[{ text }] });
  const thinkingLevel = pickThinkingLevel(text);
  try{
    let finalText = null;
    let pendingCmd = null;
    for(let round=0; round<5 && finalText===null && !pendingCmd; round++){
      const parts = await callGemini(geminiHistory, thinkingLevel);
      // Gemini 3 modelleri (gemini-3.6-flash dahil) fonksiyon çağrılarında bir "thoughtSignature"
      // döner ve bir SONRAKİ istekte bunu AYNEN geri göndermezsen "... is missing a
      // thoughtSignature" mesajıyla 400 Bad Request verir. Bu yüzden fonksiyon çağrısı
      // parçalarını (varsa thoughtSignature'ı da içinde tutarak) OLDUĞU GİBİ geri yazıyoruz —
      // sadece {name,args} çıkarıp yeniden kurmuyoruz. Ayrıca Gemini bir turda BİRDEN FAZLA
      // (paralel) fonksiyon çağrısı da dönebilir; hepsini işliyoruz, sadece ilkini değil.
      const funcCallParts = parts.filter(p=>p.functionCall);
      if(funcCallParts.length){
        geminiHistory.push({ role:'model', parts: funcCallParts });
        const responseParts = [];
        for(const fcPart of funcCallParts){
          const { name, args, id } = fcPart.functionCall;
          if(AI_WRITE_ACTION_NAMES.includes(name)){
            if(!pendingCmd){
              // Yazma (veri değiştiren) aracı — HİÇBİR ZAMAN otomatik çalıştırılmaz. Sadece
              // kullanıcı arayüzde ONAYLA'ya basınca executeAiAction() ile gerçekleşir.
              const respPart = { functionResponse:{ name, response:{ durum:'kullanıcı_onayı_bekleniyor' } } };
              if(id) respPart.functionResponse.id = id;
              // _historyResponsePart: bu nesneye doğrudan referansı saklıyoruz ki kullanıcı
              // ONAYLA/VAZGEÇ'e bastığında, geçmişteki bu yer tutucu yanıtı GERÇEK sonuçla
              // güncelleyebilelim (confirmPendingAction/cancelPendingAction içinde).
              pendingCmd = { action:name, params:args||{}, summary:(args&&args.summary) || 'Bu işlemi yapmak istiyor musun?', _historyResponsePart: respPart };
              responseParts.push(respPart);
            } else {
              // Aynı turda ikinci bir yazma isteği daha gelirse: arayüz tek seferde tek
              // ONAYLA/VAZGEÇ gösterdiği için sadece ilki onaya sunulur, veri asla otomatik
              // değişmez — diğeri açıkça "atlandı" sonucuyla geçiştirilir.
              const respPart = { functionResponse:{ name, response:{ durum:'atlandı_aynı_turda_baska_islem_onay_bekliyor' } } };
              if(id) respPart.functionResponse.id = id;
              responseParts.push(respPart);
            }
          } else {
            // Okuma aracı — hemen çalıştır, sonucu modele geri ver ki cevabı tamamlasın.
            const result = dispatchAiReadTool(name, args||{});
            const respPart = { functionResponse:{ name, response: result==null?{}:{ sonuc: result } } };
            if(id) respPart.functionResponse.id = id;
            responseParts.push(respPart);
          }
        }
        geminiHistory.push({ role:'user', parts: responseParts });
      } else {
        const textPart = parts.find(p=>p.text);
        finalText = (textPart && textPart.text) || 'Cevabı anlayamadım, tekrar sorar mısın?';
        geminiHistory.push({ role:'model', parts:[{ text: finalText }] });
      }
    }
    aiMessages.pop(); // "…" balonunu kaldır
    if(pendingCmd){
      pendingAiAction = pendingCmd;
      aiMessages.push({ role:'assistant', text: pendingCmd.summary, pendingAction: pendingCmd });
    } else {
      aiMessages.push({ role:'assistant', text: finalText || 'Cevabı anlayamadım, tekrar sorar mısın?' });
    }
  } catch(err){
    aiMessages.pop();
    aiMessages.push({ role:'assistant', text: '⚠️ ' + (err.message || 'Beklenmeyen bir hata oluştu, lütfen tekrar dener misin?') });
    // Hatalı turu geçmişten temizle ki bir sonraki mesaj bozuk bir bağlamla başlamasın.
    if(geminiHistory.length && geminiHistory[geminiHistory.length-1].role==='user') geminiHistory.pop();
    if(err.kind==='rate_limit'){
      // 429 (kota/dakikalık limit) alındığında art arda otomatik yeniden deneme YAPILMAZ —
      // bunun yerine kullanıcı görsün diye buton 10 saniyeliğine pasif hale getirilir; süre
      // dolunca kendiliğinden tekrar aktif olur.
      aiCooldownUntil = Date.now() + 10000;
      setTimeout(()=>{ render(); }, 10000);
    }
  } finally {
    aiBusy = false;
    const sendBtn2 = document.querySelector('[data-action="ai-send"]');
    if(sendBtn2) sendBtn2.disabled = false;
  }
  render();
}
function confirmPendingAction(msgIndex){
  const msg = aiMessages[msgIndex];
  if(!msg || !msg.pendingAction) return;
  const pendingAction = msg.pendingAction;
  const resultText = executeAiAction(pendingAction);
  msg.pendingAction = null;
  msg.confirmed = true;
  aiMessages.push({ role:'assistant', text: '✅ ' + resultText });
  // Gemini'ye gönderilen konuşma geçmişindeki "kullanıcı_onayı_bekleniyor" yer tutucusunu,
  // kullanıcının GERÇEKTEN ONAYLA'ya bastığını ve işlemin sonucunu yansıtacak şekilde
  // güncelliyoruz — böylece kullanıcı hemen ardından yeni bir soru sorarsa model bu işlemin
  // gerçekten uygulandığını (ya da uygulanmadığını) bilir, geçmiş tutarsız kalmaz.
  if(pendingAction._historyResponsePart){
    pendingAction._historyResponsePart.functionResponse.response = { durum:'kullanıcı_onayladı_ve_islem_uygulandı', sonuc: resultText };
  }
  render();
}
function cancelPendingAction(msgIndex){
  const msg = aiMessages[msgIndex];
  if(!msg) return;
  const pendingAction = msg.pendingAction;
  msg.pendingAction = null;
  msg.cancelled = true;
  aiMessages.push({ role:'assistant', text: 'İşlem iptal edildi, kayıt değiştirilmedi.' });
  if(pendingAction && pendingAction._historyResponsePart){
    pendingAction._historyResponsePart.functionResponse.response = { durum:'kullanıcı_vazgeçti_islem_uygulanmadı' };
  }
  render();
}

function renderAI(){
  $fab.style.display='none';
  const aiCoolingDown = Date.now() < aiCooldownUntil; // 429 sonrası 10 sn'lik bekleme penceresi
  const bubbles = aiMessages.map((m,i)=>{
    if(m.role==='user'){
      return `<div class="ai-bubble ai-user">${esc(m.text)}</div>`;
    }
    let extra = '';
    if(m.pendingAction){
      extra = `<div class="ai-confirm-row">
        <button class="save-btn" style="margin:6px 4px 0 0;display:inline-block;width:auto;padding:9px 18px;" data-action="ai-confirm" data-idx="${i}">ONAYLA</button>
        <button class="cancel-btn" style="margin:6px 0 0;display:inline-block;width:auto;padding:9px 18px;" data-action="ai-cancel" data-idx="${i}">VAZGEÇ</button>
      </div>`;
    }
    return `<div class="ai-bubble ai-assistant ${m.thinking?'ai-thinking':''}">${esc(m.text).replace(/\n/g,'<br>')}${extra}</div>`;
  }).join('');
  return `
    <div class="ai-chat-wrap">
      <div class="ai-header-row">
        <button data-action="open-modal" data-modal="aiSettings" style="background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;">⚙ API Ayarı</button>
        <button class="ai-close-btn" data-action="ai-close" title="Kapat">✕</button>
      </div>
      <div class="ai-messages" id="aiMessages">
        ${bubbles || '<div class="empty">Merhaba! Kredilerin, kartların, faturaların ve KMH hesapların hakkında soru sorabilir, hesap yaptırabilir ya da yeni kayıt eklememi isteyebilirsin.</div>'}
      </div>
      <div class="ai-input-row">
        <input id="aiInputBox" class="ai-input-box" placeholder="Mesajını yaz..." autocomplete="off" ${(aiBusy||aiCoolingDown)?'disabled':''}>
        <button class="ai-send-btn" data-action="ai-send" ${(aiBusy||aiCoolingDown)?'disabled':''}>${aiBusy?'<span class="ai-send-spinner"></span> Gönderiliyor…':(aiCoolingDown?'Bekleyin…':'Gönder')}</button>
      </div>
    </div>`;
}


function flushAndSave(){
  if(activeInlineCommit) activeInlineCommit();
  save();
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushAndSave(); });
window.addEventListener('pagehide', flushAndSave);
window.addEventListener('beforeunload', flushAndSave);
})();
</script>
